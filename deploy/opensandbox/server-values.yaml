fullnameOverride: opensandbox
namespaceOverride: talgent
imagePullSecrets:
  - name: ghcr-pull
server:
  image:
    repository: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/server
    tag: release-1.2.1@sha256:07f9b39adb8cadf68357dd1b86367068210e960fc4cb50e11b75176387557ea7
  # The chart default (4Gi/1 CPU requests) far exceeds this server's use; it
  # idles near 120Mi.
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  podAnnotations:
    talgent.io/runtime-config-sha256: TALGENT_RUNTIME_CONFIG_SHA256
  env:
    - name: OPENSANDBOX_SERVER_API_KEY
      valueFrom:
        secretKeyRef:
          name: opensandbox-api
          key: api-key
  volumeMounts:
    - name: workload-template
      mountPath: /etc/opensandbox/talgent.batchsandbox.yaml
      subPath: talgent.batchsandbox.yaml
      readOnly: true
  volumes:
    - name: workload-template
      configMap:
        name: opensandbox-workload-template
configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  [runtime]
  type = "kubernetes"
  execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.2.1@sha256:6b12d17844ac7167271488302c71934e47f76abb9ddab19ec8529bd1c1c56b23"
  [egress]
  image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:release-1.2.1@sha256:84b98d3b5989a87389c977f6433f8cd3c7998d03aa15aaae41ebcb15b7eb8000"
  mode = "dns+nft"
  readiness_timeout_seconds = 60.0
  [kubernetes]
  # The server always watches Fast Sandbox SandboxSnapshots (sandbox.fast.io).
  # This deployment installs no Fast Sandbox CRDs, so the server logs a 404
  # "Informer watch error" every 30 seconds; sandboxes are unaffected.
  # Upstream #2875 reports it once; it ships after 1.2.1.
  kubeconfig_path = ""
  namespace = "talgent-sandbox"
  workload_provider = "batchsandbox"
  sandbox_create_timeout_seconds = 300
  batchsandbox_template_file = "/etc/opensandbox/talgent.batchsandbox.yaml"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox
  namespace: talgent
  labels:
    helm.sh/chart: opensandbox-server-1.2.1
    app.kubernetes.io/name: opensandbox-server
    app.kubernetes.io/instance: opensandbox
    app.kubernetes.io/version: "1.2.1"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: opensandbox-server
    app.kubernetes.io/part-of: opensandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-server
      app.kubernetes.io/instance: opensandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-server
        app.kubernetes.io/instance: opensandbox
        app.kubernetes.io/part-of: opensandbox
      annotations:
        # The server parses config.toml once at startup, so an in-place update
        # of the ConfigMap leaves the running pod on the previous configuration.
        # Hashing the rendered TOML rolls the Deployment whenever it changes.
        checksum/config: 488a98d46128de8e7ae3fb801f0133579e40326b2868133aa949aa54a51f68df
        talgent.io/runtime-config-sha256: TALGENT_RUNTIME_CONFIG_SHA256
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      serviceAccountName: opensandbox
      containers:
        - name: main
          image: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/server:release-1.2.1@sha256:07f9b39adb8cadf68357dd1b86367068210e960fc4cb50e11b75176387557ea7
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/opensandbox/config.toml"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: SANDBOX_CONFIG_PATH
              value: "/etc/opensandbox/config.toml"
            - name: OPENSANDBOX_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: opensandbox-api
          volumeMounts:
            - name: config
              mountPath: /etc/opensandbox/config.toml
              subPath: config.toml
              readOnly: true
            - mountPath: /etc/opensandbox/talgent.batchsandbox.yaml
              name: workload-template
              readOnly: true
              subPath: talgent.batchsandbox.yaml
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: opensandbox-config
        - configMap:
            name: opensandbox-workload-template
          name: workload-template

apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-config
  namespace: talgent
  labels:
    helm.sh/chart: opensandbox-server-1.2.1
    app.kubernetes.io/name: opensandbox-server
    app.kubernetes.io/instance: opensandbox
    app.kubernetes.io/version: "1.2.1"

apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-workload-template
  namespace: talgent
data:
  talgent.batchsandbox.yaml: |
    spec:
      replicas: 1
      template:
        spec:
          runtimeClassName: kata-qemu-runtime-rs
          restartPolicy: Never
          automountServiceAccountToken: false
          # Any name with a dot is tried as absolute first, so an internet
          # hostname takes one query instead of first failing through the
          # cluster's search domains. The platform addresses a sandbox gets
          # are service.namespace; their absolute query fails and falls back
          # to the search domains.
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

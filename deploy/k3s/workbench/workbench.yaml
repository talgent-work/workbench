apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: talgent
spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: controlplane
  template:
    metadata:
      labels:
        app: controlplane
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: workbench-environment
          env:
            # Every process reads the Redis password from one Secret; without
            # it they connect with none.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: talgent-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: talgent-password
            # Service metrics go to the shared collector.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OPENSANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opensandbox-api
                  key: api-key
            - name: AGENT_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: AGENT_CONTROL_TOKEN
            - name: AGENT_FEEDBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: AGENT_FEEDBACK_TOKEN
            - name: DISPATCHER_EXECUTION_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: DISPATCHER_EXECUTION_CONTROL_TOKEN
            - name: STORAGE_FILE_SPACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: STORAGE_FILE_SPACE_TOKEN
            - name: STORAGE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: STORAGE_AGENT_TOKEN
            - name: COMPUTER_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: COMPUTER_CONTROL_TOKEN
            - name: STORAGE_REFERENCE_SPACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: STORAGE_REFERENCE_SPACE_TOKEN
            - name: STORAGE_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: STORAGE_LINK_SECRET
            - name: GITHUB_SCM_ENABLED
              valueFrom:
                secretKeyRef:
                  key: GITHUB_SCM_ENABLED
                  name: github-scm
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_ID
                  name: github-scm
                  optional: true
            - name: GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_SLUG
                  name: github-scm
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_PRIVATE_KEY_PEM
                  name: github-scm
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: GITHUB_OAUTH_CLIENT_ID
                  name: github-scm
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_OAUTH_CLIENT_SECRET
                  name: github-scm
                  optional: true
            - name: GITHUB_SCM_TOKEN_CIPHER_KEY
              valueFrom:
                secretKeyRef:
                  key: GITHUB_SCM_TOKEN_CIPHER_KEY
                  name: github-scm
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_WEBHOOK_SECRET
                  name: github-scm
                  optional: true
            - name: GITHUB_WEB_BASE_URL
              valueFrom:
                secretKeyRef:
                  key: GITHUB_WEB_BASE_URL
                  name: github-scm
                  optional: true
            - name: GITHUB_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  key: GITHUB_API_BASE_URL
                  name: github-scm
                  optional: true
            - name: GITHUB_API_VERSION
              valueFrom:
                secretKeyRef:
                  key: GITHUB_API_VERSION
                  name: github-scm
                  optional: true
            - name: ACCOUNT_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: account-github-oauth
                  key: client-id
            - name: ACCOUNT_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: account-github-oauth
                  key: client-secret
          image: ghcr.io/talgent-work/controlplane:v0.15.6
          imagePullPolicy: IfNotPresent
          # Envoy drops a terminating Pod from its endpoints a few seconds after
          # Kubernetes signals it; keep serving through that window. Then
          # Shutdown ends open streams, drains requests and stops modules within
          # fx's 30s, inside the 45s grace period.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 20
            tcpSocket:
              port: 8080
            timeoutSeconds: 2
          name: controlplane
          ports:
            - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 2
          startupProbe:
            failureThreshold: 30
            periodSeconds: 2
            tcpSocket:
              port: 8080
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /app/configs/controlplane
              name: config
              readOnly: true
            - mountPath: /etc/talgent/account
              name: account-master-key
              readOnly: true
            - mountPath: /etc/talgent/models
              name: agent-models
              readOnly: true
            - mountPath: /etc/talgent/model-configurations
              name: agent-model-configurations
              readOnly: true
            # Storage is the only writer of both stores.
            - mountPath: /mnt/talgent
              name: juicefs-root
              subPath: talgent
            - mountPath: /mnt/nas
              name: nas-root
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: ghcr-pull
      serviceAccountName: talgent-controlplane
      terminationGracePeriodSeconds: 45
      volumes:
        - configMap:
            name: controlplane-config
          name: config
        - name: account-master-key
          secret:
            secretName: account-master-key
            items:
              - key: master-key
                path: master-key
        - name: agent-models
          configMap:
            name: agent-models
        - name: agent-model-configurations
          secret:
            secretName: agent-model-configurations
            items:
              - key: configurations.yml
                path: configurations.yml
        - name: juicefs-root
          persistentVolumeClaim:
            claimName: talgent-juicefs-root
        - name: nas-root
          persistentVolumeClaim:
            claimName: talgent-nas-root

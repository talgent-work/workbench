apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench-web
  namespace: talgent
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: workbench-web
  template:
    metadata:
      labels:
        app: workbench-web
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      containers:
        - name: workbench-web
          image: ghcr.io/talgent-work/workbench-web:v0.15.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Envoy drops a terminating Pod from its endpoints a few seconds after
          # Kubernetes signals it; nginx keeps serving through that window, then
          # SIGQUIT (the image's stop signal) lets in-flight requests finish.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: workbench-web
  namespace: talgent
spec:
  selector:
    app: workbench-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000

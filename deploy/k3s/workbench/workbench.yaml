---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
  namespace: talgent
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # The native API, for a platform Connector where one is deployed.
    - name: native
      port: 8081
      targetPort: 8081
    # The same native API for sandboxes, on the standard port, the only kind
    # where their Credential Proxy adds the Work credential.
    - name: agent
      port: 80
      targetPort: 8081
  selector:
    app: controlplane
---
# The Computer Gateway holds each Managed Computer's one outbound connection.
# Talgent Computer reconnects to any replica, so a restart moves
# its machines rather than losing them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computer-gateway
  namespace: talgent
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: computer-gateway
  template:
    metadata:
      labels:
        app: computer-gateway
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: computer-gateway
          image: ghcr.io/talgent-work/computer-gateway:v0.15.6
          envFrom:
            - configMapRef:
                name: workbench-environment
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            # Every process reads the Redis password from one Secret; without
            # it they connect with none.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Admits the Gateway to Computer's private connection contract.
            - name: COMPUTER_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: COMPUTER_CONTROL_TOKEN
          volumeMounts:
            - name: config
              mountPath: /app/configs/computer-gateway
              readOnly: true
          # Keep accepting while Envoy drops the terminating Pod, then close
          # every connection so its machine reconnects to another replica.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
      volumes:
        - name: config
          configMap:
            name: computer-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: computer-gateway
  namespace: talgent
spec:
  selector:
    app: computer-gateway
  ports:
    - name: http
      port: 8085
      targetPort: 8085

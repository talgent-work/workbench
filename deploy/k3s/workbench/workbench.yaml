apiVersion: v1
kind: Namespace
metadata:
  name: talgent
  labels:
    gateway-access: shared-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-config
  namespace: talgent
data:
  defaults.yml: |
    logger:
      level: ${LOG_LEVEL:info}
      output: ${LOG_OUTPUT:console}
    http:
      addr: :8083
    grpc_addr: ${DISPATCHER_GRPC_ADDR:dispatcher:8083}
    instance_id: ${DISPATCHER_INSTANCE_ID:}
    redis:
      addr: ${REDIS_ADDR}
      password: ${REDIS_PASSWORD:}
      db: ${REDIS_DB:0}
    clickhouse:
      dsn: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_ADDR}?database=default
    kafka:
      brokers:
        - ${KAFKA_BROKER}
    integration-messages:
      consumer_group: dispatcher-service
    nats:
      url: ${NATS_URL}
    agent-feedback:
      addr: http://controlplane:8080
      token: ${AGENT_FEEDBACK_TOKEN:}
    native-execution:
      control-token: ${DISPATCHER_EXECUTION_CONTROL_TOKEN:}
    ownership:
      ttl: 6s
      heartbeat: 2s
      scan: 3s
      snapshot-ttl: 168h
---
# Model Templates: how the Harness reaches each vendor's models. Adding or
# changing one needs no release: edit this ConfigMap, then
# `kubectl -n talgent rollout restart deployment/controlplane`. A changed model
# is published as a new template id. Model Configurations (name, template,
# api key) live in Secret agent-model-configurations, key configurations.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-models
  namespace: talgent
data:
  templates.yml: |
    templates:
      # https://api-docs.deepseek.com/zh-cn/quick_start/agent_integrations/claude_code
      - id: deepseek-flash
        vendor: deepseek
        base-url: https://api.deepseek.com/anthropic
        opus-model: deepseek-flash[1m]
        sonnet-model: deepseek-flash[1m]
        haiku-model: deepseek-flash
        fable-model: deepseek-flash[1m]
        subagent-model: deepseek-flash
        thinking-levels: [low, high, max]
        default-thinking-level: max
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
      # https://docs.bigmodel.cn/cn/coding-plan/tool/claude
      - id: glm-5.3-coding-plan
        vendor: zhipu
        base-url: https://open.bigmodel.cn/api/anthropic
        opus-model: glm-5.3[1m]
        sonnet-model: glm-5.3[1m]
        haiku-model: glm-5.3-flash[1m]
        fable-model: glm-5.3[1m]
        subagent-model: glm-5.3-flash[1m]
        thinking-levels: [low, high, max]
        default-thinking-level: max
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
          API_TIMEOUT_MS: "3000000"
      # Kimi Code membership: https://www.kimi.com/code/docs/third-party-tools/claude-code.html
      # k3 serves 256K on Plus and 1M on Pro; the window fits both.
      - id: kimi-k3-coding-plan
        vendor: kimi
        base-url: https://api.kimi.com/coding/
        opus-model: k3
        sonnet-model: k3
        haiku-model: k3
        fable-model: k3
        subagent-model: k3
        thinking-levels: [low, high, max]
        default-thinking-level: high
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"
      # https://platform.minimaxi.com/docs/coding-plan/claude-code
      # Effort levels: https://platform.minimaxi.com/docs/api-reference/text-anthropic-api
      - id: minimax-m3.1-coding-plan
        vendor: minimax
        base-url: https://api.minimax.cn/anthropic
        opus-model: MiniMax-M3.1-Flash-Preview[1m]
        sonnet-model: MiniMax-M3.1-Flash-Preview[1m]
        haiku-model: MiniMax-M3.1-Flash-Preview[1m]
        fable-model: MiniMax-M3.1-Flash-Preview[1m]
        subagent-model: MiniMax-M3.1-Flash-Preview[1m]
        thinking-levels: [low, medium, high, xhigh, max]
        default-thinking-level: max
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "524288"
      # https://help.aliyun.com/zh/model-studio/claude-code (Coding Plan)
      # qwen3.7-plus accepts no effort setting, so no thinking levels are offered.
      - id: qwen3.7-plus-coding-plan
        vendor: qwen
        base-url: https://coding.dashscope.aliyuncs.com/apps/anthropic
        opus-model: qwen3.7-plus
        sonnet-model: qwen3.7-plus
        haiku-model: qwen3.7-plus
        fable-model: qwen3.7-plus
        subagent-model: qwen3.7-plus
      # Alibaba Cloud Model Studio Token Plan: https://help.aliyun.com/zh/model-studio/claude-code
      # Model ids and input limits were verified on the endpoint, which lists them at compatible-mode/v1/models.
      - id: deepseek-v4.1-flash-token-plan
        vendor: deepseek
        base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
        opus-model: deepseek-v4.1-flash[1m]
        sonnet-model: deepseek-v4.1-flash[1m]
        haiku-model: deepseek-v4.1-flash
        fable-model: deepseek-v4.1-flash[1m]
        subagent-model: deepseek-v4.1-flash
        thinking-levels: [low, high, max]
        default-thinking-level: max
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
      - id: glm-5.3-token-plan
        vendor: zhipu
        base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
        opus-model: glm-5.3[1m]
        sonnet-model: glm-5.3[1m]
        haiku-model: glm-5.3[1m]
        fable-model: glm-5.3[1m]
        subagent-model: glm-5.3[1m]
        thinking-levels: [low, high, max]
        default-thinking-level: max
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
          API_TIMEOUT_MS: "3000000"
      # The template follows Model Studio's own Claude Code settings: "auto" routes the main
      # model and subagents; every model's input limit is 983616 tokens.
      - id: qwen3.8-max-token-plan
        vendor: qwen
        base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/apps/anthropic
        main-model: auto
        opus-model: qwen3.8-max
        sonnet-model: qwen3.8-flash
        haiku-model: qwen3.6-flash
        fable-model: qwen3.8-max
        subagent-model: auto
        thinking-levels: [low, high, max]
        default-thinking-level: high
        environment:
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "983616"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamgateway-config
  namespace: talgent
data:
  defaults.yml: |
    logger:
      level: ${LOG_LEVEL:info}
      output: ${LOG_OUTPUT:console}
    http:
      addr: :8084
    clickhouse:
      dsn: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_ADDR}?database=default
    nats:
      url: ${NATS_URL}
    agent:
      address: http://controlplane:8080
      control-token: "${AGENT_CONTROL_TOKEN:}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: computer-gateway-config
  namespace: talgent
data:
  defaults.yml: |
    logger:
      level: ${LOG_LEVEL:info}
      output: ${LOG_OUTPUT:console}
    http:
      addr: :8085
    redis:
      addr: ${REDIS_ADDR}
      password: ${REDIS_PASSWORD:}
      db: 0
    gateway:
      computer-address: http://controlplane:8080
      control-token: "${COMPUTER_CONTROL_TOKEN:}"
      replica: "${POD_NAME:computer-gateway}"
      endpoint: "${POD_IP:127.0.0.1}:8085"
      # The platform release this deployment runs (X.Y.Z), which
      # scripts/deploy/apply-k3s.sh fills in from a vX.Y.Z image tag.
      release-version: "__TALGENT_RELEASE_VERSION__"
---
apiVersion: v1
data:
  defaults.yml: |
    # Storage owns every space on JuiceFS and NAS.
    storage:
      persistent-root: /mnt/talgent
      working-root: /mnt/nas
      public-base-url: /api
      link-secret: "${STORAGE_LINK_SECRET:}"
      link-ttl: 15m
      upload-link-ttl: 2m
      max-upload-bytes: 1073741824
      agent-token: "${STORAGE_AGENT_TOKEN:}"
      # Callers beyond Agent; an empty token admits no one.
      file-space-tokens:
        - "${STORAGE_FILE_SPACE_TOKEN:}"
      reference-space-tokens:
        - "${STORAGE_REFERENCE_SPACE_TOKEN:}"
      reclaim-interval: 30s
      mounts:
        working-claim: talgent-nas-root
        inputs-claim: talgent-juicefs-inputs
        inputs-root: talgent
      # Every preview limit and timing in one place; conservative
      # starting points, not capacity-tested.
      preview:
        gotenberg-address: "http://gotenberg:3000"
        client-timeout: 65s
        task-deadline: 90s
        retention: 720h
        office-source-bytes: 20971520
        rendered-pdf-bytes: 52428800
        native-pdf-bytes: 52428800
        image-bytes: 20971520
        text-bytes: 1048576
        markup-bytes: 1048576
      # Entries one workspace directory lists; a conservative starting point.
      workspace-list-entries: 1000
    agent-storage:
      address: http://127.0.0.1:8080
      token: "${STORAGE_AGENT_TOKEN:}"
    agent-rpc:
      control-token: ${AGENT_CONTROL_TOKEN:}
      feedback-token: ${AGENT_FEEDBACK_TOKEN:}
    agent-computer:
      address: "${COMPUTER_ADDRESS:http://127.0.0.1:8080}"
      token: "${COMPUTER_CONTROL_TOKEN:}"
      # Computer Gateway's relay to Managed Computers;
      # empty leaves Managed Computers unreachable.
      relay-address: "${COMPUTER_RELAY_ADDRESS:http://computer-gateway.talgent.svc.cluster.local:8085}"
      # The platform Connector's public HTTPS address a Managed Computer's
      # local proxy reaches: the computer route's computer-mcp rule, which a
      # deployment with a platform Connector adds, on the origin Talgent
      # Computer connects to.
      mcp-address: "${WORKBENCH_ORIGIN}/computer/v1/mcp"
      # Where a Managed Work calls the native API directly, through its
      # local proxy: the computer route's computer-api rule. Empty, as where
      # Agents reach the platform only through a Gateway, gives Managed Works
      # none.
      api-address: "${WORKBENCH_ORIGIN}/computer/v1/api"
      # Where Storage's Access Links are served on that origin, from which a
      # Managed Computer downloads its Works' inputs: the native API's, through
      # the computer-api rule. A deployment whose Agents reach the platform
      # only through a Gateway names the Gateway's instead.
      content-address: "${WORKBENCH_ORIGIN}/computer/v1/api/v1/storage/content"
      # Where a reader's browser reaches Agent's links to a Managed Work's
      # files: the web-api route's agent-workspace-file rule.
      workspace-file-address: "${AGENT_WORKSPACE_FILE_ADDRESS:/api/v1/agent/workspace-files}"
      # Where a Managed Work's Claude Code sends its telemetry with its run's
      # telemetry token: the computer route's computer-telemetry rule, on the
      # origin Talgent Computer connects to.
      telemetry-address: "${WORKBENCH_ORIGIN}/computer/v1/otel"
      # Where Agent forwards that telemetry once attributed to its run.
      telemetry-collector-address: "${COMPUTER_TELEMETRY_COLLECTOR_ADDRESS:http://otel-collector:4318}"
    # Computer owns every place a Work runs; each cluster is one Cloud.
    computer:
      control-token: "${COMPUTER_CONTROL_TOKEN:}"
      # Where a person approves a Talgent Computer registration.
      verification-uri: "${WORKBENCH_ORIGIN}/computers/connect"
      # The oldest Talgent Computer release (X.Y.Z) a Managed Computer may take a run
      # on, told to each machine as it connects; empty admits every release. Raise it
      # only to a release published to npm, at or below the Target Version (the
      # machine service's release-version): above it, every machine upgrades to the
      # Target and still takes no run, and the machine service logs an error.
      minimum-version: "${COMPUTER_MINIMUM_VERSION:}"
      cloud:
        # Fixed for good: every Work keeps the Cloud it started on.
        id: "${COMPUTER_CLOUD_ID:01a19bc3-075a-7c57-b42b-7fdf73b611ed}"
        name: "${COMPUTER_CLOUD_NAME:Talgent Cloud}"
        # The room the platform gives runs: the quota below, in the sandbox
        # namespace, counts only execution Pods; each admission still checks it.
        capacity:
          requests.cpu: "8"
          requests.memory: "12Gi"
          pods: "64"
        namespace: ${SANDBOX_NAMESPACE:talgent-sandbox}
        quota-name: agent-executions
        # Everything the quota charges for one execution Pod, not just the sandbox
        # container (agent-execution requests/limits): plus the egress sidecar
        # (LimitRange default 100m/128Mi) and the kata-qemu-runtime-rs RuntimeClass
        # overhead (250m/320Mi). Under-stating it admits starts that the quota then
        # rejects at Pod creation. Keep in step with those three sources.
        demand:
          requests.cpu: "600m"
          requests.memory: "960Mi"
          limits.cpu: "2250m"
          limits.memory: "2368Mi"
          pods: "1"
    # The procedures an Agent reaches with its Work credential, from its
    # sandbox through the Service's agent port.
    native-api:
      addr: "${NATIVE_API_ADDR::8081}"
    native-authentication:
      # Agent verifies every Work credential.
      agent-address: "${AGENT_INTERNAL_ADDRESS:http://127.0.0.1:8080}"
      agent-control-token: "${AGENT_CONTROL_TOKEN:}"
    agent-execution:
      sandbox-namespace: ${SANDBOX_NAMESPACE:talgent-sandbox}
      credential-transport: encrypted-network
      # Model Templates (ConfigMap agent-models) and Model Configurations with
      # their api keys (Secret agent-model-configurations), read once at startup.
      models:
        templates-path: "${MODEL_TEMPLATES_PATH:/etc/talgent/models/templates.yml}"
        configurations-path: "${MODEL_CONFIGURATIONS_PATH:/etc/talgent/model-configurations/configurations.yml}"
      network-allow:
        - "${K8S_DNS_SERVICE_IP:10.43.0.10}"
      network-deny: []
      opensandbox:
        address: ${OPENSANDBOX_ADDRESS:http://opensandbox:80}
        api-key: ${OPENSANDBOX_API_KEY:}
      native:
        binary: claude
      image: ghcr.io/talgent-work/sandbox:v0.15.6
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
      environment:
        # The controlplane's native API, the platform service a sandbox
        # reaches, on the Service's agent port: the standard port, the only
        # kind where the Credential Proxy adds the Work credential.
        TALGENT_API_ADDRESS: "${NATIVE_PLATFORM_API_ADDRESS:http://controlplane.talgent}"
        OTEL_EXPORTER_OTLP_ENDPOINT: "${NATIVE_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.talgent:4318}"
      dispatcher:
        address: ${DISPATCHER_NATIVE_ADDRESS:http://dispatcher:8083}
        token: ${DISPATCHER_EXECUTION_CONTROL_TOKEN:}
    # Storage's and Marketplace's records.
    workbench-mysql:
      dsn: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_ADDR})/${WORKBENCH_MYSQL_DATABASE}?charset=utf8mb4&parseTime=true
    execution-mysql:
      dsn: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_ADDR})/${AGENT_MYSQL_DATABASE}?charset=utf8mb4&parseTime=true
    marketplace:
      synchronization:
        enabled: true
        interval-seconds: 1800
        timeout-seconds: 1200
        acquisition:
          workers: 4
          request-timeout-seconds: 120
          archive-base-url: ${MARKETPLACE_ARCHIVE_BASE_URL}
          # Keyed by name: an overlay's profile adds sources beside these.
          sources:
            claude-plugins-official:
              uri: https://github.com/anthropics/claude-plugins-official.git
              owned: false
              priority: 10
            talgent:
              uri: https://github.com/talgent-work/marketplace.git
              owned: true
              priority: 100
      provider-connectors:
        - name: github
          description: Read and change repositories, issues and pull requests through your GitHub authorization.
          category: development
          provider: github
          target: github-api
          authentication: credential_proxy
          command: github-mcp-server
          args: [stdio]
          credential-environment: [GITHUB_PERSONAL_ACCESS_TOKEN]
      directory: /mnt/talgent/marketplace
      name: talgent
      owner: Talgent
      connections:
        credential-token: "${AGENT_CONTROL_TOKEN:}"
        github:
          api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
          api-version: ${GITHUB_API_VERSION:2026-03-10}
          app-id: ${GITHUB_APP_ID:}
          app-slug: ${GITHUB_APP_SLUG:}
          enabled: ${GITHUB_SCM_ENABLED:false}
          oauth-client-id: ${GITHUB_OAUTH_CLIENT_ID:}
          oauth-client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
          private-key-pem: ${GITHUB_APP_PRIVATE_KEY_PEM:}
          token-cipher-key: ${GITHUB_SCM_TOKEN_CIPHER_KEY:}
          web-base-url: ${GITHUB_WEB_BASE_URL:https://github.com}
          webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
        maintenance:
          batch-size: 100
          enabled: true
          proactive-refresh-window: 30m
          queue-name: scm-maintenance
          refresh-lease-duration: 30s
          request-refresh-skew: 5m
          scan-interval: 5m
    agent-marketplace:
      credential-token: "${AGENT_CONTROL_TOKEN:}"
      address: http://127.0.0.1:8080
    http:
      addr: :8080
    agent-user-directory:
      address: http://127.0.0.1:8080
    account-mysql:
      dsn: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_ADDR})/${ACCOUNT_MYSQL_DATABASE}?charset=utf8mb4&parseTime=true
    account:
      issuer: ${ACCOUNT_ISSUER}
      audience: talgent
      # Empty keeps the session cookies on the Workbench host.
      cookie-domain: ${ACCOUNT_COOKIE_DOMAIN}
      access-token-lifetime: 15m
      session-sliding-lifetime: 720h
      session-absolute-lifetime: 2160h
      key-rotation-interval: 720h
      key-overlap: 10m
      master-key-path: /etc/talgent/account/master-key
      github:
        # The login OAuth App, not the Marketplace Provider App.
        client-id: ${ACCOUNT_GITHUB_CLIENT_ID:}
        client-secret: ${ACCOUNT_GITHUB_CLIENT_SECRET:}
        redirect-url: ${WORKBENCH_ORIGIN}/auth/github/callback
        web-base-url: https://github.com
        api-base-url: https://api.github.com
    marketplace-taskqueue:
      queue-name: scm-maintenance
      queue-names:
        - marketplace-maintenance
        - scm-maintenance
      redis-addr: ${REDIS_ADDR}
      redis-db: 0
      redis-password: ${REDIS_PASSWORD:}
      shutdown-timeout: 30s
      worker-concurrency: 6
    agent-taskqueue:
      queue-name: agent-recovery
      redis-addr: ${REDIS_ADDR}
      redis-db: 0
      redis-password: ${REDIS_PASSWORD:}
      retry-delay-max: 60s
      retry-delay-min: 1s
      shutdown-timeout: 30s
      worker-concurrency: 16
    agent-preparation-taskqueue:
      queue-name: agent-preparation
      redis-addr: ${REDIS_ADDR}
      redis-db: 0
      redis-password: ${REDIS_PASSWORD:}
      retry-delay-max: 60s
      retry-delay-min: 1s
      shutdown-timeout: 30s
      # Each starting Work holds a worker while its preparation runs.
      worker-concurrency: 32
    # Storage renders Preview Copies on one lane; scale worker-concurrency
    # with Gotenberg's replicas (gotenberg.yaml).
    storage-preview-taskqueue:
      queue-name: storage-preview
      redis-addr: ${REDIS_ADDR}
      redis-db: 0
      redis-password: ${REDIS_PASSWORD:}
      retry-delay-max: 4s
      retry-delay-min: 2s
      shutdown-timeout: 30s
      worker-concurrency: 1
    clickhouse:
      dsn: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_ADDR}?database=default
    # Trace runs in this process with its own telemetry database; a
    # Work with a Project is admitted by the Project access decision, which a
    # deployment configures with trace-access.project-access-address.
    trace-clickhouse:
      dsn: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_ADDR}/talgent_trace
    trace-access:
      agent-address: http://127.0.0.1:8080
      agent-control-token: "${AGENT_CONTROL_TOKEN:}"
    trace-authn:
      enabled: "true"
      mode: gateway-oidc
    kafka:
      brokers:
        - ${KAFKA_BROKER}
    kubernetes:
      kubeconfig-path: ""
    logger:
      level: ${LOG_LEVEL:info}
      output: ${LOG_OUTPUT:console}
    nats:
      url: ${NATS_URL}
    redis:
      addr: ${REDIS_ADDR}
      db: 0
      password: ${REDIS_PASSWORD:}
kind: ConfigMap
metadata:
  name: controlplane-config
  namespace: talgent
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: talgent-juicefs-root
  labels:
    talgent.io/storage: juicefs-root
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # File attributes (uploader, producing Work) are extended attributes.
  mountOptions:
    - enable-xattr
  csi:
    driver: csi.juicefs.com
    volumeHandle: talgent-juicefs-root-rustfs
    fsType: juicefs
    nodePublishSecretRef:
      name: talgent-juicefs-secret
      namespace: talgent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talgent-juicefs-root
  namespace: talgent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      talgent.io/storage: juicefs-root
---
# The same JuiceFS filesystem, claimed read-only for Storage's standing
# originals mount (Storage's Originals Mount Contract).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: talgent-juicefs-originals
  labels:
    talgent.io/storage: juicefs-originals
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - enable-xattr
  csi:
    driver: csi.juicefs.com
    volumeHandle: talgent-juicefs-originals-rustfs
    fsType: juicefs
    readOnly: true
    nodePublishSecretRef:
      name: talgent-juicefs-secret
      namespace: talgent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talgent-juicefs-originals
  namespace: talgent
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      talgent.io/storage: juicefs-originals
---
# Process files and Agent HOME on the NAS, which Storage alone writes:
# workspaces/, homes/ and .reclaim/ under the share. A static PV keeps that
# fixed layout. Sandboxes mount their own directory by subPath through the
# claim of the same name in talgent-sandbox (sandbox.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: talgent-nas-root
  labels:
    talgent.io/storage: nas-root
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: talgent-nas-root
    volumeAttributes:
      server: nfs.example.com
      share: /exports/talgent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talgent-nas-root
  namespace: talgent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:

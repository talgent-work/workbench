# The Workbench's web app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workbench-web
  namespace: talgent
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - workbench.example.com
  rules:
    - name: public-portal
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: workbench-web
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-api
  namespace: talgent
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - workbench.example.com
  rules:
    - name: session-api
      matches:
        - path:
            type: PathPrefix
            value: /api/account.public.v1.SessionService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /account.public.v1.SessionService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    - name: agent-work-api
      matches:
        - path:
            type: PathPrefix
            value: /api/agent.public.v1.AgentWorkService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /agent.public.v1.AgentWorkService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    - name: personal-work-api
      matches:
        - path:
            type: PathPrefix
            value: /api/agent.public.v1.PersonalWorkService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /agent.public.v1.PersonalWorkService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    - name: work-file-api
      matches:
        - path:
            type: PathPrefix
            value: /api/agent.public.v1.WorkFileService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /agent.public.v1.WorkFileService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    - name: computer-api
      matches:
        - path:
            type: PathPrefix
            value: /api/computer.public.v1.ComputerService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /computer.public.v1.ComputerService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    - name: marketplace-api
      matches:
        - path:
            type: PathPrefix
            value: /api/marketplace.public.v1.MarketplaceService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /marketplace.public.v1.MarketplaceService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    - name: marketplace-content
      matches:
        - path:
            type: Exact
            value: /marketplace/marketplace.json
        - path:
            type: PathPrefix
            value: /marketplace/archives
      backendRefs:
        - name: controlplane
          port: 8080
    - name: scm-github-webhook
      matches:
        - path:
            type: PathPrefix
            value: /api/scm/github/webhook
      backendRefs:
        - name: controlplane
          port: 8080
    - name: storage-content-api
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/storage
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/storage
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: controlplane
          port: 8080
    # Agent's links to a Managed Work's files, read from its machine; each
    # link carries its own signed grant, so no JWT policy targets it.
    - name: agent-workspace-file
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/agent/workspace-files
      timeouts:
        request: 0s
        backendRequest: 0s
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/agent/workspace-files
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
      backendRefs:
        - name: controlplane
          port: 8080
    - name: streamgateway-api
      matches:
        - path:
            type: PathPrefix
            value: /api/streamgateway.public.v1.StreamGatewayService
      timeouts:
        request: 0s
        backendRequest: 0s
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /streamgateway.public.v1.StreamGatewayService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      backendRefs:
        - name: streamgateway
          port: 8084
    - name: trace-api
      matches:
        - path:
            type: PathPrefix
            value: /api/trace.public.v1.TraceQueryService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /trace.public.v1.TraceQueryService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
            set:
              - name: x-talgent-authenticated-by
                value: envoy
      # Trace runs in controlplane.
      backendRefs:
        - name: controlplane
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: web-auth
  namespace: talgent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: session-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: agent-work-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: personal-work-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: work-file-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: marketplace-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: computer-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: streamgateway-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web-api
      sectionName: trace-api
  # Account issues Identity Tokens; the gateway validates them against
  # Account's published keys and forwards their claims as x-talgent-* headers;
  # every context authorizes on those claims itself.
  jwt:
    providers:
      - name: account
        issuer: https://workbench.example.com/auth
        audiences:
          - talgent
        extractFrom:
          cookies:
            - talgent-access
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
        remoteJWKS:
          uri: http://controlplane.talgent.svc.cluster.local:8080/auth/jwks.json
          backendRefs:
            - group: ""
              kind: Service
              name: controlplane
              port: 8080
          cacheDuration: 300s
        claimToHeaders:
          - claim: iss
            header: x-talgent-issuer
          - claim: sub
            header: x-talgent-subject
          - claim: preferred_username
            header: x-talgent-username
          - claim: email
            header: x-talgent-email
          - claim: name
            header: x-talgent-display-name
          - claim: picture
            header: x-talgent-avatar-url
          - claim: roles
            header: x-talgent-roles
---
# Account's browser sign-in endpoints. They run before a token exists, so no
# JWT policy targets this route; every internal trust header a client sends is
# stripped so private service trust cannot be forged from outside. (Gateway API
# allows 16 removals; the native Work credential headers, and the Space Token
# sent beside them, are omitted because only Connect handlers read them, never
# /auth.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: talgent
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - workbench.example.com
  rules:
    # Starting and completing a GitHub sign-in; rate limited below.
    - name: account-sign-in
      matches:
        - path:
            type: Exact
            value: /auth/github/login
        - path:
            type: Exact
            value: /auth/github/callback
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
              - x-talgent-runtime-instance-id
              - x-talgent-runtime-purpose
              - x-talgent-runtime-owner-ref
      backendRefs:
        - name: controlplane
          port: 8080
    # Session refresh, sign-out and the published keys. Not rate limited: a
    # shared limit here would let one client stall everyone's silent refresh.
    - name: account-session
      matches:
        - path:
            type: PathPrefix
            value: /auth/
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
              - x-talgent-runtime-instance-id
              - x-talgent-runtime-purpose
              - x-talgent-runtime-owner-ref
      backendRefs:
        - name: controlplane
          port: 8080
---
# What Talgent Computer reaches before and without a browser sign-in: device
# code registration, its outbound connection and its installer. No JWT policy
# targets this route; the device code and the Computer Credential are checked
# by Computer, and every internal trust header a client sends is stripped.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: computer
  namespace: talgent
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - workbench.example.com
  rules:
    - name: computer-registration
      matches:
        - path:
            type: PathPrefix
            value: /api/computer.public.v1.RegistrationService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /computer.public.v1.RegistrationService
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
              - x-talgent-runtime-instance-id
              - x-talgent-runtime-purpose
              - x-talgent-runtime-owner-ref
      backendRefs:
        - name: controlplane
          port: 8080
    # A Managed Work's Claude Code sends its OTLP telemetry here, with its
    # run's telemetry token and its Work identity. Agent checks the token,
    # puts the run's own attribution on everything sent and forwards it to
    # the OTel Collector, so no JWT policy targets it; the internal trust
    # headers the gateway asserts are stripped, the credentials a caller
    # presents itself pass.
    - name: computer-telemetry
      matches:
        - path:
            type: PathPrefix
            value: /computer/v1/otel
      timeouts:
        request: 30s
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/agent/telemetry
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
              - x-talgent-runtime-instance-id
              - x-talgent-runtime-purpose
              - x-talgent-runtime-owner-ref
      backendRefs:
        - name: controlplane
          port: 8080
    # A Managed Work calls the controlplane's native API here, through
    # Talgent Computer's local proxy, which adds its Work credential and
    # Space Token, as a sandbox's Credential Proxy does in the cluster. The
    # native API admits each call by that credential, so no JWT policy
    # targets it; every other internal trust header is stripped. An overlay
    # whose Agents reach the platform only through a Gateway removes it.
    - name: computer-api
      matches:
        - path:
            type: PathPrefix
            value: /computer/v1/api
      timeouts:
        request: 300s
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
              - x-talgent-runtime-instance-id
              - x-talgent-runtime-purpose
              - x-talgent-runtime-owner-ref
      backendRefs:
        - name: controlplane
          port: 8081
    # The connection lives as long as the machine stays up.
    - name: computer-connection
      matches:
        - path:
            type: PathPrefix
            value: /computer/
      timeouts:
        request: 0s
        backendRequest: 0s
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-talgent-authenticated-by
              - x-talgent-issuer
              - x-talgent-subject
              - x-talgent-username
              - x-talgent-email
              - x-talgent-display-name
              - x-talgent-avatar-url
              - x-talgent-roles
              - x-talgent-service-id
              - x-talgent-delegated-user-id
              - x-talgent-delegated-actor-id
              - x-talgent-gateway-token
              - x-talgent-reader-admission
              - x-talgent-runtime-instance-id
              - x-talgent-runtime-purpose
              - x-talgent-runtime-owner-ref
      backendRefs:
        - name: computer-gateway
          port: 8085
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: computer-registration-rate-limit
  namespace: talgent
spec:
  # One shared ceiling on starting and polling registrations; Talgent
  # Computer polls every 5 seconds while a person approves.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: computer
      sectionName: computer-registration
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 600
            unit: Minute
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: computer-connection-rate-limit
  namespace: talgent
spec:
  # A shared ceiling on connection attempts, installer and program
  # downloads; each upgrade checks its credential against Computer. A
  # machine reconnects at most every second and backs off to 30 seconds.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: computer
      sectionName: computer-connection
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 1200
            unit: Minute
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: computer-telemetry-rate-limit
  namespace: talgent
spec:
  # Each Managed Work's telemetry is limited on its own, by the Work identity
  # its Claude Code sends; it exports a batch of traces and one of log events
  # about every 5 seconds. A shared ceiling above them bounds requests with
  # made-up identities, each of which Agent checks against the Work's live
  # run. Agent bounds each request's size.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: computer
      sectionName: computer-telemetry
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - name: x-talgent-work-id
                  type: Distinct
          limit:
            requests: 120
            unit: Minute
        - limit:
            requests: 6000
            unit: Minute
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: computer-api-rate-limit
  namespace: talgent
spec:
  # Each Managed Work's native API calls, its input downloads among them, are
  # limited on their own, by the Work identity its local proxy or Talgent
  # Computer adds. A shared ceiling above them bounds
  # requests with made-up identities, each of which the native API checks
  # against the Work's live run. The native API bounds each request's size.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: computer
      sectionName: computer-api
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - name: x-talgent-work-id
                  type: Distinct
          limit:
            requests: 300
            unit: Minute
        - limit:
            requests: 6000
            unit: Minute
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: auth-rate-limit
  namespace: talgent
spec:
  # The gateway sits behind the TLS terminator, so client addresses are not
  # distinct here; this is one shared ceiling on starting sign-ins.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: auth
      sectionName: account-sign-in
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 120
            unit: Minute

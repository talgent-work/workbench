apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: talgent
spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      containers:
        - name: dispatcher
          image: ghcr.io/talgent-work/dispatcher:v0.15.6
          envFrom:
            - configMapRef:
                name: workbench-environment
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            # Every process reads the Redis password from one Secret; without
            # it they connect with none.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-auth
                  key: talgent-password
            - name: AGENT_FEEDBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: AGENT_FEEDBACK_TOKEN
            - name: DISPATCHER_EXECUTION_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: native-execution-control
                  key: DISPATCHER_EXECUTION_CONTROL_TOKEN
            - name: DISPATCHER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DISPATCHER_GRPC_ADDR
              value: "$(POD_IP):8083"
          volumeMounts:
            - name: config
              mountPath: /app/configs/dispatcher
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          startupProbe:
            tcpSocket:
              port: 8083
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
      volumes:
        - name: config
          configMap:
            name: dispatcher-config

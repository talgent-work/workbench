# COMPUTER_NATIVE_API_ACCESS=disabled: Managed Works do not call
# controlplane's native API through the computer route. Its computer-api rule
# and that rule's rate limit go. agent-computer.api-address and
# content-address still name the rule, so a controlplane profile names where
# Managed Works reach the platform instead: an empty api-address, and the
# content-address another route serves.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # The test fails the render if the rule moves.
  - target:
      kind: HTTPRoute
      name: computer
    patch: |-
      - op: test
        path: /spec/rules/2/name
        value: computer-api
      - op: remove
        path: /spec/rules/2
  - patch: |-
      $patch: delete
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: BackendTrafficPolicy
      metadata:
        name: computer-api-rate-limit
        namespace: talgent

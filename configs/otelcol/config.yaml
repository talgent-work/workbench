# otel-collector-contrib pipeline
# The official image reads it as /etc/otelcol-contrib/config.yaml; the deployment loads it
# through the otelcol-config ConfigMap (deploy/kubernetes/workbench/otel-collector.yaml).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  filter/observability_events:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch(body, "^claude_code[.](tool_decision|tool_result|skill_activated|mcp_.*)$")'
  # The single normalization of received native evidence: a trailing
  # bracketed suffix, such as Claude Code's [1m] context-window marker, is
  # Harness configuration rather than model identity.
  transform/model_identity:
    error_mode: ignore
    trace_statements:
      - replace_pattern(span.attributes["model"], "\\[[^\\]]*\\]$", "") where span.attributes["model"] != nil
      - replace_pattern(span.attributes["gen_ai.request.model"], "\\[[^\\]]*\\]$", "") where span.attributes["gen_ai.request.model"] != nil
    log_statements:
      - replace_pattern(log.attributes["model"], "\\[[^\\]]*\\]$", "") where log.attributes["model"] != nil
      - replace_pattern(log.attributes["gen_ai.request.model"], "\\[[^\\]]*\\]$", "") where log.attributes["gen_ai.request.model"] != nil
  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USERNAME}
    password: ${env:CLICKHOUSE_PASSWORD}
    database: ${env:CLICKHOUSE_DATABASE}
    # Native evidence survives an interpretation failure. Independent receipts
    # in the measurement table expose the resulting projection gap.
    connection_params:
      materialized_views_ignore_errors: "1"
    create_schema: true
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    # Service metrics, such as a service's model use per Project, land
    # in the exporter's default otel_metrics_* tables.
    ttl: 168h
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

extensions:
  # Liveness and readiness for the Kubernetes Deployment.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [ health_check ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, transform/model_identity, batch ]
      exporters: [ clickhouse ]
    logs:
      receivers: [ otlp ]
      processors: [ memory_limiter, filter/observability_events, transform/model_identity, batch ]
      exporters: [ clickhouse ]
    metrics:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ clickhouse ]
  telemetry:
    logs:
      level: info

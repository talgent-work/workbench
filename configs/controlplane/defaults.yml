logger:
  level: "${LOG_LEVEL:info}"
  output: "${LOG_OUTPUT:console}"
http:
  addr: "${CONTROLPLANE_HTTP_ADDR::8080}"
execution-mysql:
  dsn: "${EXECUTION_MYSQL_DSN:talgent@tcp(127.0.0.1:3306)/talgent_agent?charset=utf8mb4&parseTime=true}"
kafka:
  brokers:
    - "${KAFKA_BROKER:127.0.0.1:9092}"
nats:
  url: "${NATS_URL:nats://localhost:4222}"
# Storage's and Marketplace's records.
workbench-mysql:
  dsn: "${WORKBENCH_MYSQL_DSN:talgent@tcp(127.0.0.1:3306)/talgent_workbench?charset=utf8mb4&parseTime=true}"

redis:
  addr: "${REDIS_ADDR:127.0.0.1:6379}"
  password: "${REDIS_PASSWORD:}"
  db: 0
marketplace:
  # The MCP server every Work connects to as the platform Connector, where a
  # deployment runs one; empty publishes none.
  platform-connector:
    gateway-address: "${NATIVE_GATEWAY_ADDRESS:}"
  synchronization:
    enabled: false
    interval-seconds: 1800
    timeout-seconds: 1200
    acquisition:
      workers: 4
      request-timeout-seconds: 120
      archive-base-url: "${MARKETPLACE_ARCHIVE_BASE_URL:}"
      # Keyed by name: a profile adds sources beside these.
      sources:
        claude-plugins-official:
          uri: https://github.com/anthropics/claude-plugins-official.git
          owned: false
          priority: 10
        talgent:
          uri: https://github.com/talgent-work/marketplace.git
          owned: true
          priority: 100
  directory: "${MARKETPLACE_DIRECTORY:/mnt/talgent/marketplace}"
  name: "talgent"
  owner: "Talgent"
  connections:
    credential-token: "${AGENT_CONTROL_TOKEN:}"
    maintenance:
      enabled: true
      scan-interval: "5m"
      proactive-refresh-window: "30m"
      request-refresh-skew: "5m"
      refresh-lease-duration: "30s"
      batch-size: 100
      queue-name: "scm-maintenance"
    github:
      enabled: "${GITHUB_SCM_ENABLED:false}"
      app-id: "${GITHUB_APP_ID:}"
      app-slug: "${GITHUB_APP_SLUG:}"
      private-key-pem: "${GITHUB_APP_PRIVATE_KEY_PEM:}"
      oauth-client-id: "${GITHUB_OAUTH_CLIENT_ID:}"
      oauth-client-secret: "${GITHUB_OAUTH_CLIENT_SECRET:}"
      web-base-url: "${GITHUB_WEB_BASE_URL:https://github.com}"
      api-base-url: "${GITHUB_API_BASE_URL:https://api.github.com}"
      api-version: "${GITHUB_API_VERSION:2026-03-10}"
      token-cipher-key: "${GITHUB_SCM_TOKEN_CIPHER_KEY:}"
      webhook-secret: "${GITHUB_WEBHOOK_SECRET:}"
agent-marketplace:
  credential-token: "${AGENT_CONTROL_TOKEN:}"
  address: "${MARKETPLACE_INTERNAL_ADDRESS:http://127.0.0.1:8080}"
marketplace-taskqueue:
  redis-addr: "${REDIS_ADDR:127.0.0.1:6379}"
  redis-password: "${REDIS_PASSWORD:}"
  redis-db: 0
  worker-concurrency: 6
  queue-name: "scm-maintenance"
  queue-names:
    - "marketplace-maintenance"
    - "scm-maintenance"
  shutdown-timeout: "30s"
agent-recovery:
  sweep-interval: "60s"
  # How long a Managed Work's synced inputs stay current before the sweep
  # syncs them again with fresh Access Links; inside storage.link-ttl.
  inputs-refresh-interval: "10m"
# Agent's own consumer group for Marketplace credential changes.
agent-credential-changes:
  consumer-group: "${AGENT_CREDENTIAL_CHANGES_GROUP:agent-credential-changes}"
agent-input-changes:
  consumer-group: "${AGENT_INPUT_CHANGES_GROUP:agent-input-changes}"
agent-desk-assignments:
  consumer-group: "${AGENT_DESK_ASSIGNMENTS_GROUP:agent-desk-assignments}"
agent-computer-presence:
  consumer-group: "${AGENT_COMPUTER_PRESENCE_GROUP:agent-computer-presence}"
agent-taskqueue:
  redis-addr: "${REDIS_ADDR:127.0.0.1:6379}"
  redis-password: "${REDIS_PASSWORD:}"
  redis-db: 0
  worker-concurrency: 16
  queue-name: "agent-recovery"
  retry-delay-min: "1s"
  retry-delay-max: "60s"
  shutdown-timeout: "30s"
agent-preparation-taskqueue:
  redis-addr: "${REDIS_ADDR:127.0.0.1:6379}"
  redis-password: "${REDIS_PASSWORD:}"
  redis-db: 0
  # Each execution's long step (its creation's submission, up to the sandbox
  # creation timeout, or its preparation) holds a worker while it runs.
  worker-concurrency: 8
  queue-name: "agent-preparation"
  retry-delay-min: "1s"
  retry-delay-max: "60s"
  shutdown-timeout: "30s"
# Storage renders Preview Copies on one lane. Worker concurrency is the
# conversions one replica runs at once; scale it with Gotenberg's replicas.
# A busy converter is retried after 2-4s within the task's 90s deadline.
storage-preview-taskqueue:
  redis-addr: "${REDIS_ADDR:127.0.0.1:6379}"
  redis-password: "${REDIS_PASSWORD:}"
  redis-db: 0
  worker-concurrency: 1
  queue-name: "storage-preview"
  retry-delay-min: "2s"
  retry-delay-max: "4s"
  shutdown-timeout: "30s"
# Storage removes reclaimed Directories' content, retrying while a
# publication copies from one, and lapses Preview Copies hourly.
storage-maintenance-taskqueue:
  redis-addr: "${REDIS_ADDR:127.0.0.1:6379}"
  redis-password: "${REDIS_PASSWORD:}"
  redis-db: 0
  worker-concurrency: 2
  queue-name: "storage-maintenance"
  retry-delay-min: "10s"
  retry-delay-max: "5m"
  shutdown-timeout: "30s"
# Account rotates signing keys hourly and forgets replaced refresh secrets
# daily; a failed run is replaced by the next.
account-maintenance-taskqueue:
  redis-addr: "${REDIS_ADDR:127.0.0.1:6379}"
  redis-password: "${REDIS_PASSWORD:}"
  redis-db: 0
  worker-concurrency: 1
  queue-name: "account-maintenance"
  retry-delay-min: "10s"
  retry-delay-max: "5m"
  shutdown-timeout: "30s"
clickhouse:
  dsn: "${CLICKHOUSE_DSN:clickhouse://127.0.0.1:9000?database=default}"
# Trace runs in this process; native telemetry has its own database.
# A Work with a Project is admitted by the Project access decision at
# project-access-address, which is empty where no context decides Project
# access; one without a Project by Agent's Work access.
trace-clickhouse:
  dsn: "${TRACE_CLICKHOUSE_DSN:clickhouse://default:@127.0.0.1:9000/talgent_trace}"
trace-access:
  project-access-address: "${TRACE_PROJECT_ACCESS_ADDRESS:}"
  agent-address: "${WORK_AGENT_ADDR:http://127.0.0.1:8080}"
  agent-control-token: "${AGENT_CONTROL_TOKEN:}"
trace-authn:
  enabled: "${AUTHENTICATION_ENABLED:true}"
  mode: "gateway-oidc"
account:
  issuer: "${ACCOUNT_ISSUER:http://localhost:3000/auth}"
  audience: "${ACCOUNT_AUDIENCE:talgent}"
  cookie-domain: "${ACCOUNT_COOKIE_DOMAIN:}"
  access-token-lifetime: "15m"
  agent-token-lifetime: "168h"
  session-sliding-lifetime: "720h"
  session-absolute-lifetime: "2160h"
  key-rotation-interval: "720h"
  key-overlap: "10m"
  master-key-path: "${ACCOUNT_MASTER_KEY_PATH:/etc/talgent/account/master-key}"
  github:
    client-id: "${ACCOUNT_GITHUB_CLIENT_ID:}"
    client-secret: "${ACCOUNT_GITHUB_CLIENT_SECRET:}"
    redirect-url: "${ACCOUNT_GITHUB_REDIRECT_URL:http://localhost:3000/auth/github/callback}"
    web-base-url: "${ACCOUNT_GITHUB_WEB_BASE_URL:https://github.com}"
    api-base-url: "${ACCOUNT_GITHUB_API_BASE_URL:https://api.github.com}"
account-mysql:
  dsn: "${ACCOUNT_MYSQL_DSN:talgent@tcp(127.0.0.1:3306)/talgent_account?charset=utf8mb4&parseTime=true}"
agent-account:
  address: "${CONTROLPLANE_INTERNAL_ADDRESS:http://127.0.0.1:8080}"
# Storage owns every space on JuiceFS and NAS.
storage:
  persistent-root: "${STORAGE_PERSISTENT_ROOT:/mnt/talgent}"
  working-root: "${STORAGE_WORKING_ROOT:/mnt/nas}"
  public-base-url: "${STORAGE_PUBLIC_BASE_URL:/api}"
  link-secret: "${STORAGE_LINK_SECRET:}"
  link-ttl: "${STORAGE_LINK_TTL:15m}"
  upload-link-ttl: "2m"
  max-upload-bytes: 1073741824
  agent-token: "${STORAGE_AGENT_TOKEN:}"
  # Callers beyond Agent; an empty token admits no one.
  directory-tokens:
    - "${STORAGE_DIRECTORY_TOKEN:}"
  content-tokens:
    - "${STORAGE_CONTENT_TOKEN:}"
  # Sandboxes mount each Directory from its backend's claim by subPath.
  mounts:
    nas-claim: "${K8S_NAS_PVC_NAME:talgent-nas-root}"
    juicefs-claim: "${K8S_JUICEFS_PVC_NAME:talgent-juicefs-directories}"
    juicefs-root: talgent
  # Every preview limit and timing in one place; conservative
  # starting points, not capacity-tested.
  preview:
    gotenberg-address: "${GOTENBERG_ADDRESS:http://gotenberg:3000}"
    client-timeout: 65s
    task-deadline: 90s
    retention: 720h
    office-source-bytes: 20971520
    rendered-pdf-bytes: 52428800
    native-pdf-bytes: 52428800
    image-bytes: 20971520
    text-bytes: 1048576
    markup-bytes: 1048576
  # Entries one workspace directory lists; a conservative starting point.
  workspace-list-entries: 1000
agent-storage:
  address: "${STORAGE_ADDRESS:http://127.0.0.1:8080}"
  token: "${STORAGE_AGENT_TOKEN:}"
kubernetes:
  kubeconfig-path: "${KUBECONFIG_PATH:}"
native-authentication:
  # Agent verifies every Work credential: reads need its live sandbox,
  # actions also need the Work Working and not awaiting a required response.
  agent-address: "${AGENT_INTERNAL_ADDRESS:http://127.0.0.1:8080}"
  agent-control-token: "${AGENT_CONTROL_TOKEN:}"
agent-execution:
  sandbox-namespace: ${SANDBOX_NAMESPACE:talgent-sandbox}
  # Must equal the OpenSandbox server's sandbox_create_timeout_seconds
  # (deploy/opensandbox/server.yaml); a create waits 30 seconds longer for
  # its answer.
  sandbox-creation-timeout: ${SANDBOX_CREATION_TIMEOUT:5m}
  credential-transport: encrypted-network
  # Model Templates (ConfigMap agent-models) and Model Configurations with
  # their api keys (Secret agent-model-configurations), read once at startup.
  models:
    templates-path: "${MODEL_TEMPLATES_PATH:/etc/talgent/models/templates.yml}"
    configurations-path: "${MODEL_CONFIGURATIONS_PATH:/etc/talgent/model-configurations/configurations.yml}"
  network-allow:
    - "${K8S_DNS_SERVICE_IP:10.43.0.10}"
  network-deny: []
  opensandbox:
    address: ${OPENSANDBOX_ADDRESS:http://opensandbox:80}
    api-key: ${OPENSANDBOX_API_KEY:}
  native:
    binary: claude
  image: ${AGENT_NATIVE_IMAGE:}
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"
  environment:
    # The controlplane's native API, the platform service a sandbox reaches;
    # its Credential Proxy adds the Work credential to every request to it.
    TALGENT_API_ADDRESS: "${NATIVE_PLATFORM_API_ADDRESS:http://controlplane.talgent}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "${NATIVE_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.talgent:4318}"
  dispatcher:
    address: ${DISPATCHER_NATIVE_ADDRESS:http://dispatcher:8083}
    token: ${DISPATCHER_EXECUTION_CONTROL_TOKEN:}
  # Every sandbox expires after its lease unless Agent renews it, so one Agent
  # lost track of is reclaimed within a lease. A running Work's lease is
  # renewed once less than the threshold remains; keep the threshold well
  # above the recovery sweep interval.
  lease:
    duration: "2h"
    renewal-threshold: "1h"
agent-rpc:
  control-token: ${AGENT_CONTROL_TOKEN:}
  feedback-token: ${AGENT_FEEDBACK_TOKEN:}
agent-computer:
  address: "${COMPUTER_ADDRESS:http://127.0.0.1:8080}"
  token: "${COMPUTER_CONTROL_TOKEN:}"
  # Computer Gateway's relay to Managed Computers;
  # empty leaves Managed Computers unreachable.
  relay-address: "${COMPUTER_RELAY_ADDRESS:}"
  # The platform Connector's public HTTPS address a Managed Computer's local
  # proxy reaches; required with relay-address.
  mcp-address: "${COMPUTER_MCP_ADDRESS:}"
  api-address: "${COMPUTER_API_ADDRESS:}"
  # Where the same Connector serves Access Links on its public origin, from
  # which a Managed Computer downloads its Works' inputs; required with
  # relay-address.
  content-address: "${COMPUTER_CONTENT_ADDRESS:}"
  # Where a reader's browser reaches Agent's links to a Managed Work's files;
  # required with relay-address.
  workspace-file-address: "${AGENT_WORKSPACE_FILE_ADDRESS:/api/v1/agent/workspace-files}"
  # The platform's public HTTPS OTLP endpoint a Managed Work's Claude Code
  # sends its telemetry to; required with relay-address.
  telemetry-address: "${COMPUTER_TELEMETRY_ADDRESS:}"
  # The OTel Collector's OTLP HTTP base, to which Agent forwards that
  # telemetry once attributed; required with relay-address.
  telemetry-collector-address: "${COMPUTER_TELEMETRY_COLLECTOR_ADDRESS:}"
# Computer owns every place a Work runs; each cluster is one Cloud.
computer:
  control-token: "${COMPUTER_CONTROL_TOKEN:}"
  # Where a person approves a Talgent Computer registration.
  verification-uri: "${COMPUTER_VERIFICATION_URI:http://localhost:3000/computers/connect}"
  # The oldest Talgent Computer release (X.Y.Z) a Managed Computer may take a run
  # on, told to each machine as it connects; empty admits every release. Raise it
  # only to a release published to npm, at or below the Target Version (the
  # machine service's release-version): above it, every machine upgrades to the
  # Target and still takes no run, and the machine service logs an error.
  minimum-version: "${COMPUTER_MINIMUM_VERSION:}"
  cloud:
    # Fixed for good: every Work keeps the Cloud it started on.
    id: "${COMPUTER_CLOUD_ID:01a19bc3-075a-7c57-b42b-7fdf73b611ed}"
    name: "${COMPUTER_CLOUD_NAME:Talgent Cloud}"
    # The room the platform gives runs: the quota below, in the sandbox
    # namespace, counts only execution Pods; each admission still checks it.
    capacity:
      requests.cpu: "8"
      requests.memory: "12Gi"
      pods: "64"
    namespace: ${SANDBOX_NAMESPACE:talgent-sandbox}
    quota-name: agent-executions
    # Everything the quota charges for one execution Pod, not just the sandbox
    # container (agent-execution requests/limits): plus the egress sidecar
    # (LimitRange default 100m/128Mi) and the kata-qemu-runtime-rs RuntimeClass
    # overhead (250m/320Mi). Under-stating it admits starts that the quota then
    # rejects at Pod creation. Keep in step with those three sources.
    demand:
      requests.cpu: "600m"
      requests.memory: "960Mi"
      limits.cpu: "2250m"
      limits.memory: "2368Mi"
      pods: "1"
# The procedures an Agent reaches with its Work credential: directly, or
# through the platform Connector where one is deployed.
native-api:
  addr: "${NATIVE_API_ADDR::8081}"

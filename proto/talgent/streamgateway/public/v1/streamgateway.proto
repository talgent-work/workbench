syntax = "proto3";

package talgent.streamgateway.public.v1;

import "google/protobuf/timestamp.proto";
import "talgent/agent/public/v1/startup.proto";
import "talgent/agent/public/v1/subagents.proto";
import "talgent/dispatcher/public/v1/unified_message.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/streamgateway/public/v1;streamgatewaypublicv1";

// StreamGatewayService service.
service StreamGatewayService {
  // WatchStream RPC.
  rpc WatchStream(WatchStreamRequest) returns (stream WatchStreamResponse);
  // ListMessagesBySession RPC.
  rpc ListMessagesBySession(ListMessagesBySessionRequest) returns (ListMessagesBySessionResponse);
  // Read a bounded page of original tool input/output or error detail.
  rpc GetMessageDetail(GetMessageDetailRequest) returns (GetMessageDetailResponse);
  // Read original input and output together, each bounded independently.
  rpc GetToolDetail(GetToolDetailRequest) returns (GetToolDetailResponse);
}

// GetToolDetailRequest addresses one tool call's recorded input and output.
message GetToolDetailRequest {
  // Work that made the call.
  string agent_work_id = 1;
  // Harness identity of the tool call.
  string tool_call_id = 2;
  // Zero-based Unicode code-point offset into the input body.
  uint32 input_offset = 3;
  // Zero-based Unicode code-point offset into the output body.
  uint32 output_offset = 4;
  // Per-body page size; defaults to 16384, capped at 65536.
  uint32 limit = 5;
}

// GetToolDetailResponse pages the call's input and output independently.
message GetToolDetailResponse {
  // An absent side has not been recorded. A present empty body is a valid result.
  GetMessageDetailResponse input = 1;
  // The tool's result, under the same rules as the input.
  GetMessageDetailResponse output = 2;
  // What a Read, Write or Edit call read, wrote or changed, from its own
  // result; sent with the first page (both offsets zero) only, and absent
  // when the result held no preview matching the called tool.
  talgent.dispatcher.public.v1.ToolOutputPreview preview = 3;
}

// GetMessageDetailRequest addresses one message's full detail body.
message GetMessageDetailRequest {
  // Work the message belongs to.
  string agent_work_id = 1;
  // Message whose detail is read.
  string message_id = 2;
  // Zero-based Unicode code-point offset.
  uint32 offset = 3;
  // Defaults to 16384, capped at 65536 Unicode code points.
  uint32 limit = 4;
}

// GetMessageDetailResponse is one page of a detail body.
message GetMessageDetailResponse {
  // NONE means no detail exists; TEXT/JSON with zero length is a valid empty result.
  talgent.dispatcher.public.v1.MessageDetailFormat format = 1;
  // This page of the body.
  string text = 2;
  // Length of the whole body in Unicode code points.
  uint32 total_length = 3;
  // Offset of the next page; equals total_length after the last page.
  uint32 next_offset = 4;
}

// WatchStreamRequest message.
message WatchStreamRequest {
  // AgentWork identity.
  string agent_work_id = 1;
  // after timestamp field.
  google.protobuf.Timestamp after_timestamp = 2;
  // after id field.
  string after_id = 3;
  // Same Agent, turn and kind scope as history.
  optional string agent = 4;
  // Match any listed turn; empty matches every turn.
  repeated string turn_ids = 5;
  // Match any listed product kind; empty matches every kind.
  repeated talgent.dispatcher.public.v1.UnifiedMessageKind kinds = 6;
  // Include Session errors with unknown Agent attribution without relabeling them.
  bool include_unattributed_errors = 7;
}

// WatchStreamResponse message.
message WatchStreamResponse {
  // Stored-history replay must not trigger new-user-message scroll behavior.
  bool replay = 1;
  // payload choice.
  oneof payload {
    // A live or replayed message, without its detail body.
    talgent.dispatcher.public.v1.UnifiedMessage message = 2;
    // work state field.
    WorkStateFrame work_state = 3;
    // diagnostic field.
    StreamDiagnosticFrame diagnostic = 4;
    // The reader's access to this Work's conversation was withdrawn; the
    // stream ends after this frame. Distinct from a connection error.
    AccessWithdrawnFrame access_withdrawn = 5;
  }
}

// AccessWithdrawnFrame ends a reader's stream after a Work Share was revoked
// or the Work became private.
message AccessWithdrawnFrame {
  // AgentWork identity.
  string agent_work_id = 1;
}

// WorkAccessFrame is Agent's live notice that readers lost access to a Work's
// message stream. It is published to Streamgateway, never sent to clients.
message WorkAccessFrame {
  // AgentWork identity.
  string agent_work_id = 1;
  // The withdrawal.
  oneof change {
    // One reader's Work Share was revoked.
    string revoked_reader_id = 2;
    // The Work became private; readers other than these lost access.
    RetainedWorkReaders made_private = 3;
  }
}

// RetainedWorkReaders are the owner and Work Share holders of a private Work.
message RetainedWorkReaders {
  // Readers that keep access.
  repeated string reader_ids = 1;
}

// Exclusive boundary in the Session history ordering (timestamp, id).
message MessageHistoryCursor {
  // Stored timestamp at millisecond precision.
  google.protobuf.Timestamp timestamp = 1;
  // Message identity breaking ties at the same timestamp.
  string id = 2;
}

// ListMessagesBySessionRequest message.
message ListMessagesBySessionRequest {
  // AgentWork identity.
  string agent_work_id = 1;
  // tool call ids field.
  repeated string tool_call_ids = 2;
  // Maximum messages per page, capped at 500; non-positive values default to 500.
  int32 limit = 3;
  // interaction ids field.
  repeated string interaction_ids = 4;
  // Exclusive boundary within the filtered history. Omit for the latest page.
  MessageHistoryCursor before = 5;
  // Match any listed product kind, intersected with the other filters.
  repeated talgent.dispatcher.public.v1.UnifiedMessageKind kinds = 6;
  // Omit for all Agents; empty selects the confirmed Harness root.
  optional string agent = 7;
  // Match any listed turn, intersected with every other filter.
  repeated string turn_ids = 8;
  // Include Session errors with unknown Agent attribution without relabeling them.
  bool include_unattributed_errors = 9;
  // Inclusive start for an ascending page, mutually exclusive with before.
  // Used to navigate to a known message without loading the intervening history.
  MessageHistoryCursor from = 10;
}

// ListMessagesBySessionResponse message.
message ListMessagesBySessionResponse {
  // Messages without their detail bodies; GetMessageDetail reads a detail.
  repeated talgent.dispatcher.public.v1.UnifiedMessage messages = 1;
  // Raw oldest returned position, independent of visible message filtering.
  MessageHistoryCursor next_before = 2;
  // Whether another page exists in the requested direction (newer for from).
  bool has_more = 3;
}

// WorkProgress message.
message WorkProgress {
  // items field.
  repeated WorkProgressItem items = 1;
  // updated at field.
  google.protobuf.Timestamp updated_at = 2;
}

// WorkProgressItem message.
message WorkProgressItem {
  // id field.
  string id = 1;
  // content field.
  string content = 2;
  // status field.
  string status = 3;
  // active form field.
  string active_form = 4;
}

// WorkStateFrame message.
message WorkStateFrame {
  // AgentWork identity.
  string agent_work_id = 1;
  // state field.
  string state = 2;
  // state reason field.
  string state_reason = 3;
  // updated at field.
  google.protobuf.Timestamp updated_at = 4;
  // work progress field.
  WorkProgress work_progress = 5;
  // Same preparation projection returned by the authorized Session query.
  talgent.agent.public.v1.StartupProgress preparation_progress = 6;
  // SubAgents of the Work's current Harness process, in delegation order;
  // empty once it ended.
  repeated talgent.agent.public.v1.SubAgent subagents = 7;
}

// StreamDiagnosticFrame is live only: never stored and never replayed.
message StreamDiagnosticFrame {
  // AgentWork identity.
  string agent_work_id = 1;
  // "error" for a delivery failure; "warning" for a notice told live to readers.
  string severity = 2;
  // Delivery failures: storage_unavailable, live_delivery_unavailable.
  // Notices, model provider refusals the Harness or a SubAgent recovers from:
  // model_rate_limited, model_unavailable; a reply whose request had already
  // closed when it was delivered: interaction_closed.
  string reason = 3;
  // Human-readable text; for a notice, the provider's own explanation if any.
  string message = 4;
  // occurred at field.
  google.protobuf.Timestamp occurred_at = 5;
}

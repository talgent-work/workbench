syntax = "proto3";

package talgent.computer.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/computer/public/v1;computerpublicv1";

// RegistrationService registers a machine as a Managed Computer by device
// code: Talgent Computer starts a registration, the person approves its user
// code while signed in to the browser, and Talgent Computer redeems it for
// the new Computer and its Computer Credential, issued once. It is called
// before the machine holds any credential, so it authenticates no caller.
service RegistrationService {
  // StartRegistration opens a registration that expires unless approved.
  rpc StartRegistration(StartRegistrationRequest) returns (StartRegistrationResponse);
  // RedeemRegistration answers pending until the registration is approved,
  // then registers the Computer and returns its credential once. An unknown,
  // expired or already redeemed registration is NotFound.
  rpc RedeemRegistration(RedeemRegistrationRequest) returns (RedeemRegistrationResponse);
}

// StartRegistrationRequest describes the machine.
message StartRegistrationRequest {
  // The name proposed for the Computer, such as the machine's host name.
  string machine_name = 1;
}

// StartRegistrationResponse is what Talgent Computer shows and polls with.
message StartRegistrationResponse {
  // The secret Talgent Computer redeems the registration with.
  string device_code = 1;
  // The short code the person confirms in the browser.
  string user_code = 2;
  // Where the person approves it.
  string verification_uri = 3;
  // The same page with the user code filled in.
  string verification_uri_complete = 4;
  // Seconds until the registration expires.
  int32 expires_in_seconds = 5;
  // Seconds to wait between redemption attempts.
  int32 interval_seconds = 6;
}

// RedeemRegistrationRequest redeems one registration.
message RedeemRegistrationRequest {
  // The device code from StartRegistration.
  string device_code = 1;
}

// RedemptionStatus is how far a registration got.
enum RedemptionStatus {
  // Not set.
  REDEMPTION_STATUS_UNSPECIFIED = 0;
  // The person has not approved it yet.
  REDEMPTION_STATUS_PENDING = 1;
  // The Computer is registered; its credential is in this answer only.
  REDEMPTION_STATUS_REGISTERED = 2;
}

// RedeemRegistrationResponse carries the Computer once registered.
message RedeemRegistrationResponse {
  // How far the registration got.
  RedemptionStatus status = 1;
  // The registered Computer's identity.
  string computer_id = 2;
  // Its name.
  string name = 3;
  // Its Computer Credential, returned only this once.
  string credential = 4;
  // When the credential expires, in Unix milliseconds.
  int64 credential_expires_at_unix_ms = 5;
}

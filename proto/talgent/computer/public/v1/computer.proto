syntax = "proto3";

package talgent.computer.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/computer/public/v1;computerpublicv1";

// ComputerService serves the signed-in person's own Managed Computers. A
// Cloud never appears here.
service ComputerService {
  // ListComputers lists the person's Managed Computers, newest first.
  rpc ListComputers(ListComputersRequest) returns (ListComputersResponse);
  // ListUsableComputers lists the Computers the person may start a Work on:
  // every Cloud, then their own Managed Computers, newest first.
  rpc ListUsableComputers(ListUsableComputersRequest) returns (ListUsableComputersResponse);
  // RenameComputer renames one of the person's Managed Computers.
  rpc RenameComputer(RenameComputerRequest) returns (RenameComputerResponse);
  // SetRoomRules sets how many Works one of the person's Managed Computers
  // runs at once and what it answers a run while full. A Capacity outside 1
  // to 32 is InvalidArgument; one below the Works it runs now is
  // FailedPrecondition.
  rpc SetRoomRules(SetRoomRulesRequest) returns (SetRoomRulesResponse);
  // RemoveComputer removes one of the person's Managed Computers for good:
  // its credential is revoked, its machine is disconnected and can no
  // longer connect or run anything, and its Works lose their execution
  // environment. Removing it again does nothing; another person's is
  // NotFound.
  rpc RemoveComputer(RemoveComputerRequest) returns (RemoveComputerResponse);
  // GetRegistration reads a pending registration by its user code, so the
  // person sees which machine they approve.
  rpc GetRegistration(GetRegistrationRequest) returns (GetRegistrationResponse);
  // ApproveRegistration approves a pending registration as the signed-in
  // person, who becomes the new Computer's owner. Approving it again does
  // nothing; an unknown or expired code is NotFound, and a code another
  // person approved is FailedPrecondition.
  rpc ApproveRegistration(ApproveRegistrationRequest) returns (ApproveRegistrationResponse);
}

// Presence is whether the platform can reach a Computer now.
message Presence {
  // The platform reaches it.
  bool reachable = 1;
  // When the platform lost reach of it, in Unix milliseconds; zero while
  // reachable or when it never connected.
  int64 unreachable_since_unix_ms = 2;
  // It has never connected since it was registered.
  bool never_connected = 3;
}

// ManagedComputer is one of the person's machines.
message ManagedComputer {
  // Computer identity.
  string id = 1;
  // Display name.
  string name = 2;
  // Whether it is reachable now.
  Presence presence = 3;
  // The Talgent Computer version it last reported; empty before it connects.
  string talgent_computer_version = 4;
  // The Claude Code version it last reported; empty when unknown.
  string claude_code_version = 5;
  // When it was registered, in Unix milliseconds.
  int64 registered_at_unix_ms = 6;
  // How many Works it runs at once.
  int64 capacity = 7;
  // What it answers a run while full.
  AdmissionPolicy admission_policy = 8;
  // How many Works it runs now.
  int64 running = 9;
  // How many runs wait in its line for room.
  int64 waiting = 10;
}

// AdmissionPolicy is what a full Computer answers a run.
enum AdmissionPolicy {
  // Not set.
  ADMISSION_POLICY_UNSPECIFIED = 0;
  // A full Computer rejects the run.
  ADMISSION_POLICY_REJECT = 1;
  // A full Computer queues the run; its Work stays Starting until room
  // frees up.
  ADMISSION_POLICY_QUEUE = 2;
}

// SetRoomRulesRequest sets one Computer's room rules.
message SetRoomRulesRequest {
  // Computer identity.
  string computer_id = 1;
  // How many Works it runs at once, 1 to 32.
  int64 capacity = 2;
  // What it answers a run while full.
  AdmissionPolicy admission_policy = 3;
}

// SetRoomRulesResponse is the Computer with its new rules.
message SetRoomRulesResponse {
  // The Computer as it is now.
  ManagedComputer computer = 1;
}

// RemoveComputerRequest names the Computer to remove.
message RemoveComputerRequest {
  // Computer identity.
  string computer_id = 1;
}

// RemoveComputerResponse acknowledges the removal.
message RemoveComputerResponse {}

// ListComputersRequest lists the caller's own.
message ListComputersRequest {}

// ListComputersResponse is the person's Managed Computers.
message ListComputersResponse {
  // Newest first.
  repeated ManagedComputer computers = 1;
}

// RenameComputerRequest names one Computer anew.
message RenameComputerRequest {
  // Computer identity.
  string computer_id = 1;
  // The new name, 1 to 64 characters after trimming.
  string name = 2;
}

// RenameComputerResponse is the renamed Computer.
message RenameComputerResponse {
  // The Computer with its new name.
  ManagedComputer computer = 1;
}

// GetRegistrationRequest names a pending registration.
message GetRegistrationRequest {
  // The user code Talgent Computer shows, with or without its dash.
  string user_code = 1;
}

// GetRegistrationResponse is the pending registration.
message GetRegistrationResponse {
  // The machine's proposed name.
  string machine_name = 1;
  // When it expires, in Unix milliseconds.
  int64 expires_at_unix_ms = 2;
  // The caller already approved it.
  bool approved = 3;
}

// ApproveRegistrationRequest approves one registration.
message ApproveRegistrationRequest {
  // The user code Talgent Computer shows, with or without its dash.
  string user_code = 1;
}

// ApproveRegistrationResponse acknowledges the approval.
message ApproveRegistrationResponse {}

// UsableComputerKind is what a usable Computer is.
enum UsableComputerKind {
  // Not set.
  USABLE_COMPUTER_KIND_UNSPECIFIED = 0;
  // A Cloud the platform operates.
  USABLE_COMPUTER_KIND_CLOUD = 1;
  // One of the person's Managed Computers.
  USABLE_COMPUTER_KIND_MANAGED = 2;
}

// UsableComputer is one Computer a person may start a Work on.
message UsableComputer {
  // Computer identity.
  string id = 1;
  // Display name.
  string name = 2;
  // What it is.
  UsableComputerKind kind = 3;
  // For a Managed Computer, whether the platform reaches it now; a Cloud is
  // always reachable.
  bool reachable = 4;
  // For a Managed Computer, whether its machine last reported that it can
  // provide Claude Code's sandbox; a Cloud provides none.
  bool claude_code_sandbox = 5;
}

// ListUsableComputersRequest lists the caller's choices.
message ListUsableComputersRequest {}

// ListUsableComputersResponse is the caller's choices, Clouds first.
message ListUsableComputersResponse {
  // Every Cloud, then the person's Managed Computers.
  repeated UsableComputer computers = 1;
}

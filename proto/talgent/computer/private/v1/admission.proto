syntax = "proto3";

package talgent.computer.private.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/computer/private/v1;computerprivatev1";

// AdmissionService is Computer's admission contract for Agent: which
// Computers a person may run a Work on, and whether a Computer takes one run
// of a Work now. Each run holds a Desk from admission until Agent reports its
// departure.
service AdmissionService {
  // ListUsableComputers lists the Computers a person may start a Work on:
  // every Cloud, then the person's own Managed Computers.
  rpc ListUsableComputers(ListUsableComputersRequest) returns (ListUsableComputersResponse);
  // AdmitRun answers one run of a Work on a Computer. The Desk identity is
  // the caller's: repeating it returns the Desk's current answer instead of
  // opening another one.
  rpc AdmitRun(AdmitRunRequest) returns (AdmitRunResponse);
  // LeaveDesk reports that a run's Desk leaves: its process ended and its
  // compute is released, its seated run can no longer start, or its waiting
  // run was withdrawn. Repeating it, or naming an unknown Desk, does nothing.
  rpc LeaveDesk(LeaveDeskRequest) returns (LeaveDeskResponse);
  // ListOpenDesks pages through Desks still waiting or occupied that were
  // opened before a time, in identity order, so Agent can report the
  // departure of a run it no longer holds.
  rpc ListOpenDesks(ListOpenDesksRequest) returns (ListOpenDesksResponse);
  // DescribeComputer says what a Computer is, so Agent reaches it through the
  // matching realization of its execution port. A removed Computer is still
  // described; an unknown one is NotFound.
  rpc DescribeComputer(DescribeComputerRequest) returns (DescribeComputerResponse);
  // GetDesk says where one Desk stands now, so Agent seats a waiting start
  // whose Desk Assigned it missed. An unknown Desk is NotFound.
  rpc GetDesk(GetDeskRequest) returns (GetDeskResponse);
}

// ComputerKind is what a Computer is.
enum ComputerKind {
  // Not set.
  COMPUTER_KIND_UNSPECIFIED = 0;
  // A Cloud the platform operates, one per cluster.
  COMPUTER_KIND_CLOUD = 1;
  // A machine a person registered as their own.
  COMPUTER_KIND_MANAGED = 2;
}

// UsableComputer is one Computer a person may choose.
message UsableComputer {
  // Computer identity.
  string id = 1;
  // What the Computer is.
  ComputerKind kind = 2;
  // Display name.
  string name = 3;
}

// ListUsableComputersRequest names the person choosing.
message ListUsableComputersRequest {
  // The person starting a Work.
  string person_id = 1;
}

// ListUsableComputersResponse lists Clouds first.
message ListUsableComputersResponse {
  // The Computers, every Cloud then the person's Managed Computers.
  repeated UsableComputer computers = 1;
}

// AdmitRunRequest is one run of a Work.
message AdmitRunRequest {
  // The Computer the Work runs on.
  string computer_id = 1;
  // The caller's identity for this run's Desk, a UUID.
  string desk_id = 2;
  // The Work the run belongs to.
  string work_id = 3;
  // The owner of the Work's Agent.
  string work_owner_id = 4;
  // Who starts this run.
  string starter_id = 5;
  // The run asks for Claude Code's sandbox, which only a machine that
  // reports it can provide admits.
  bool sandbox = 6;
}

// AdmissionAnswer is a Computer's answer to one run.
enum AdmissionAnswer {
  // Not set.
  ADMISSION_ANSWER_UNSPECIFIED = 0;
  // The run holds its room and may start now.
  ADMISSION_ANSWER_SEATED = 1;
  // The run waits in the Computer's line for room.
  ADMISSION_ANSWER_WAITING = 2;
  // The run is refused; nothing is held for it.
  ADMISSION_ANSWER_REJECTED = 3;
}

// RejectionReason says why a run was refused.
enum RejectionReason {
  // Not set; the run was not rejected.
  REJECTION_REASON_UNSPECIFIED = 0;
  // The Computer has no room and rejects when full, or its cluster's quota
  // cannot fit the run.
  REJECTION_REASON_FULL = 1;
  // The starter may not use this Computer.
  REJECTION_REASON_NOT_USABLE = 2;
  // The platform cannot reach the Computer now.
  REJECTION_REASON_UNREACHABLE = 3;
  // The Computer was removed.
  REJECTION_REASON_REMOVED = 4;
  // The Computer runs a Talgent Computer below the Minimum Version.
  REJECTION_REASON_OUTDATED = 5;
  // The run asks for Claude Code's sandbox, which the Computer cannot provide.
  REJECTION_REASON_SANDBOX_UNAVAILABLE = 6;
}

// AdmitRunResponse is the Computer's answer.
message AdmitRunResponse {
  // The answer to the run.
  AdmissionAnswer answer = 1;
  // Set when the answer is rejected.
  RejectionReason reason = 2;
  // What the Computer is, set when the answer is rejected, so the caller
  // words a full Cloud as before Clouds were Computers and a full Managed
  // Computer by its Capacity.
  ComputerKind computer_kind = 3;
}

// LeaveDeskRequest names the Desk that leaves.
message LeaveDeskRequest {
  // The Desk identity given at admission.
  string desk_id = 1;
}

// LeaveDeskResponse acknowledges the departure.
message LeaveDeskResponse {}

// ListOpenDesksRequest selects one page of open Desks.
message ListOpenDesksRequest {
  // Only Desks opened before this time, in Unix milliseconds.
  int64 opened_before_unix_ms = 1;
  // Continue after this Desk identity; empty starts at the beginning.
  string after_desk_id = 2;
  // Page size; zero or above 500 means 500.
  int32 limit = 3;
}

// OpenDesk is one waiting or occupied Desk.
message OpenDesk {
  // The Desk identity.
  string desk_id = 1;
  // The Work its run belongs to.
  string work_id = 2;
}

// ListOpenDesksResponse is one page; an empty page ends the listing.
message ListOpenDesksResponse {
  // The Desks of this page.
  repeated OpenDesk desks = 1;
}

// DescribeComputerRequest names the Computer.
message DescribeComputerRequest {
  // Computer identity.
  string computer_id = 1;
}

// DescribeComputerResponse is what the Computer is.
message DescribeComputerResponse {
  // What the Computer is.
  ComputerKind kind = 1;
  // The person a Managed Computer belongs to; empty for a Cloud.
  string owner_id = 2;
  // Whether its owner removed it; a removed Computer has lost every Work's
  // execution environment on it.
  bool removed = 3;
  // Its Presence: whether the platform reaches it now. A Cloud is always
  // reachable.
  bool reachable = 4;
  // When the platform lost reach of it, set while it is unreachable.
  google.protobuf.Timestamp unreachable_since = 5;
  // Its current name, as people see it.
  string name = 6;
}

// DeskState is where a Desk stands.
enum DeskState {
  // Not set.
  DESK_STATE_UNSPECIFIED = 0;
  // Its run waits in its Computer's line for room.
  DESK_STATE_WAITING = 1;
  // Its run holds room and may start.
  DESK_STATE_OCCUPIED = 2;
  // It left; its room returned to its Computer.
  DESK_STATE_VACATED = 3;
}

// GetDeskRequest names the Desk.
message GetDeskRequest {
  // The Desk identity given at admission.
  string desk_id = 1;
}

// GetDeskResponse is where the Desk stands.
message GetDeskResponse {
  // Its state now.
  DeskState state = 1;
  // When its run was seated, set while it is occupied; a seated start's
  // Startup Deadline counts from it.
  google.protobuf.Timestamp seated_at = 2;
}

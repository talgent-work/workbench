syntax = "proto3";

package talgent.agent.private.v1;

import "talgent/streamgateway/public/v1/streamgateway.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/private/v1;agentprivatev1";

// WorkAccessService decides who reads a Work's message stream from Agent's own
// facts: its owner, Work Visibility and Work Shares. A trusted caller supplies
// only what Agent cannot know, such as a reader's membership of the scope the
// visibility names.
service WorkAccessService {
  // AdmitWorkReader admits the owner; a Work Share holder of a private Work; or,
  // while public, a reader the trusted caller admits within the Work's scope.
  // A reader that is not admitted is refused with PermissionDenied.
  rpc AdmitWorkReader(AdmitWorkReaderRequest) returns (AdmitWorkReaderResponse);
  // GrantWorkShare lets the owner of a human's Work share it with a reader the
  // trusted caller admits within the Work's scope. Granting again changes nothing.
  rpc GrantWorkShare(GrantWorkShareRequest) returns (GrantWorkShareResponse);
  // RevokeDepartedReader ends a reader's Work Shares on every Work within the
  // scope the trusted caller reports the reader has left.
  rpc RevokeDepartedReader(RevokeDepartedReaderRequest) returns (RevokeDepartedReaderResponse);
}

// ReaderAdmission is a trusted caller's statement that a reader is a member of
// a Project; it admits a reader only to Works of that Project.
message ReaderAdmission {
  // Always "project"; any other value admits nothing.
  string reference = 1;
  // Its value the reader is within.
  string value = 2;
}

// WorkReadBasis is why a reader is admitted.
enum WorkReadBasis {
  // Not admitted.
  WORK_READ_BASIS_UNSPECIFIED = 0;
  // The Work's owner.
  WORK_READ_BASIS_OWNER = 1;
  // A Work Share holder of a private Work.
  WORK_READ_BASIS_SHARE = 2;
  // A reader the trusted caller admitted within a public Work's scope.
  WORK_READ_BASIS_PUBLIC = 3;
}

// AdmitWorkReaderRequest names the Work and the reader.
message AdmitWorkReaderRequest {
  // Work whose message stream is read.
  string work_id = 1;
  // Reading human.
  string reader_id = 2;
  // Optional trusted admission for a public Work.
  ReaderAdmission admission = 3;
  // Asks for the Work's current state along with the admission, for a caller
  // starting the reader's stream.
  bool include_work_state = 4;
}

// AdmitWorkReaderResponse states why the reader is admitted.
message AdmitWorkReaderResponse {
  // Never unspecified on success.
  WorkReadBasis basis = 1;
  // When asked for: the Work's current state, the frame the admitted reader's
  // stream starts from.
  talgent.streamgateway.public.v1.WorkStateFrame work_state = 2;
}

// GrantWorkShareRequest carries the owner's request and the supplied admission.
message GrantWorkShareRequest {
  // The owner's Work.
  string work_id = 1;
  // Requesting human; must be the Work's owner.
  string requester_id = 2;
  // Reader receiving the Work Share.
  string reader_id = 3;
  // Trusted statement that the reader is within the Work's visibility scope.
  ReaderAdmission admission = 4;
}

// GrantWorkShareResponse confirms the reader holds a Work Share.
message GrantWorkShareResponse {}

// RevokeDepartedReaderRequest names the reader and the scope it left.
message RevokeDepartedReaderRequest {
  // Reader that left the scope.
  string reader_id = 1;
  // The scope left, such as the Project it no longer belongs to.
  ReaderAdmission scope = 2;
}

// RevokeDepartedReaderResponse confirms no Work in that scope shares with the reader.
message RevokeDepartedReaderResponse {}

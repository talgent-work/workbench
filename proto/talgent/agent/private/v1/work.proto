syntax = "proto3";

package talgent.agent.private.v1;

import "google/protobuf/struct.proto";
import "talgent/agent/private/v1/work_subject.proto";
import "talgent/agent/public/v1/appearance.proto";
import "talgent/agent/public/v1/harness.proto";
import "talgent/agent/public/v1/model.proto";
import "talgent/agent/public/v1/progress.proto";
import "talgent/agent/public/v1/work_start_options.proto";
import "talgent/marketplace/public/v1/marketplace.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/private/v1;agentprivatev1";

// AgentService is the authenticated internal control API used by Session callers.
service AgentService {
  // GetWorkStartOptions resolves capabilities for a caller-selected definition or Work.
  rpc GetWorkStartOptions(GetWorkStartOptionsRequest) returns (talgent.agent.public.v1.GetWorkStartOptionsResponse);
  // ListWorkStartRepositories discovers the repositories an admitted owner may check out.
  rpc ListWorkStartRepositories(ListWorkStartRepositoriesRequest) returns (talgent.agent.public.v1.WorkStartRepositories);
  // GetWorkStartup reads initial rejection, cleanup and outstanding creation facts.
  rpc GetWorkStartup(GetWorkStartupRequest) returns (GetWorkStartupResponse);
  // GetWorkOrigin reads retained source attribution for authenticated internal consumers.
  rpc GetWorkOrigin(GetWorkOriginRequest) returns (GetWorkOriginResponse);
  // ResolveWorkContextPosition is the Work Context Position Query: it names the
  // position in a Work's context where one of its calls returned, from which a
  // new Work of the same definition may start.
  rpc ResolveWorkContextPosition(ResolveWorkContextPositionRequest) returns (ResolveWorkContextPositionResponse);
  // ResolveWorkStarts reports who started each Work of one Project and when, for a Causal Chain.
  rpc ResolveWorkStarts(ResolveWorkStartsRequest) returns (ResolveWorkStartsResponse);
  // GetWorkPreparation reads the application-owned initial input and progress.
  rpc GetWorkPreparation(GetWorkPreparationRequest) returns (GetWorkPreparationResponse);
  // ListSubmittedPreparations supplies durable admitted facts for business projections.
  rpc ListSubmittedPreparations(ListSubmittedPreparationsRequest) returns (ListSubmittedPreparationsResponse);
  // PrepareWorkExecution retains an explicit first-input request and coordinates execution preparation.
  // With creation, request_id is the caller's creation request identity: it
  // yields at most one Work, a repeat returns the original outcome, and a
  // cancelled identity answers FailedPrecondition and creates nothing.
  rpc PrepareWorkExecution(PrepareWorkExecutionRequest) returns (PrepareWorkExecutionResponse);
  // GetWorkCreation reads a creation request identity's outcome without advancing it.
  rpc GetWorkCreation(GetWorkCreationRequest) returns (GetWorkCreationResponse);
  // CancelWorkCreation settles an unanswered creation request identity: it
  // returns the Work the identity already created, or cancels the identity so
  // that a delayed repeat creates nothing.
  rpc CancelWorkCreation(CancelWorkCreationRequest) returns (CancelWorkCreationResponse);
  // VerifyWorkCredential authenticates a native process by the credential of its Work's current live sandbox.
  rpc VerifyWorkCredential(VerifyWorkCredentialRequest) returns (VerifyWorkCredentialResponse);
  // GetStartAdmission reads whether a start request was admitted after Work authorization.
  rpc GetStartAdmission(GetStartAdmissionRequest) returns (GetStartAdmissionResponse);
  // ChangeAgentDefinitionCapabilities updates future Session capabilities without changing existing snapshots.
  rpc ChangeAgentDefinitionCapabilities(ChangeAgentDefinitionCapabilitiesRequest) returns (ChangeAgentDefinitionCapabilitiesResponse);
  // GetAgentDefinition reads the current reusable capability configuration.
  rpc GetAgentDefinition(GetAgentDefinitionRequest) returns (GetAgentDefinitionResponse);
  // GetAgentDefinitionForPurpose resolves an internal definition in an authorized usage scope.
  rpc GetAgentDefinitionForPurpose(GetAgentDefinitionForPurposeRequest) returns (GetAgentDefinitionForPurposeResponse);
  // ResolveEmployeeAgents reads several employees' own work Agents and their current appearance at once.
  rpc ResolveEmployeeAgents(ResolveEmployeeAgentsRequest) returns (ResolveEmployeeAgentsResponse);
  // GetEmployeeAgent reads an employee's own work Agent, or the appearance it would be established with; it never creates one.
  rpc GetEmployeeAgent(GetEmployeeAgentRequest) returns (GetEmployeeAgentResponse);
  // ResolveWorkAgents reads the current appearance of several Works' Agents at once.
  rpc ResolveWorkAgents(ResolveWorkAgentsRequest) returns (ResolveWorkAgentsResponse);
  // CreateAgentDefinition delegates to the Agent application; acceptance does not imply completion.
  rpc CreateAgentDefinition(CreateAgentDefinitionRequest) returns (CreateAgentDefinitionResponse);
  // EnsureAgentDefinition supplies product defaults only for missing state.
  rpc EnsureAgentDefinition(EnsureAgentDefinitionRequest) returns (EnsureAgentDefinitionResponse);
  // EnsureEmployeeAgent returns a person's employee definition, which Agent
  // establishes itself from product defaults on its first need.
  rpc EnsureEmployeeAgent(EnsureEmployeeAgentRequest) returns (EnsureEmployeeAgentResponse);
  // TransferAgentDefinitionOwners replaces a definition's Owners; every one of
  // its Works answers to them from then on.
  rpc TransferAgentDefinitionOwners(TransferAgentDefinitionOwnersRequest) returns (TransferAgentDefinitionOwnersResponse);
  // CreateWork returns the definition's Work for the Subject, creating it when none exists.
  rpc CreateWork(CreateWorkRequest) returns (CreateWorkResponse);
  // CancelWorkRegistration fences an unknown initial creation or returns its already admitted Work.
  rpc CancelWorkRegistration(CancelWorkRegistrationRequest) returns (CancelWorkRegistrationResponse);
  // LocateWork resolves an existing business binding without creating or starting execution.
  rpc LocateWork(LocateWorkRequest) returns (LocateWorkResponse);
  // ResumeWork delegates to the Agent application; acceptance does not imply completion.
  rpc ResumeWork(ResumeWorkRequest) returns (ResumeWorkResponse);
  // RestartWork delegates to the Agent application; acceptance does not imply completion.
  rpc RestartWork(RestartWorkRequest) returns (RestartWorkResponse);
  // EndWorkExecution ends the Work's Harness process or prevents a pending start request's admission, without closing its conversation.
  rpc EndWorkExecution(EndWorkExecutionRequest) returns (EndWorkExecutionResponse);
  // StopWork delegates to the Agent application; acceptance does not imply completion.
  rpc StopWork(StopWorkRequest) returns (StopWorkResponse);
  // CloseWork is the one way to close a Work permanently. A stopped or failed
  // Work closes; a running Work is stopped between Turns first and closes once
  // stopped. It is refused while a Turn runs or work is outstanding. Success
  // confirms durable acceptance, not process exit or workspace cleanup.
  rpc CloseWork(CloseWorkRequest) returns (CloseWorkResponse);
  // DeliverInput delegates to the Agent application; acceptance does not imply completion.
  rpc DeliverInput(DeliverInputRequest) returns (DeliverInputResponse);
  // RespondToInteraction answers a current required user interaction after Session authorization.
  rpc RespondToInteraction(RespondToInteractionRequest) returns (RespondToInteractionResponse);
  // GetWork delegates to the Agent application; acceptance does not imply completion.
  rpc GetWork(GetWorkRequest) returns (GetWorkResponse);
}

// RepositorySelection identifies one repository reachable under the owner's authorization.
message RepositorySelection {
  // External repository identity, such as github:123.
  string repository_id = 1;
  // Selected base branch.
  string base_branch = 2;
}

// PrepareWorkExecutionRequest retains one initial input for this Session.
message PrepareWorkExecutionRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Existing conversation identity; preparation never replaces the Session.
  string work_id = 2;
  // Stable explicit startup request identity.
  string request_id = 3;
  // Stable initial input identity retained through delivery retries.
  string input_id = 4;
  // Original initial input body.
  string input = 5;
  // Repository selections frozen before execution admission.
  repeated RepositorySelection selections = 6;
  // Establish or locate the binding, committing new Session and initial input together.
  // Mutually exclusive with work_id.
  CreateWorkRequest creation = 7;
  // Initial Harness effort; absence uses the deployment default.
  string thinking_level = 8;
  // Branch the caller names for repository checkouts; required when the Work
  // selected repositories.
  string work_branch = 9;
}

// PrepareWorkExecutionResponse confirms admission, not readiness or input delivery.
message PrepareWorkExecutionResponse {
  // Retained conversation identity.
  string work_id = 1;
}

// PluginConfiguration carries Agent control data.
message PluginConfiguration {
  // Selected plugin name.
  string name = 1;
  // Explicit typed values for this choice.
  google.protobuf.Struct configuration = 2;
  // Whether this Work includes the plugin; omitted means include.
  optional bool include = 3;
}

// Capabilities carries Agent control data.
message Capabilities {
  // Reusable Agent prompt.
  string prompt = 1;
  // Required logical plugin slugs; no personal parameters.
  repeated string required_plugins = 2;
  // Single startup Agent selected for this capability snapshot.
  string startup_agent = 3;
}

// WorkCapabilities retains the exact selected releases and effective parameters.
message WorkCapabilities {
  // Captured base or overridden prompt.
  string prompt = 1;
  // Resolved immutable plugins.
  repeated SelectedPlugin plugins = 2;
  // Single selected startup Agent.
  string startup_agent = 3;
}

// SelectedPlugin contains one Work binding to a concrete release.
message SelectedPlugin {
  // Immutable catalog content captured at creation.
  talgent.marketplace.public.v1.PluginRelease release = 1;
  // Effective typed values, including used release defaults.
  google.protobuf.Struct configuration = 2;
}

// CapabilityDifferences contains only creation-specific capability choices.
message CapabilityDifferences {
  // Explicit replacement, including an empty string; omission inherits.
  optional string prompt = 1;
  // Explicit per-Work inclusion and typed manual values.
  repeated PluginConfiguration plugins = 2;
  // Explicit startup Agent selection; omission inherits.
  optional string startup_agent = 3;
  // Per-Work Connector additions and removals; personal installations are unchanged.
  repeated ConnectorChoice connectors = 4;
  // Plugins the caller's Work requires beside its definition's, such as the
  // one carrying the role it names; included whatever the per-Work choices
  // say.
  repeated string required_plugins = 5;
}

// ConnectorChoice adds or removes one catalog Connector for this Work only.
message ConnectorChoice {
  // Catalog Connector name.
  string name = 1;
  // True adds the Connector; false removes a default. Required entries stay.
  bool include = 2;
}

// UsageScope declares business-authorized ownership without importing a business aggregate.
message UsageScope {
  // Scope category understood by the authorizing business context.
  string kind = 1;
  // Opaque scope identity.
  string reference = 2;
}

// CreateAgentDefinitionRequest carries Agent control data.
message CreateAgentDefinitionRequest {
  // The people the Agent acts for, its Agent Owners; at least one.
  repeated string owners = 1;
  // Current definition-owned public display name, never an identity.
  string agent_name = 2;
  // Internal business purpose, separate from the Plugin startup Agent.
  string purpose = 3;
  // Reusable capability definition.
  Capabilities capabilities = 4;
  // Usage scope authorized by the calling business context.
  UsageScope usage_scope = 5;
  // One HOME shared by this definition's Sessions.
  HomeBinding home_binding = 6;
  // Visibility of the definition's new Works.
  VisibilityRule visibility_rule = 7;
}

// VisibilityRule declares the visibility of a definition's new Works.
message VisibilityRule {
  // New Works start public within their Project; otherwise private.
  bool public = 1;
}

// CreateAgentDefinitionResponse carries Agent control data.
message CreateAgentDefinitionResponse {
  // Created AgentDefinition identity.
  string agent_id = 1;
}

// HomeBinding selects a caller-authorized persistent home and namespace.
message HomeBinding {
  // Owner of the persistent home; not a filesystem path.
  string owner_id = 1;
  // Caller-selected scope within the home.
  string namespace = 2;
}

// CreateWorkRequest carries Agent control data.
message CreateWorkRequest {
  // Trusted human initiating creation, distinct from the represented owner.
  // Empty for automated starts, which do not load personal Plugin defaults.
  string starting_user_id = 1;
  // Original creation/admission request identity for uncertain-response recovery.
  string request_id = 2;
  // Principal delegated by the authenticated caller.
  string subject_id = 3;
  // AgentDefinition whose capabilities are captured.
  string agent_id = 4;
  // Caller-selected Session Workspace; empty for a Work that has none, such
  // as a project-scoped definition's.
  string workspace_reference = 5;
  // Immutable attribution supplied by the trusted caller; not an authorization credential.
  map<string, string> trace_attributes = 6;
  // Used only when establishing the Session capability snapshot.
  CapabilityDifferences capability_differences = 7;
  // The optional business object the Work is about; an existing Work of the
  // definition for it is returned instead of a new one. Absent, every
  // request identity creates its own Work.
  WorkSubject subject = 8;
  // The Work's optional Project, for visibility and authorization; empty
  // means none.
  string project_id = 9;
  // Optional Model Configuration; absence selects the first provided one.
  talgent.agent.public.v1.WorkModelSelection model = 10;
  // Opaque read-only input reference fixed at creation, such as a caller's
  // File Space; Agent hands it to Storage for every start unchanged. Empty
  // means none. Reuse of an existing Work neither compares nor replaces it.
  string input_source = 11;
  // Space Token issued with the input source; Agent passes it into the
  // sandbox for publication. Empty when there is no input source.
  string input_space_token = 12;
  // Spaces mounted read-only in the sandbox, each under the name the caller
  // gives, fixed at creation; Agent hands each reference to Storage for
  // every start unchanged. Reuse of an existing Work neither compares nor
  // replaces them.
  repeated ReadOnlyMount read_only_mounts = 13;
  // Optional context a new Work starts from: another Work of the same
  // definition up to a position this Agent named. Reuse of an existing Work
  // neither compares nor replaces it.
  WorkStartingContext starting_context = 14;
  // The Computer a new Work runs on for its life: a Cloud or one of the
  // represented person's own Managed Computers; empty runs it on the first
  // Cloud. A Work on a Managed Computer has no read-only mounts. Reuse of an
  // existing Work neither compares nor replaces it.
  string computer_id = 15;
  // The Harness choices of a new Work, admitted only on a Managed Computer.
  // Reuse of an existing Work neither compares nor replaces them.
  talgent.agent.public.v1.HarnessChoice harness = 16;
}

// ReadOnlyMount is an opaque space reference and the name it appears under
// in the sandbox's workspace.
message ReadOnlyMount {
  // One visible directory name of the workspace, other than inputs.
  string name = 1;
  // Opaque reference of the space, as Storage knows it.
  string reference = 2;
}

// WorkStartingContext names another Work of the same definition and a
// position in its context, named by ResolveWorkContextPosition.
message WorkStartingContext {
  // The Work whose context the new Work starts from.
  string source_work_id = 1;
  // Opaque position Agent named for one of the source Work's calls.
  string position = 2;
}

// ResolveWorkContextPositionRequest names one call of one Work.
message ResolveWorkContextPositionRequest {
  // Project the Work belongs to; a Work of another Project is unknown.
  string project_id = 1;
  // The Work that made the call.
  string work_id = 2;
  // Harness identity of the call.
  string call_id = 3;
}

// ResolveWorkContextPositionResponse names where the call returned.
message ResolveWorkContextPositionResponse {
  // False while the call has not returned, or when the Work made no such call.
  bool returned = 1;
  // Opaque position after the call's result; empty unless returned.
  string position = 2;
}

// CreateWorkResponse carries Agent control data.
message CreateWorkResponse {
  // Stable conversation identity.
  string work_id = 1;
}

// DeliverInputRequest carries Agent control data.
message DeliverInputRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
  // Input delivered to the Work's current Harness process.
  string input = 3;
  // Caller delivery UUID, preserved when retrying the same input.
  string input_id = 4;
}

// GetWorkResponse carries Agent control data.
message GetWorkResponse {
  // Persisted Plan/TODO snapshot, independent of messages and execution turns.
  talgent.agent.public.v1.WorkProgress work_progress = 1;
  // Current definition-owned public display name, never an identity.
  string agent_name = 2;
  // The Work's Turn awaits the user's answer; Waiting is not a lifecycle
  // state.
  bool waiting = 3;
  // Admitted stop or normal completion reason.
  string stop_reason = 4;
  // Stable conversation identity.
  string work_id = 5;
  // Associated AgentDefinition.
  string agent_id = 6;
  // Authoritative Session lifecycle state.
  WorkState state = 7;
  // Capability snapshot retained by this Session.
  WorkCapabilities capabilities = 8;
  // The Work's only Harness Session reference.
  string context_reference = 9;
  // Whether a necessary user response remains unaccepted; independent of Work state.
  bool required_response = 10;
  // Recorded execution failure.
  string failure_reason = 11;
  // Monotonic persisted Session revision; consumers reject older observations.
  int64 version = 12;
  // Current stop correlation, retained through confirmed stop completion.
  string stop_request_id = 13;
  // Established workspace retained when the business binding reuses this Session.
  string workspace_reference = 14;
}

// WorkState describes the selected Agent value.
enum WorkState {
  // unspecified.
  WORK_STATE_UNSPECIFIED = 0;
  // starting.
  WORK_STATE_STARTING = 1;
  // The Harness process is ready, whether its Turn progresses, is Waiting
  // (waiting) or nothing is left to process.
  WORK_STATE_WORKING = 2;
  // stopping.
  WORK_STATE_STOPPING = 3;
  // stopped.
  WORK_STATE_STOPPED = 4;
  // failed.
  WORK_STATE_FAILED = 5;
  // closing.
  WORK_STATE_CLOSING = 6;
  // closed.
  WORK_STATE_CLOSED = 7;
}

// ResumeWorkRequest carries Agent control data.
message ResumeWorkRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
  // Caller-selected start request UUID, retained when retrying this operation.
  string request_id = 3;
}

// ResumeWorkResponse carries Agent control data.
message ResumeWorkResponse {
  // Stable conversation identity.
  string work_id = 1;
}

// RestartWorkRequest carries Agent control data.
message RestartWorkRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
  // Caller-selected start request UUID, retained when retrying this operation.
  string request_id = 3;
}

// RestartWorkResponse carries Agent control data.
message RestartWorkResponse {
  // Stable conversation identity.
  string work_id = 1;
}

// StopWorkRequest carries Agent control data.
message StopWorkRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
  // Control request correlation.
  string request_id = 3;
  // When present, apply only to this observed Work version.
  optional int64 expected_version = 4;
}

// StopWorkResponse carries Agent control data.
message StopWorkResponse {}

// CloseWorkRequest asks to close a Work permanently.
message CloseWorkRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
  // Close request correlation, retained through retries.
  string request_id = 3;
  // When present, apply only to this observed Work version.
  optional int64 expected_version = 4;
}

// CloseWorkResponse acknowledges the caller's close request for the Work. A
// close the Work accepted earlier, under another request, is the one that
// applies; the caller's request is acknowledged all the same.
message CloseWorkResponse {
  // Work the close was accepted for.
  string work_id = 1;
  // The caller's close request, acknowledged.
  string request_id = 2;
}

// DeliverInputResponse carries Agent control data.
message DeliverInputResponse {
  // The input settled a while ago under this identity and was not buffered
  // again: a retried delivery whose settlement the caller may have missed.
  bool already_settled = 1;
}

// GetWorkRequest carries Agent control data.
message GetWorkRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
}

// ChangeAgentDefinitionCapabilitiesRequest selects an AgentDefinition and its new reusable configuration.
message ChangeAgentDefinitionCapabilitiesRequest {
  // Existing AgentDefinition identity.
  string agent_id = 1;
  // Configuration captured by subsequently created Sessions.
  Capabilities capabilities = 2;
}

// ChangeAgentDefinitionCapabilitiesResponse confirms the AgentDefinition configuration was saved.
message ChangeAgentDefinitionCapabilitiesResponse {}

// GetAgentDefinitionRequest selects a reusable AgentDefinition.
message GetAgentDefinitionRequest {
  // Existing AgentDefinition identity.
  string agent_id = 1;
}

// GetAgentDefinitionResponse describes the definition.
message GetAgentDefinitionResponse {
  // The Agent Owners of every Work of the definition.
  repeated string owners = 1;
  // Current definition-owned public display name, never an identity.
  string agent_name = 2;
  // Internal business purpose within the usage scope.
  string purpose = 3;
  // Existing AgentDefinition identity.
  string agent_id = 4;
  // Current reusable configuration.
  Capabilities capabilities = 5;
  // Declared business-authorized scope.
  UsageScope usage_scope = 6;
  // Definition-owned HOME reference.
  HomeBinding home_binding = 7;
  // Visibility declared for the definition's new Works.
  VisibilityRule visibility_rule = 8;
}

// RespondToInteractionRequest answers a required interaction in a Session.
message RespondToInteractionRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Stable conversation identity.
  string work_id = 2;
  // Native interaction identity supplied by current execution facts.
  string interaction_id = 3;
  // Whether the requested operation is allowed.
  bool allow = 4;
  // Whether the native runtime may remember this permission choice.
  bool always_allow = 5;
  // Caller explanation of the decision.
  string reason = 6;
  // Native updated tool input, including question answers where required.
  string updated_input_json = 7;
}

// RespondToInteractionResponse confirms response delivery, not interaction resolution.
message RespondToInteractionResponse {}

// GetStartAdmissionRequest identifies the caller and its start request.
message GetStartAdmissionRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Work whose start request is being inspected.
  string work_id = 2;
  // Caller-selected start request identity.
  string request_id = 3;
}

// GetStartAdmissionResponse is independent of the Work's current lifecycle.
message GetStartAdmissionResponse {
  // True only when this start request was admitted for this Work.
  bool accepted = 1;
  // Admitted operation, or unspecified when no admission was found.
  StartKind kind = 2;
}

// StartKind distinguishes first start from explicit continuation or failure retry.
enum StartKind {
  // No admitted start was found.
  START_KIND_UNSPECIFIED = 0;
  // First Work start.
  START_KIND_START = 1;
  // Continuation of the retained Harness Session after a normal stop.
  START_KIND_RESUME = 2;
  // Explicit retry after failure.
  START_KIND_RESTART = 3;
}

// VerifyWorkCredentialRequest carries the native process credential, not caller-declared product authority.
message VerifyWorkCredentialRequest {
  // Work whose current live sandbox holds the credential.
  string work_id = 1;
  // Credential issued to the Work's current sandbox and revoked with it.
  string credential = 2;
  // Admits the credential only while its Work acts: Working, and not awaiting
  // its person's required response. Agent waits briefly for a delivered reply
  // to resolve, then refuses with FAILED_PRECONDITION. A caller admitting the
  // Work's actions sets it; one admitting reads does not.
  bool require_acting = 3;
}

// VerifyWorkCredentialResponse reports verified Work facts to an authenticated integration.
// The consumer must separately authorize its own product operations and scope.
message VerifyWorkCredentialResponse {
  // Current definition-owned public display name, never an identity.
  string agent_name = 1;
  // Verified stable conversation.
  string work_id = 2;
  // AgentDefinition whose capability snapshot this Work uses.
  string agent_id = 3;
  // Immutable controlling principal registered by the Work caller.
  string subject_id = 4;
  // Caller-authorized opaque workspace binding; not product authority by itself.
  string workspace_reference = 5;
  // The Work's Project; empty for a Work without one.
  string project_id = 6;
  // The Work's Subject, absent for a Work without one.
  WorkSubject subject = 7;
  // The definition's purpose.
  string purpose = 8;
}

// LocateWorkRequest selects an existing association under its retained rules.
message LocateWorkRequest {
  // Principal delegated by the authenticated business caller.
  string subject_id = 1;
  // Definition within which to locate the Work.
  string agent_id = 2;
  // The Subject; capabilities are not lookup keys.
  WorkSubject subject = 3;
}

// LocateWorkResponse reports an existing conversation without execution admission.
message LocateWorkResponse {
  // True when this definition has an existing matching Session.
  bool found = 1;
  // Existing stable identity; empty when no binding exists.
  string work_id = 2;
}

// EndWorkExecutionRequest ends the Work's admitted Harness process or prevents a pending start's admission.
message EndWorkExecutionRequest {
  // Principal delegated by the authenticated caller.
  string subject_id = 1;
  // Persistent conversation identity.
  string work_id = 2;
  // Caller's start request; a not-yet-admitted request is canceled instead of admitted.
  string start_request_id = 3;
  // Stable control request correlation.
  string request_id = 4;
}

// EndWorkExecutionResponse acknowledges the retained request, not physical completion.
message EndWorkExecutionResponse {}

// GetAgentDefinitionForPurposeRequest is available only to authenticated internal callers.
message GetAgentDefinitionForPurposeRequest {
  // Business-authorized employee or Project scope.
  UsageScope usage_scope = 1;
  // Purpose chosen by the calling business flow, not a public definition selector.
  string purpose = 2;
}

// GetAgentDefinitionForPurposeResponse contains the stable internal definition reference.
message GetAgentDefinitionForPurposeResponse {
  // Existing AgentDefinition identity.
  string agent_id = 1;
}

// ResolveEmployeeAgentsRequest is available only to authenticated internal callers.
message ResolveEmployeeAgentsRequest {
  // Employees whose work Agents are read, at most 200.
  repeated string employee_ids = 1;
  // Purpose of the employee-scoped definition the caller uses as their work Agent.
  string purpose = 2;
}

// ResolvedEmployeeAgent is one employee's work Agent, or the fact that none exists.
message ResolvedEmployeeAgent {
  // Employee echoes the requested employee.
  string employee_id = 1;
  // Known is false when the employee has no work Agent yet.
  bool known = 2;
  // AgentDefinition of the work Agent.
  string agent_id = 3;
  // Current appearance.
  talgent.agent.public.v1.AgentAppearance appearance = 4;
}

// ResolveEmployeeAgentsResponse returns one result per requested employee, in order.
message ResolveEmployeeAgentsResponse {
  // Agents are the resolution results.
  repeated ResolvedEmployeeAgent agents = 1;
}

// GetEmployeeAgentRequest is available only to authenticated internal callers.
message GetEmployeeAgentRequest {
  // Employee whose work Agent is read.
  string employee_id = 1;
  // Employee's display name, which names a work Agent that does not exist yet.
  string employee_display_name = 2;
  // Purpose of the employee-scoped definition the caller uses as their work Agent.
  string purpose = 3;
}

// GetEmployeeAgentResponse is the employee's work Agent, or its default appearance.
message GetEmployeeAgentResponse {
  // AgentDefinition of the work Agent; empty when the employee has none yet.
  string agent_id = 1;
  // Current appearance, or the one the work Agent would be established with.
  talgent.agent.public.v1.AgentAppearance appearance = 2;
}

// ResolveWorkAgentsRequest is available only to authenticated internal callers.
message ResolveWorkAgentsRequest {
  // Works whose Agents are read, at most 200.
  repeated string work_ids = 1;
}

// ResolvedWorkAgent is one Work's Agent appearance, or the fact that the Work is unknown.
message ResolvedWorkAgent {
  // Work echoes the requested Work.
  string work_id = 1;
  // Known is false when no Work exists under the ID.
  bool known = 2;
  // Current appearance of the Work's AgentDefinition.
  talgent.agent.public.v1.AgentAppearance appearance = 3;
}

// ResolveWorkAgentsResponse returns one result per requested Work, in order.
message ResolveWorkAgentsResponse {
  // Agents are the resolution results.
  repeated ResolvedWorkAgent agents = 1;
}

// GetWorkPreparationRequest selects preparation for an authorized conversation.
message GetWorkPreparationRequest {
  // Delegated principal.
  string subject_id = 1;
  // Conversation identity.
  string work_id = 2;
}

// GetWorkPreparationResponse reports whether a generic initial input exists.
message GetWorkPreparationResponse {
  // Retained preparation; absent for conversations without generic preparation.
  WorkPreparation preparation = 1;
}

// ListSubmittedPreparationsRequest pages through admitted application requests.
message ListSubmittedPreparationsRequest {
  // Exclusive Session identity cursor.
  string after_work_id = 1;
}

// ListSubmittedPreparationsResponse contains at most 100 admitted requests.
message ListSubmittedPreparationsResponse {
  // Stable application facts for recovery of business projections.
  repeated WorkPreparation preparations = 1;
}

// WorkPreparation is a view, not Session message history or a new Aggregate.
message WorkPreparation {
  // Conversation identity.
  string work_id = 1;
  // Original startup request identity.
  string request_id = 2;
  // Persisted authorized principal.
  string subject_id = 3;
  // Original delivery identity.
  string input_id = 4;
  // Original first input.
  string input = 5;
  // Execution admission was confirmed.
  bool submitted = 6;
  // Input files and checkouts were prepared.
  bool input_prepared = 7;
  // The first input was accepted into the Work's input buffer.
  bool input_buffered = 8;
  // This request was definitively rejected.
  bool rejected = 9;
  // Frozen repository preparation facts.
  repeated PreparedCheckout checkouts = 10;
  // Branch the caller named for repository checkouts.
  string work_branch = 11;
}

// PreparedCheckout describes a fixed checkout plan retained by Agent.
message PreparedCheckout {
  // Repository provider.
  string provider = 1;
  // Provider repository identity.
  string repo_id = 2;
  // Repository display name.
  string repo_name = 3;
  // Credential-free clone URL.
  string clone_url = 4;
  // Repository browser URL.
  string web_url = 5;
  // Default repository branch.
  string default_branch = 6;
  // Original base branch.
  string base_branch = 7;
  // Task branch.
  string work_branch = 8;
  // Native workspace target path.
  string target_path = 9;
  // Opaque access reference scoped to this Work checkout; contains no credential.
  string credential_grant_id = 10;
}

// ResolveWorkStartsRequest asks for the start of Works within one Project.
message ResolveWorkStartsRequest {
  // Project whose Works may be resolved; Works of other Projects are unknown.
  string project_id = 1;
  // Works to resolve, at most 200.
  repeated string work_ids = 2;
}

// ResolvedWorkStart is one Work's start, or the fact that it is unknown.
message ResolvedWorkStart {
  // Work echoes the requested Work.
  string work_id = 1;
  // Known is false when no Work of the Project exists under the ID.
  bool known = 2;
  // Started by is who started the Work, a fact; its Agent Owners are its
  // definition's Owners.
  string started_by = 3;
  // Started at is when the Work was created, in Unix milliseconds.
  int64 started_at_unix_ms = 4;
}

// ResolveWorkStartsResponse returns one result per requested Work, in order.
message ResolveWorkStartsResponse {
  // Works are the resolution results.
  repeated ResolvedWorkStart works = 1;
}

// GetWorkOriginRequest addresses a conversation independently of execution state.
message GetWorkOriginRequest {
  // Producing AgentWork identity.
  string work_id = 1;
}

// GetWorkOriginResponse contains authoritative source facts, not product permission.
message GetWorkOriginResponse {
  // Producing AgentWork identity.
  string work_id = 1;
  // Definition owning this conversation.
  string agent_id = 2;
  // Definition purpose.
  string purpose = 3;
  // The one business object the Work is about.
  WorkSubject subject = 4;
  // The Work's Project.
  string project_id = 5;
}

// GetWorkStartupRequest selects an authorized conversation's startup facts.
message GetWorkStartupRequest {
  // Principal delegated by the authenticated internal consumer.
  string subject_id = 1;
  // Existing conversation identity.
  string work_id = 2;
}

// GetWorkStartupResponse contains request facts, not an archive decision.
message GetWorkStartupResponse {
  // Existing conversation identity.
  string work_id = 1;
  // Current initial-input request; empty when no such record exists.
  string initial_request_id = 2;
  // The initial-input request was definitively rejected.
  bool rejected = 3;
  // Its preparation resources have been released.
  bool cleanup_confirmed = 4;
  // A creation or retry request for this Work still awaits handoff or cleanup.
  // This can be true while the preceding initial request is rejected and clean.
  bool creation_pending = 5;
  // Retained explicit Resume request, when present.
  string continuation_request_id = 6;
  // Its admission outcome is still unconfirmed.
  bool continuation_pending = 7;
}

// EnsureAgentDefinitionRequest is accepted only from authenticated internal callers.
message EnsureAgentDefinitionRequest {
  // The Agent Owners a new definition starts with: the person for a person's
  // Agent, the Project's Owner for a project-scoped definition. An existing
  // definition keeps its Owners; TransferAgentDefinitionOwners changes them.
  repeated string owners = 1;
  // Business owner of the reusable definition.
  UsageScope usage_scope = 2;
  // Opaque business purpose selected by the caller.
  string purpose = 3;
  // Authoritative employee display name; required for employee work.
  string employee_display_name = 4;
  // Initial HOME supplied by the owning business caller.
  HomeBinding home_binding = 5;
  // Caller-selected base capabilities; existing definitions retain their values.
  Capabilities capabilities = 6;
  // Initial public name for a non-employee definition, if supplied.
  string agent_name = 7;
  // Visibility of a new definition's Works; existing definitions retain theirs.
  VisibilityRule visibility_rule = 8;
}

// EnsureEmployeeAgentRequest names the person.
message EnsureEmployeeAgentRequest {
  // The person the definition represents and is owned by.
  string employee_id = 1;
  // The person's display name, which a new definition is named after.
  string employee_display_name = 2;
}

// EnsureEmployeeAgentResponse identifies the person's employee definition.
message EnsureEmployeeAgentResponse {
  // Stable definition identity.
  string agent_id = 1;
  // Current public display name.
  string agent_name = 2;
  // Current icon.
  talgent.agent.public.v1.AgentIcon agent_icon = 3;
}

// EnsureAgentDefinitionResponse identifies the existing or initialized definition.
message EnsureAgentDefinitionResponse {
  // The definition's current Agent Owners.
  repeated string owners = 1;
  // Stable definition identity.
  string agent_id = 2;
  // Current public display name.
  string agent_name = 3;
  // Current icon.
  talgent.agent.public.v1.AgentIcon agent_icon = 4;
}

// GetWorkStartOptionsRequest never chooses a caller's role or represented human.
message GetWorkStartOptionsRequest {
  // Authorized controlling principal when reading a retained Work.
  string subject_id = 1;
  // Optional existing Work whose captured capabilities take precedence.
  string work_id = 2;
  // The person whose employee definition a new Work starts under; its
  // product defaults apply while it does not exist. This query never creates
  // one.
  string employee_id = 3;
  // Plugins a new Work of the caller requires beside the definition's,
  // offered as required; ignored for an existing Work.
  repeated string required_plugins = 4;
}

// ListWorkStartRepositoriesRequest names the owner the trusted business caller
// admitted to choose repositories for a new Work.
message ListWorkStartRepositoriesRequest {
  // The person whose personal Provider authorization is discovered.
  string repository_owner_id = 1;
}

// CancelWorkRegistrationRequest retains the original caller-authorized creation scope.
message CancelWorkRegistrationRequest {
  // Original CreateWork request UUID; not a new cancellation identity.
  string request_id = 1;
  // Principal delegated by the authenticated business caller.
  string subject_id = 2;
  // Original definition selected by the business caller.
  string agent_id = 3;
  // Original Subject.
  WorkSubject subject = 4;
  // Original Project.
  string project_id = 5;
  // Original caller-selected workspace reference.
  string workspace_reference = 6;
}

// CancelWorkRegistrationResponse reports which side of initial admission committed.
message CancelWorkRegistrationResponse {
  // Already admitted Work; empty means the original creation is durably canceled.
  // A returned Work still needs EndWorkExecution to retain its cleanup obligation.
  string work_id = 1;
}

// GetWorkCreationRequest names a creation request identity.
message GetWorkCreationRequest {
  // The caller's creation request identity.
  string request_id = 1;
}

// WorkCreationOutcome is a creation request identity's answer so far.
enum WorkCreationOutcome {
  // Unspecified.
  WORK_CREATION_OUTCOME_UNSPECIFIED = 0;
  // Agent never received the identity.
  WORK_CREATION_OUTCOME_UNKNOWN = 1;
  // Received and not yet answered; Agent's own recovery advances it.
  WORK_CREATION_OUTCOME_PENDING = 2;
  // The identity created or reused work_id.
  WORK_CREATION_OUTCOME_CREATED = 3;
  // The identity was refused or cancelled and creates nothing.
  WORK_CREATION_OUTCOME_CANCELLED = 4;
}

// GetWorkCreationResponse reports the identity's outcome.
message GetWorkCreationResponse {
  // The outcome so far.
  WorkCreationOutcome outcome = 1;
  // The Work, for CREATED.
  string work_id = 2;
}

// CancelWorkCreationRequest names the identity to settle.
message CancelWorkCreationRequest {
  // The caller's creation request identity.
  string request_id = 1;
}

// CancelWorkCreationResponse reports how the identity settled.
message CancelWorkCreationResponse {
  // The Work the identity already created; empty means it is cancelled.
  string work_id = 1;
}

// TransferAgentDefinitionOwnersRequest names the definition and its new Owners.
message TransferAgentDefinitionOwnersRequest {
  // The definition.
  string agent_id = 1;
  // The new Agent Owners; at least one.
  repeated string owners = 2;
}

// TransferAgentDefinitionOwnersResponse reports whether the Owners changed.
message TransferAgentDefinitionOwnersResponse {
  // False when the definition already had these Owners.
  bool changed = 1;
}

syntax = "proto3";

package talgent.agent.private.v1;

import "google/protobuf/timestamp.proto";
import "talgent/agent/public/v1/progress.proto";
import "talgent/agent/public/v1/subagents.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/private/v1;agentprivatev1";

// ExecutionFeedbackService receives trusted Harness feedback. Feedback is a hint,
// not a fact attributed to one process run; exit and failure only prompt reconciliation.
service ExecutionFeedbackService {
  // Report applies one feedback item to its Work.
  rpc Report(ReportRequest) returns (ReportResponse);
  // ConnectionEnded reports that Dispatcher's connection to a Work's still
  // running Harness process ended without a process exit, or that Dispatcher
  // lost the connection's ownership. It changes no Work state; Agent decides
  // whether and when to connect again.
  rpc ConnectionEnded(ConnectionEndedRequest) returns (ConnectionEndedResponse);
}

// ConnectionEndedRequest identifies the ended connection.
message ConnectionEndedRequest {
  // Work whose Harness process connection ended.
  string work_id = 1;
  // Process handle the connection was attached to, for diagnosis.
  string process_id = 2;
}

// ConnectionEndedResponse acknowledges that reconnection was scheduled.
message ConnectionEndedResponse {}

// ReportRequest carries one feedback item for a Work.
message ReportRequest {
  // Work whose Harness process produced the feedback.
  string work_id = 1;
  // Feedback delivered by the execution integration.
  FeedbackKind kind = 2;
  // Required user interaction or its matching resolution.
  string interaction_id = 3;
  // Position in the Harness process's Harness Output Stream; feedback at a
  // position not after the last applied one for that process changes nothing.
  int64 observation_sequence = 4;
  // True only for a normal turn result, not interruption or failure.
  bool turn_completed = 5;
  // For INPUT_SETTLED: the identity of the settled input, or of the
  // interaction a settled reply answered.
  string input_id = 6;
  // Complete normalized Plan/TODO snapshot for WORK_PROGRESS_UPDATED.
  repeated talgent.agent.public.v1.WorkProgressItem work_progress = 7;
  // Necessary requests still pending in this ordered Harness snapshot; Agent
  // reads which have a buffered reply from the Work's input buffer.
  repeated string required_interaction_ids = 8;
  // Complete actual Harness plugin inventory for PLUGIN_LOADS_OBSERVED.
  repeated LoadedPlugin loaded_plugins = 9;
  // The execd handle of the Harness process the feedback is about; feedback
  // about another process than the Work's current one changes nothing.
  string process_id = 10;
  // For EXITED: the process's exit code.
  int32 exit_code = 11;
  // For EXITED: a native diagnostic Dispatcher observed, such as a rejected
  // initialization; empty otherwise. Whether the exit was normal is Agent's
  // decision.
  string exit_reason = 12;
  // For INPUT_SETTLED: how the buffered entry settled.
  InputOutcome input_outcome = 13;
  // Complete SubAgents snapshot of the process for SUBAGENTS_UPDATED, in
  // delegation order.
  repeated talgent.agent.public.v1.SubAgent subagents = 14;
  // For PERMISSION_MODE_OBSERVED: the native permission mode the process
  // reports it now applies, such as plan or acceptEdits.
  string permission_mode = 15;
  // For ATTACHMENT_LOST and ATTACHMENT_RETURNED: when Dispatcher lost its
  // attachment to the process's sandbox, the origin of the Disconnection the
  // fact reports or ends. Repeated reports of one loss carry the same origin.
  google.protobuf.Timestamp detached_since = 16;
}

// InputOutcome is how a buffered input or reply left the Work's input buffer.
enum InputOutcome {
  // No outcome selected.
  INPUT_OUTCOME_UNSPECIFIED = 0;
  // The Harness finished processing the input, or resolved the replied interaction.
  INPUT_OUTCOME_COMPLETED = 1;
  // The replied interaction no longer exists.
  INPUT_OUTCOME_CLOSED = 2;
  // The Harness process exited before finishing the written input.
  INPUT_OUTCOME_ABANDONED = 3;
}

// LoadedPlugin is a native loading fact, excluding paths and configuration.
message LoadedPlugin {
  // Native plugin name matching the selected logical slug.
  string slug = 1;
  // Native reported release version.
  string version = 2;
}

// ReportResponse confirms application of the observation, not business completion.
message ReportResponse {}

// FeedbackKind describes a fact, never a control request's acceptance.
enum FeedbackKind {
  // No observation selected.
  FEEDBACK_KIND_UNSPECIFIED = 0;
  // Executor preparation completed.
  FEEDBACK_KIND_PREPARED = 1;
  // Agent runtime started.
  FEEDBACK_KIND_STARTED = 2;
  // Execution needs user participation.
  FEEDBACK_KIND_USER_INTERACTION_REQUIRED = 3;
  // The identified user interaction was resolved.
  FEEDBACK_KIND_USER_INTERACTION_RESOLVED = 4;
  // The Harness process exited: an exit fact, acknowledged by a successful
  // response and redelivered until then.
  FEEDBACK_KIND_EXITED = 5;
  // The corresponding compute resources were removed.
  FEEDBACK_KIND_COMPUTE_RECLAIMED = 6;
  // The runtime has begun processing a turn, not merely accepted input.
  FEEDBACK_KIND_TURN_STARTED = 7;
  // A turn ended; turn_completed distinguishes normal completion.
  FEEDBACK_KIND_TURN_FINISHED = 8;
  // A buffered input or reply settled and left the Work's input buffer, even
  // when inputs shared a turn.
  FEEDBACK_KIND_INPUT_SETTLED = 9;
  // A new complete Plan/TODO snapshot was observed.
  FEEDBACK_KIND_WORK_PROGRESS_UPDATED = 10;
  // A complete actual Harness plugin inventory was observed, including an empty one.
  FEEDBACK_KIND_PLUGIN_LOADS_OBSERVED = 11;
  // The Work's Turn progresses in its Harness Output Stream; reported at most
  // once a minute while it does, carrying nothing but the Work.
  FEEDBACK_KIND_TURN_ACTIVITY = 12;
  // A new complete SubAgents snapshot of the process was observed.
  FEEDBACK_KIND_SUBAGENTS_UPDATED = 13;
  // The process reported the permission mode it now applies: at its start,
  // after accepting a change, or after changing it itself, such as leaving
  // plan mode once its plan was approved.
  FEEDBACK_KIND_PERMISSION_MODE_OBSERVED = 14;
  // Dispatcher lost its attachment to the process's sandbox and an attempt
  // to attach again failed; detached_since is when it was lost. A
  // Disconnection is a fact beside the Work's state, never a state.
  FEEDBACK_KIND_ATTACHMENT_LOST = 15;
  // Dispatcher attached again to the process's sandbox after the loss
  // reported with the same detached_since.
  FEEDBACK_KIND_ATTACHMENT_RETURNED = 16;
}

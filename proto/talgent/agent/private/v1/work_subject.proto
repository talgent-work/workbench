syntax = "proto3";

package talgent.agent.private.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/private/v1;agentprivatev1";

// WorkSubject is the optional business object a Work is about, by a kind its
// caller defines and an identity. Within one AgentDefinition a Subject has at
// most one Work for good, a closed Work included; Agent interprets no Subject.
// Absent means none.
message WorkSubject {
  // Kind of the object, as the caller defines it, at most 32 characters.
  string kind = 1;
  // Identity of the object.
  string id = 2;
}

syntax = "proto3";

package talgent.agent.task.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/task/v1;agenttaskv1";

// ReconcileAllocationTask asks Agent to reconcile one execution environment
// allocation against its durable record and the environment authority.
message ReconcileAllocationTask {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// PrepareAllocationTask asks Agent to see one allocation's environment
// preparation through to its exit, then start the Harness and connect it.
message PrepareAllocationTask {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// ReconnectAllocationTask asks Agent to hand one allocation's running Harness
// process to Dispatcher again, without preparing its environment.
message ReconnectAllocationTask {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// DeliverCredentialsTask asks Agent to replace one allocation's delivered
// credentials with those Marketplace supplies now.
message DeliverCredentialsTask {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// SyncInputsTask asks Agent to hand one Managed allocation's machine the
// current inputs of its Work.
message SyncInputsTask {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// ObserveSandboxTask asks Agent to check one allocation against its sandboxes
// after the environment authority reported a change to them.
message ObserveSandboxTask {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// RecoverWorkTask asks Agent to advance one Work's retained execution,
// input and workspace obligations.
message RecoverWorkTask {
  // AgentWork identity.
  string work_id = 1;
}

// RecoverContinuationTask asks Agent to settle one Work's pending continuation
// request after admission uncertainty.
message RecoverContinuationTask {
  // AgentWork identity owning the continuation request.
  string work_id = 1;
}

// RecoverWorkCreationTask asks Agent to settle one retained Work creation
// request after admission uncertainty.
message RecoverWorkCreationTask {
  // Original Work creation request identity.
  string request_id = 1;
}

// PrepareInitialExecutionTask asks Agent to prepare and deliver one Work's
// initial execution under its Startup Deadline.
message PrepareInitialExecutionTask {
  // AgentWork identity owning the initial execution request.
  string work_id = 1;
}

// SweepRecoveryTask is the periodic fallback that wakes every unfinished
// recovery obligation. It carries no data.
message SweepRecoveryTask {}

// RequestWorkspaceReclamationTask delivers a Closed Work's one Workspace
// Reclamation Request to Storage, retried until Storage accepts it.
message RequestWorkspaceReclamationTask {
  // AgentWork identity whose Session Workspace is reclaimed.
  string work_id = 1;
  // The Work's opaque Session Workspace reference.
  string workspace_reference = 2;
}

syntax = "proto3";

package talgent.agent.public.v1;

import "talgent/agent/public/v1/model.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// GetWorkStartOptionsResponse reports actual configured model capabilities.
message GetWorkStartOptionsResponse {
  // Provided Model Configurations in platform order; the first is the default.
  repeated WorkModelOption models = 1;
  // Native Plugin packages available to this Work, including inherited capabilities.
  repeated WorkStartPlugin plugins = 2;
  // Inherited native startup role; empty lets the Harness select its default.
  string default_startup_agent = 3;
  // Offered Connectors this Work may include, marked as Agent composes the
  // default selection; per-Work choices are differences from it.
  repeated WorkStartConnector connectors = 4;
}

// WorkStartRepositories are the repositories a startup may check out.
message WorkStartRepositories {
  // Repositories currently reachable under the represented human's authorization, by name.
  repeated WorkStartRepository repositories = 1;
  // Discovery failed; startup without repository selections remains possible.
  bool repositories_unavailable = 2;
  // Up to five repositories from the owner's own earlier Works, most recent
  // first, limited to those still reachable.
  repeated string recent_repository_ids = 3;
}

// WorkStartConnector is one selectable catalog Connector for this startup.
message WorkStartConnector {
  // Catalog name used in creation Connector choices.
  string name = 1;
  // Always included and cannot be removed for this Work.
  bool required = 2;
  // Included when this Work makes no choice for it.
  bool included_by_default = 3;
  // Not available to a Work on a Managed Computer, whose Work leaves it out
  // even when required or chosen: its Provider credential stays with the
  // platform.
  bool unavailable_on_managed = 4;
}

// WorkStartRepository is a repository reachable for this startup context.
message WorkStartRepository {
  // External repository identity submitted at creation.
  string id = 1;
  // Supported external service.
  string provider = 2;
  // Human-readable repository name.
  string repo_name = 3;
  // Provider default branch.
  string default_branch = 4;
}

// WorkStartPlugin describes an available runtime package, not a business Agent.
message WorkStartPlugin {
  // Stable Plugin identity used in creation capabilities.
  string name = 1;
  // Human-readable package name.
  string display_name = 2;
  // Marketplace category.
  string category = 3;
  // Package summary.
  string description = 4;
  // Whether the Work inherits this package and cannot remove it at creation.
  bool required = 5;
  // Plugin-declared startup roles.
  repeated WorkStartCapability agents = 6;
  // Native callable skills and commands.
  repeated WorkStartCapability skills = 7;
}

// WorkStartCapability names a native capability from its installed package.
message WorkStartCapability {
  // Qualified native name, including the Plugin namespace.
  string name = 1;
  // Description supplied by the package.
  string description = 2;
  // Native argument guidance for completion; empty when not declared.
  string argument_hint = 3;
}

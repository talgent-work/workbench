syntax = "proto3";

package talgent.agent.public.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// WorkProgress is the latest Plan/TODO snapshot recorded by its AgentWork.
message WorkProgress {
  // Complete current plan; an empty list explicitly clears the previous plan.
  repeated WorkProgressItem items = 1;
  // Time the owning Work recorded this snapshot.
  google.protobuf.Timestamp updated_at = 2;
}

// WorkProgressItem is one plan entry, without an independent lifecycle.
message WorkProgressItem {
  // Task description.
  string content = 1;
  // One of pending, in_progress or completed.
  string status = 2;
  // Harness-provided description of the task while active.
  string active_form = 3;
}

syntax = "proto3";

package talgent.agent.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// GetWorkServiceAccessRequest identifies an authorized Work.
message GetWorkServiceAccessRequest {
  // Stable Work identity within the caller's authorized read scope.
  string work_id = 1;
}

// GetWorkServiceAccessResponse separates retained selection from the latest
// supply observations. It contains no credentials or external account details.
message GetWorkServiceAccessResponse {
  // Owner of the personal authorization selection, never inferred from viewer.
  string owner_user_id = 1;
  // Fixed at creation; later personal authorizations are not added to this list.
  repeated string selected_services = 2;
  // Empty before observation. Stopped Works retain their last observations;
  // these are not a live connection check or proof of successful authentication.
  repeated WorkServiceAccessObservation observations = 3;
  // Durable initial checkout results, independent of current token availability.
  repeated WorkRepositoryPreparation repositories = 4;
}

// WorkRepositoryPreparation describes actual initial workspace preparation.
message WorkRepositoryPreparation {
  // External repository identity retained by this Work.
  string repository_id = 1;
  // Planned native checkout path within the Work workspace.
  string target_path = 2;
  // True when the checkout was prepared, not merely when a token was available.
  bool prepared = 3;
  // Safe preparation failure code, empty after successful preparation.
  string reason = 4;
}

// WorkServiceAccessObservation describes one concrete consumer and safe outcome.
message WorkServiceAccessObservation {
  // Supported external service, when recognized.
  string service = 1;
  // Supported credential destination contract, when recognized.
  string target = 2;
  // Declaring Plugin slug; empty for independent CLI access.
  string plugin = 3;
  // Native MCP declaration name; empty for independent CLI access.
  string mcp = 4;
  // pending, credential_available, unavailable or authentication_not_declared.
  string status = 5;
  // A bounded diagnostic code, never a raw provider response.
  string reason = 6;
}

syntax = "proto3";

package talgent.agent.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// PermissionMode is a Work's Harness permission mode on a Managed Computer:
// how much the Harness asks its person before it acts. A Cloud Work always
// bypasses permission prompts and has none.
enum PermissionMode {
  // Not chosen: a start on a Managed Computer bypasses permission prompts; a
  // Cloud Work has no permission mode.
  PERMISSION_MODE_UNSPECIFIED = 0;
  // The Harness asks before every action its rules do not already allow.
  PERMISSION_MODE_ASK = 1;
  // The Harness edits files without asking and asks before other actions.
  PERMISSION_MODE_ACCEPT_EDITS = 2;
  // The Harness plans without changing anything until its plan is approved.
  PERMISSION_MODE_PLAN = 3;
  // The Harness acts without asking.
  PERMISSION_MODE_BYPASS_PERMISSIONS = 4;
  // The Harness denies whatever its rules do not already allow, without
  // asking. Reported by the Harness; not offered for choosing.
  PERMISSION_MODE_DONT_ASK = 5;
  // The Harness decides by its own classifier whether an action needs asking.
  // Reported by the Harness; not offered for choosing.
  PERMISSION_MODE_AUTO = 6;
}

// HarnessChoice is what the person starting a Work on a Managed Computer
// chooses for its Harness. A start on a Cloud chooses nothing.
message HarnessChoice {
  // The Harness permission mode; unspecified bypasses permission prompts.
  PermissionMode permission_mode = 1;
  // Run the Work in Claude Code's sandbox, for its life. A Computer that
  // cannot provide it rejects the start.
  bool sandbox = 2;
}

// SandboxUnavailable is the error detail of a start refused because the
// chosen Computer cannot provide Claude Code's sandbox the start asks for.
message SandboxUnavailable {}

// ComputerOutdated is the error detail of a start refused because the chosen
// Managed Computer runs a Talgent Computer below the Minimum Version.
message ComputerOutdated {}

syntax = "proto3";

package talgent.agent.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// AgentIcon is one preset glyph in one preset color.
message AgentIcon {
  // Preset glyph id: bot, sparkles, brain, rocket, wand, cat, bird, leaf,
  // flame, star, compass or atom.
  string glyph = 1;
  // Preset color id: slate, blue, violet, green, amber or rose.
  string color = 2;
}

// AgentAppearance is how an Agent is shown wherever it appears.
message AgentAppearance {
  // Current public display name.
  string name = 1;
  // Current icon.
  AgentIcon icon = 2;
}

// ChangeWorkAgentAppearanceRequest changes the caller's own Work Agent.
message ChangeWorkAgentAppearanceRequest {
  // AgentDefinition of the Work Agent representing the caller.
  string agent_id = 1;
  // New name, 1 to 40 characters.
  string name = 2;
  // New preset icon.
  AgentIcon icon = 3;
}

// ChangeWorkAgentAppearanceResponse returns the appearance now shown.
message ChangeWorkAgentAppearanceResponse {
  // Current appearance.
  AgentAppearance appearance = 1;
}

// GetMyWorkAgentRequest reads the caller's own Work Agent.
message GetMyWorkAgentRequest {}

// GetMyWorkAgentResponse is the caller's Work Agent, or the appearance it
// would start with when the caller has none yet.
message GetMyWorkAgentResponse {
  // AgentDefinition of the Work Agent; empty when the caller has none yet.
  string agent_id = 1;
  // Current appearance, or the one it would be established with.
  AgentAppearance appearance = 2;
}

// EnsureMyWorkAgentRequest establishes the caller's own Work Agent.
message EnsureMyWorkAgentRequest {}

// EnsureMyWorkAgentResponse is the caller's Work Agent.
message EnsureMyWorkAgentResponse {
  // AgentDefinition of the Work Agent.
  string agent_id = 1;
  // Current appearance.
  AgentAppearance appearance = 2;
}

syntax = "proto3";

package talgent.agent.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// GetWorkCapabilitiesRequest addresses the Work's current Harness.
message GetWorkCapabilitiesRequest {
  // Work whose actual callable candidates are requested.
  string work_id = 1;
}

// GetWorkCapabilitiesResponse is the latest complete Harness report.
// Poll again to receive native command and Skill additions, changes or removals.
// This query never resolves Plugin releases or reloads Plugins.
message GetWorkCapabilitiesResponse {
  // Whether the current Harness has reported its candidates, including an empty list.
  bool observed = 1;
  // Native commands and user-callable Skills, without an inferred category.
  repeated WorkCommand commands = 2;
}

// WorkCommand is a candidate actually reported by the Work's Harness.
message WorkCommand {
  // Native invocation name without the leading slash; preserves namespaces.
  string name = 1;
  // Native description for completion.
  string description = 2;
  // Native argument guidance; empty when none was supplied.
  string argument_hint = 3;
}

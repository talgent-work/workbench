syntax = "proto3";

package talgent.agent.public.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/agent/public/v1;agentpublicv1";

// StartupProgress presents committed preparation facts, never a second lifecycle.
message StartupProgress {
  // Retained startup or continuation request, including before execution admission.
  string request_id = 1;
  // True once the start request has been admitted.
  bool admitted = 2;
  // Lexically ordered source version vector within this AgentWork.
  string revision = 3;
  // preparing, recovering, completed, failed or cancelled.
  string status = 4;
  // Safe explanation of a definitive failure, when present.
  string reason = 5;
  // Only stages applicable to this startup or continuation.
  repeated StartupStage stages = 6;
}

// StartupStage reports one preparation boundary.
message StartupStage {
  // admission, sandbox, agent, workspace or input.
  string stage = 1;
  // pending, active, completed, failed or cancelled.
  string status = 2;
}

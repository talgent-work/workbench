syntax = "proto3";

package talgent.dispatcher.public.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/dispatcher/public/v1;dispatcherpublicv1";

// UnifiedMessageKind is the product meaning of a Harness message, independent
// of the Harness that produced it.
enum UnifiedMessageKind {
  // Not set.
  UNIFIED_MESSAGE_KIND_UNSPECIFIED = 0;
  // Text the Agent wrote.
  UNIFIED_MESSAGE_KIND_ASSISTANT = 1;
  // Input the user gave the Work.
  UNIFIED_MESSAGE_KIND_USER = 2;
  // A tool call the Agent made.
  UNIFIED_MESSAGE_KIND_ACTION = 3;
  // The result a tool call returned.
  UNIFIED_MESSAGE_KIND_OBSERVATION = 4;
  // A request for, or decision on, permission to run a tool.
  UNIFIED_MESSAGE_KIND_PERMISSION = 5;
  // A question the Agent asked the user, or its answer.
  UNIFIED_MESSAGE_KIND_INTERACTION = 6;
  // A failure reported by the Harness or the Session.
  UNIFIED_MESSAGE_KIND_ERROR = 7;
  // The end of a turn and its outcome.
  UNIFIED_MESSAGE_KIND_RESULT = 8;
  // Text the Harness itself added to the conversation, such as a background
  // task's notification or the marker an interruption leaves; no person
  // wrote it.
  UNIFIED_MESSAGE_KIND_HARNESS_NOTE = 9;
}

// ContentBlockType is the kind of one block of message content.
enum ContentBlockType {
  // Not set.
  CONTENT_BLOCK_TYPE_UNSPECIFIED = 0;
  // Plain text.
  CONTENT_BLOCK_TYPE_TEXT = 1;
  // An image, base64-encoded.
  CONTENT_BLOCK_TYPE_IMAGE = 2;
}

// PermissionPhase is where a tool-permission request stands.
enum PermissionPhase {
  // Not set.
  PERMISSION_PHASE_UNSPECIFIED = 0;
  // The Harness asked whether the tool may run.
  PERMISSION_PHASE_REQUESTED = 1;
  // The request was allowed or denied.
  PERMISSION_PHASE_DECIDED = 2;
  // The request was withdrawn before a decision.
  PERMISSION_PHASE_CANCELLED = 3;
  // The decision could not be delivered to the Harness.
  PERMISSION_PHASE_FAILED = 4;
}

// PermissionDecision is the outcome of a tool-permission request.
enum PermissionDecision {
  // No decision, as for a request still open or one that failed.
  PERMISSION_DECISION_UNSPECIFIED = 0;
  // The tool may run.
  PERMISSION_DECISION_ALLOW = 1;
  // The tool may not run.
  PERMISSION_DECISION_DENY = 2;
  // The request was withdrawn.
  PERMISSION_DECISION_CANCEL = 3;
}

// InteractionPhase is where a question to the user stands.
enum InteractionPhase {
  // Not set.
  INTERACTION_PHASE_UNSPECIFIED = 0;
  // The Agent asked the user.
  INTERACTION_PHASE_REQUESTED = 1;
  // The user answered.
  INTERACTION_PHASE_RESPONDED = 2;
  // The question was withdrawn before an answer.
  INTERACTION_PHASE_CANCELLED = 3;
  // The user declined to answer.
  INTERACTION_PHASE_SKIPPED = 4;
  // The answer could not be delivered to the Harness.
  INTERACTION_PHASE_FAILED = 5;
}

// ResultStatus is how a turn ended.
enum ResultStatus {
  // Not set.
  RESULT_STATUS_UNSPECIFIED = 0;
  // The turn completed.
  RESULT_STATUS_SUCCESS = 1;
  // The turn ended with an error.
  RESULT_STATUS_FAILED = 2;
  // The turn was cancelled.
  RESULT_STATUS_CANCELLED = 3;
  // The turn was interrupted while streaming or running tools.
  RESULT_STATUS_INTERRUPTED = 4;
  // The turn ran out of time.
  RESULT_STATUS_TIMED_OUT = 5;
  // The turn stopped to wait for the user's input.
  RESULT_STATUS_REQUIRES_INPUT = 6;
}

// MessageDetailFormat is the format of a message's separately stored detail body.
enum MessageDetailFormat {
  // The message has no detail body.
  MESSAGE_DETAIL_FORMAT_UNSPECIFIED = 0;
  // The detail is plain text.
  MESSAGE_DETAIL_FORMAT_TEXT = 1;
  // The detail is JSON, such as a tool's input.
  MESSAGE_DETAIL_FORMAT_JSON = 2;
}

// UnifiedMessage is one message of a Work's conversation in product terms.
message UnifiedMessage {
  // Message identity.
  string id = 1;
  // When the Harness produced the message.
  google.protobuf.Timestamp timestamp = 2;
  // What the message means; selects the payload.
  UnifiedMessageKind kind = 3;
  // Work the message belongs to.
  string agent_work_id = 4;
  // Turn the message belongs to; empty when it belongs to no turn.
  string turn_id = 5;
  // Agent that produced the message: empty for the Harness root, a subagent's
  // name otherwise; absent when the attribution is unknown.
  optional string agent = 6;
  // Format of the full detail body read through GetMessageDetail.
  MessageDetailFormat detail_format = 7;
  // Length of the detail body in Unicode code points.
  uint32 detail_length = 8;
  // The detail body, such as a tool's full input or output. Dispatcher carries
  // it to storage only; history and live delivery leave it empty, and readers
  // fetch it through GetMessageDetail.
  string detail = 9;
  // What a Read, Write or Edit call actually read, wrote or changed, taken
  // from the call's own structured result. Like detail, it is carried to
  // storage only and read through GetToolDetail.
  ToolOutputPreview tool_preview = 10;
  // The kind-specific content.
  oneof payload {
    // Text or image content of an Agent or user message.
    MessagePayload message = 11;
    // A tool call.
    ActionPayload action = 12;
    // A tool call's result.
    ObservationPayload observation = 13;
    // A tool-permission request or decision.
    PermissionPayload permission = 14;
    // A question to the user or its answer.
    InteractionPayload interaction = 15;
    // A failure.
    ErrorPayload error = 16;
    // A turn's outcome.
    ResultPayload result = 17;
  }
}

// ToolOutputPreview is the previewable part of one Read, Write or Edit
// result: its body or patch, never the whole native result.
message ToolOutputPreview {
  // Native name of the tool whose result shape this is: Read, Write or Edit
  // in Claude Code. A reader shows the preview only when it equals the
  // tool_name the call's ActionPayload recorded.
  string tool_name = 1;
  // File the call named; a format hint only, never read.
  string file_path = 2;
  // Read: the text read. Write: the text written.
  string content = 3;
  // Read: first line returned, counting from 1.
  uint32 start_line = 4;
  // Read: lines returned.
  uint32 num_lines = 5;
  // Read: lines in the file.
  uint32 total_lines = 6;
  // Read: the Harness cut a whole-file read at its token cap.
  bool truncated_by_token_cap = 7;
  // Edit: the change as patch hunks.
  repeated PatchHunk hunks = 8;
  // The body or patch was cut at the preview limit.
  bool truncated = 9;
  // Length of the uncut body or patch in Unicode code points.
  uint32 total_length = 10;
}

// PatchHunk is one hunk of a unified diff.
message PatchHunk {
  // First old line.
  uint32 old_start = 1;
  // Old lines covered.
  uint32 old_lines = 2;
  // First new line.
  uint32 new_start = 3;
  // New lines covered.
  uint32 new_lines = 4;
  // Lines, each prefixed with " ", "-" or "+".
  repeated string lines = 5;
}

// ContentBlock is one block of message content.
message ContentBlock {
  // Whether the block is text or an image.
  ContentBlockType type = 1;
  // The text, or the image's base64-encoded data.
  string text = 2;
  // The image's media type; empty for text.
  string mime_type = 3;
}

// MessagePayload is the content of an Agent or user message.
message MessagePayload {
  // Content blocks in order.
  repeated ContentBlock content = 1;
}

// ActionPayload is a tool call; its full input is the message's detail body.
message ActionPayload {
  // Harness identity of the call, shared with its observation.
  string tool_call_id = 1;
  // Tool that was called.
  string tool_name = 2;

  // Short description of the call for display.
  string summary = 3;
}

// ObservationPayload is a tool call's result; its full output is the detail body.
message ObservationPayload {
  // The call this result answers.
  string tool_call_id = 1;

  // Whether the tool reported a failure.
  bool is_error = 2;

  // Harness position of the message holding this result: a Work may start
  // its context from another Work's context up to here.
  string context_position = 3;
}

// PermissionPayload is a request for permission to run a tool, or its outcome.
message PermissionPayload {
  // Where the request stands.
  PermissionPhase phase = 1;
  // Harness identity of the request.
  string permission_id = 2;
  // The call awaiting permission.
  string tool_call_id = 3;
  // Tool awaiting permission.
  string tool_name = 4;
  // What the Harness asked.
  string prompt = 5;
  // The outcome, once decided.
  PermissionDecision decision = 6;
  // Why it was decided, or why delivering the decision failed.
  string reason = 7;
  // Whether the user may allow this tool for the rest of the Work.
  bool can_always_allow = 8;
}

// InteractionPayload is a question to the user, or its answer.
message InteractionPayload {
  // Where the question stands.
  InteractionPhase phase = 1;
  // Harness identity of the question.
  string interaction_id = 2;
  // The user's answers as JSON, once answered.
  string response_json = 3;
  // The call that asked the question.
  string tool_call_id = 4;
  // Why delivering the answer failed.
  string error = 5;
  // Summary count only; original questions remain in the linked tool input.
  uint32 question_count = 6;
}

// ResultPayload is how a turn ended.
message ResultPayload {
  // The outcome.
  ResultStatus status = 1;
  // The Agent's final text for the turn.
  string text = 2;
  // How long the turn ran, in milliseconds.
  int64 duration_ms = 3;
}

// ErrorPayload is a failure reported by the Harness or the Session.
message ErrorPayload {
  // Machine-readable kind of failure.
  string code = 1;
  // Human-readable description.
  string message = 2;
}

// Current Harness requests, read independently from paginated message history.
message PendingInteraction {
  // Harness identity of the request.
  string id = 1;
  // The call awaiting a reply.
  string tool_call_id = 2;
  // Tool awaiting a reply; AskUserQuestion for a question to the user.
  string tool_name = 3;
  // What the Harness asked.
  string prompt = 4;
  // Whether the user may allow this tool for the rest of the Work.
  bool can_always_allow = 5;
  // Only AskUserQuestion input; ordinary tool bodies stay in message details.
  string question_input_json = 6;
  // Whether a reply has been submitted and awaits the Harness.
  bool reply_submitted = 7;
  // Turn the request belongs to.
  string turn_id = 8;
  // Agent that made the request, as in UnifiedMessage.agent.
  optional string agent = 9;
}

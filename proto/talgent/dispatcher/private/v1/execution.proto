syntax = "proto3";

package talgent.dispatcher.private.v1;

import "talgent/dispatcher/private/v1/capability.proto";
import "talgent/dispatcher/public/v1/unified_message.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/dispatcher/private/v1;dispatcherprivatev1";

// ExecutionService controls the native Harness process of an admitted Work start.
// A Work has at most one Harness process at a time, so the Work addresses it.
service ExecutionService {
  // GetCapabilities reads the current native command and Skill inventory.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  // CancelTurn interrupts only the addressed turn, leaving the Work running.
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  // GetCurrentTurn reads native activity independently of paginated history.
  // It answers Unavailable while no replica observes the Work's stream.
  rpc GetCurrentTurn(GetCurrentTurnRequest) returns (GetCurrentTurnResponse);
  // ListPendingInteractions reads the Harness requests awaiting the user's reply,
  // independently of paginated message history. It answers Unavailable while
  // no replica observes the Work's stream.
  rpc ListPendingInteractions(ListPendingInteractionsRequest) returns (ListPendingInteractionsResponse);
  // Connect attaches Dispatcher to the process prepared for the Work's current sandbox.
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // EnqueueInput hands an accepted input or interaction reply to the Work's
  // input buffer. Any replica answers; the replica reading the Work's stream
  // writes buffered entries to the Harness in order.
  rpc EnqueueInput(EnqueueInputRequest) returns (EnqueueInputResponse);
  // ListBufferedInput reads the Work's buffered, not yet settled entries.
  rpc ListBufferedInput(ListBufferedInputRequest) returns (ListBufferedInputResponse);
  // DropInput empties the Work's input buffer when the Work enters Closing.
  rpc DropInput(DropInputRequest) returns (DropInputResponse);
  // Stop signals the Harness process to exit. It is refused, retryably, while
  // a Turn is active: a process is stopped only between Turns.
  rpc Stop(StopRequest) returns (StopResponse);
  // SetThinkingLevel asks the current Harness to adjust its effort setting.
  rpc SetThinkingLevel(SetThinkingLevelRequest) returns (SetThinkingLevelResponse);
  // GetThinkingLevel reads the setting currently applied by the Harness.
  rpc GetThinkingLevel(GetThinkingLevelRequest) returns (GetThinkingLevelResponse);
  // SetPermissionMode asks the current Harness to change its permission mode.
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  // ObserveProcess reports Dispatcher's current observation of one native process.
  rpc ObserveProcess(ObserveProcessRequest) returns (ObserveProcessResponse);
}

// ConnectRequest carries the endpoint resolved for one sandbox and process.
message ConnectRequest {
  // Work whose admitted start prepared this process.
  string work_id = 1;
  // HTTP(S) execd endpoint resolved by Agent infrastructure.
  string endpoint = 2;
  // Credential for this sandbox; never included in public projections.
  string access_token = 3;
  // Execd process handle reserved before connecting.
  string process_id = 4;
  // Native conversation identity selected by the Session context reference.
  string native_session_id = 5;
}

// ConnectResponse acknowledges connection admission, not execution readiness.
message ConnectResponse {}

// EnqueueInputRequest carries one accepted input under its original identity.
message EnqueueInputRequest {
  // Work whose input buffer receives the entry.
  string work_id = 1;
  // The entry: ordinary input, or a reply to a pending interaction.
  oneof entry {
    // Ordinary input text, including the initial input and platform notices.
    BufferedText text = 2;
    // Reply to a Harness permission or question request.
    BufferedReply reply = 3;
  }
}

// BufferedText is ordinary input.
message BufferedText {
  // Caller-assigned input identity; the Harness deduplicates by it.
  string input_id = 1;
  // Input text.
  string text = 2;
}

// BufferedReply answers a pending Harness request; it is judged against the
// request only when written.
message BufferedReply {
  // Native control request identity.
  string interaction_id = 1;
  // Whether the requested operation is allowed.
  bool allow = 2;
  // Whether to apply the native permission suggestions.
  bool always_allow = 3;
  // Explanation for denial.
  string reason = 4;
  // Optional complete replacement tool input, including question answers.
  string updated_input_json = 5;
}

// EnqueueInputResponse tells how the buffer received the entry. A conflicting
// entry under the same identity is refused with ALREADY_EXISTS and a full
// buffer with RESOURCE_EXHAUSTED.
message EnqueueInputResponse {
  // How the hand-off ended.
  InputHandOff hand_off = 1;
}

// InputHandOff is the buffer's answer to a hand-off.
enum InputHandOff {
  // No answer selected.
  INPUT_HAND_OFF_UNSPECIFIED = 0;
  // The entry was appended.
  INPUT_HAND_OFF_BUFFERED = 1;
  // The same entry is already buffered.
  INPUT_HAND_OFF_REPEATED = 2;
  // The entry settled a short while ago; it is not appended again.
  INPUT_HAND_OFF_SETTLED = 3;
}

// ListBufferedInputRequest addresses the Work whose buffer is read.
message ListBufferedInputRequest {
  // Work whose input buffer is read.
  string work_id = 1;
}

// ListBufferedInputResponse lists the Work's unsettled entries in order.
message ListBufferedInputResponse {
  // Ordinary input identities still awaiting processing.
  repeated string input_ids = 1;
  // Interactions that have a buffered reply.
  repeated string replied_interaction_ids = 2;
}

// DropInputRequest addresses the Work entering Closing.
message DropInputRequest {
  // Work whose input buffer is emptied.
  string work_id = 1;
}

// DropInputResponse confirms the buffer is empty.
message DropInputResponse {}

// StopRequest identifies the Work-owned stop request.
message StopRequest {
  // Work whose current process is addressed.
  string work_id = 1;
  // Stop request correlation.
  string stop_request_id = 2;
}

// StopResponse acknowledges the exit signal; actual exit is separate feedback.
message StopResponse {}

// SetThinkingLevelRequest changes a Harness setting, independently of input delivery.
message SetThinkingLevelRequest {
  // Work whose current process is addressed.
  string work_id = 1;
  // Supported native effort level; empty restores the Harness default.
  string level = 2;
}

// SetThinkingLevelResponse confirms the Harness accepted the setting, not turn completion.
message SetThinkingLevelResponse {}

// SetPermissionModeRequest changes the Harness permission mode, independently
// of input delivery.
message SetPermissionModeRequest {
  // Work whose current process is addressed.
  string work_id = 1;
  // Native permission mode: default, acceptEdits, plan, bypassPermissions,
  // dontAsk or auto.
  string mode = 2;
}

// SetPermissionModeResponse confirms the mode the Harness accepted. The mode
// reaches Agent as feedback of the process that accepted it.
message SetPermissionModeResponse {
  // The native permission mode the Harness now applies.
  string mode = 1;
}

// GetThinkingLevelRequest selects the Work's live process.
message GetThinkingLevelRequest {
  // Work whose current process is addressed.
  string work_id = 1;
}

// GetThinkingLevelResponse contains the Harness's applied setting.
message GetThinkingLevelResponse {
  // Current level, or empty when the Harness reports no explicit setting.
  string level = 1;
}

// ListPendingInteractionsRequest addresses the Work whose requests are read.
message ListPendingInteractionsRequest {
  // Work whose pending requests are read.
  string work_id = 1;
}

// ListPendingInteractionsResponse lists the Work's current Harness requests.
message ListPendingInteractionsResponse {
  // Requests awaiting a reply, including ones whose reply is still being delivered.
  repeated talgent.dispatcher.public.v1.PendingInteraction interactions = 1;
}

// CancelTurnRequest addresses the turn to interrupt.
message CancelTurnRequest {
  // Work running the turn.
  string work_id = 1;
  // Turn to interrupt; a different current turn is left running.
  string turn_id = 2;
}

// Delivery is acknowledged here; native facts establish actual turn completion.
message CancelTurnResponse {}

// GetCurrentTurnRequest addresses the Work whose activity is read.
message GetCurrentTurnRequest {
  // Work whose current turn is read.
  string work_id = 1;
}

// GetCurrentTurnResponse describes the Work's turn in progress, if any.
message GetCurrentTurnResponse {
  // Native identity of the turn in progress; empty when none has one yet.
  string turn_id = 1;
  // Whether cancellation of this turn has been requested and not yet observed.
  bool cancel_requested = 2;
  // Includes admitted input awaiting its native turn identity.
  bool active = 3;
}

// ObserveProcessRequest selects the native process launched in the Work's current sandbox.
message ObserveProcessRequest {
  // Work whose current sandbox runs the process.
  string work_id = 1;
  // Execd process handle recorded for the Work's current sandbox.
  string process_id = 2;
}

// ObserveProcessResponse is Dispatcher's current observation, not a replayed feedback item.
message ObserveProcessResponse {
  // Current process state; its exit reaches Agent as an exit fact instead.
  ProcessState state = 1;
  // Native initialization has durably succeeded in the current process.
  bool ready = 2;
  // Actual root-turn activity, excluding transport admission.
  NativeTurnObservation turn = 3;
  // Native position of the latest root-turn or interaction observation.
  int64 phase_sequence = 4;
  // Native requests awaiting a reply; whether one is already buffered is read
  // from the Work's input buffer.
  repeated string required_interaction_ids = 5;
  // Dispatcher is attached to the process's sandbox now: it reads the
  // process's output live. Always set by a Dispatcher that observes its
  // attachment; absent means the attachment is unknown, never detached.
  optional bool attached = 6;
}

// NativeTurnObservation records the latest actual root-turn transition.
message NativeTurnObservation {
  // Position in the current native process stream, for duplicate suppression.
  int64 sequence = 1;
  // The root turn started and has not emitted a terminal result.
  bool active = 2;
  // The root turn emitted a successful result, rather than cancellation or error.
  bool completed = 3;
}

// ProcessState describes whether the observed native process is still live.
enum ProcessState {
  // No state selected.
  PROCESS_STATE_UNSPECIFIED = 0;
  // Dispatcher has not attached to this process yet.
  PROCESS_STATE_PENDING = 1;
  // The process is attached; answered by the replica reading its stream.
  PROCESS_STATE_RUNNING = 2;
}

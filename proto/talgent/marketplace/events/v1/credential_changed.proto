syntax = "proto3";

package talgent.marketplace.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/marketplace/events/v1;marketplaceeventsv1";

// CredentialChange is how the credential of a Provider Authorization changed.
enum CredentialChange {
  // Unspecified change; never published.
  CREDENTIAL_CHANGE_UNSPECIFIED = 0;
  // Marketplace renewed the credential.
  CREDENTIAL_CHANGE_RENEWED = 1;
  // The owner authorized again, replacing the credential.
  CREDENTIAL_CHANGE_REAUTHORIZED = 2;
  // The authorization was revoked; no credential can be supplied.
  CREDENTIAL_CHANGE_REVOKED = 3;
  // Renewal cannot continue until the owner reconnects.
  CREDENTIAL_CHANGE_RECONNECT_REQUIRED = 4;
}

// CredentialChanged is the Credential Change Published Fact: consumers using
// the authorization obtain its current credentials again through credential
// supply. It carries no credential material.
message CredentialChanged {
  // Unique identity of this publication.
  string event_id = 1;
  // Time the change happened.
  google.protobuf.Timestamp occurred_at = 2;
  // The Provider Authorization whose credential changed.
  string authorization_id = 3;
  // How the credential changed.
  CredentialChange change = 4;
}

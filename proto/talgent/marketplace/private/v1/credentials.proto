syntax = "proto3";

package talgent.marketplace.private.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/marketplace/private/v1;marketplaceprivatev1";

// CredentialService is available only to authenticated trusted execution services.
// It is never mounted through the public gateway or offered as an agent tool.
service CredentialService {
  // SupplyRepositoryCredential obtains current material for a retained authorization
  // and a verified external repository target. No Work access is created here.
  rpc SupplyRepositoryCredential(SupplyRepositoryCredentialRequest) returns (SupplyRepositoryCredentialResponse);
  // SupplyServiceCredential obtains current material for a supported service's
  // verified authentication contract, independently of repository bindings.
  rpc SupplyServiceCredential(SupplyServiceCredentialRequest) returns (SupplyServiceCredentialResponse);
}

// Target names are platform-supported authentication contracts, not arbitrary URLs.
message SupplyServiceCredentialRequest {
  // Trusted Talgent owner of the selected personal authorization.
  string owner_user_id = 1;
  // Explicit retained authorization identity, never an ambient default.
  string authorization_id = 2;
  // Platform-supported authentication contract name.
  string target = 3;
}

// SupplyServiceCredentialResponse contains material for trusted injection only.
message SupplyServiceCredentialResponse {
  // Current applicable provider credential; never workload configuration.
  string token = 1;
  // The token's own expiry at the Provider, in Unix milliseconds; 0 when it
  // does not expire.
  int64 expires_at_unix_ms = 2;
}

// SupplyRepositoryCredentialRequest carries references, never ambient defaults.
message SupplyRepositoryCredentialRequest {
  // Trusted Talgent owner of the selected personal authorization.
  string owner_user_id = 1;
  // Explicit retained authorization identity.
  string authorization_id = 2;
  // External repository identity retained by the Work.
  string repository_id = 3;
  // Exact canonical HTTPS destination checked against the external repository.
  string clone_url = 4;
}

// SupplyRepositoryCredentialResponse contains transient trusted material.
// Callers must confine it to credential injection, never workload configuration.
message SupplyRepositoryCredentialResponse {
  // Username for trusted Git credential injection.
  string username = 1;
  // Transient credential; never workload configuration or diagnostics.
  string password = 2;
  // The material's own expiry at the Provider, in Unix milliseconds; 0 when
  // it does not expire.
  int64 expires_at_unix_ms = 3;
}

syntax = "proto3";

package talgent.storage.private.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/storage/private/v1;storageprivatev1";

// ReferenceSpaceService is the Reference Space Contract: one owner's material
// for others to consult read-only, replaced as a whole. Readers, mounted ones
// included, always see one complete current content; a replacement switches
// all of it at once, keeps no earlier content and offers no rollback. A
// mounted space shows every file whose first path element is visible; hidden
// ones are kept for the writer and left out of its listing.
service ReferenceSpaceService {
  // ReadReferenceFiles reads files of the owner's current content, opening
  // the space on its first request; before the first replacement it has no
  // files.
  rpc ReadReferenceFiles(ReadReferenceFilesRequest) returns (ReadReferenceFilesResponse);
  // ReplaceReferenceContent makes the given files the owner's whole content
  // in one atomic switch, and completes only once the earlier content is
  // removed. Repeating it writes the same content again.
  rpc ReplaceReferenceContent(ReplaceReferenceContentRequest) returns (ReplaceReferenceContentResponse);
}

// ReferenceFile is one file of a Reference Space's content.
message ReferenceFile {
  // Clean relative path within the content, such as "pages/payments.md";
  // any other path is refused as invalid.
  string path = 1;
  // File content.
  bytes content = 2;
}

// ReadReferenceFilesRequest names the owner and the files wanted.
message ReadReferenceFilesRequest {
  // Owner identity the caller names the space by: one path element, opaque
  // to Storage.
  string owner = 1;
  // Paths to read; empty reads every file.
  repeated string paths = 2;
}

// ReadReferenceFilesResponse is the files found among those asked for.
message ReadReferenceFilesResponse {
  // The files of the current content.
  repeated ReferenceFile files = 1;
}

// ReplaceReferenceContentRequest is the owner's whole new content.
message ReplaceReferenceContentRequest {
  // Owner identity.
  string owner = 1;
  // Every file of the new content.
  repeated ReferenceFile files = 2;
}

// ReplaceReferenceContentResponse acknowledges the replacement.
message ReplaceReferenceContentResponse {}

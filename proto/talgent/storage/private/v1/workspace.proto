syntax = "proto3";

package talgent.storage.private.v1;

import "google/protobuf/timestamp.proto";
import "talgent/storage/private/v1/storage.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/storage/private/v1;storageprivatev1";

// SandboxMountService is the Sandbox Mount Contract; only Agent calls it.
service SandboxMountService {
  // AcquireMounts returns the Mount Grants of a Work's HOME, Session Workspace
  // and input source, creating each on its first request.
  rpc AcquireMounts(AcquireMountsRequest) returns (AcquireMountsResponse);
  // GetWorkspaceView lists one directory of a Work's workspace as its sandbox
  // sees it, Attachments included under inputs/ and each Reference Space's
  // current content under the name its caller mounted it at.
  rpc GetWorkspaceView(GetWorkspaceViewRequest) returns (GetWorkspaceViewResponse);
  // GetWorkspaceFilePreview tells how one workspace file outside inputs/ is
  // shown, with a link for one inline read when bytes are shown. Workspace
  // files have no Preview Copies.
  rpc GetWorkspaceFilePreview(GetWorkspaceFilePreviewRequest) returns (GetWorkspaceFilePreviewResponse);
  // IssueWorkspaceFileLink issues a short-lived link to download one
  // workspace file outside inputs/ under its own name.
  rpc IssueWorkspaceFileLink(IssueWorkspaceFileLinkRequest) returns (IssueWorkspaceFileLinkResponse);
  // RequestWorkspaceReclamation accepts the reclamation of a closed Work's
  // workspace; Storage completes it on its own schedule.
  rpc RequestWorkspaceReclamation(RequestWorkspaceReclamationRequest) returns (RequestWorkspaceReclamationResponse);
  // JudgeFilePreview tells how a workspace file Storage does not hold is
  // shown, judged from its name, size and leading bytes as a Session
  // Workspace file is, under Storage's preview limits. Storage keeps nothing
  // and links nothing; the caller serves the bytes.
  rpc JudgeFilePreview(JudgeFilePreviewRequest) returns (JudgeFilePreviewResponse);
}

// AcquireMountsRequest names the spaces by business identity.
message AcquireMountsRequest {
  // Owner of the HOME the Work uses, as its caller named it; opaque to
  // Storage, which decides where each HOME lives. The same owner always
  // reaches the same HOME.
  string home_owner = 1;
  // The Work.
  string work_id = 2;
  // Reference naming the Work's Session Workspace; empty for a Work that has
  // none, such as a project-scoped definition's Agent.
  string workspace_reference = 3;
  // Opaque input source of the Work; empty when it has none.
  string input_source = 4;
  // Space Token supplied with the input source.
  string space_token = 5;
  // Reference Spaces the Work's sandbox mounts read-only, each opened on
  // its first request.
  repeated ReferenceMount reference_mounts = 6;
}

// ReferenceMount is a Reference Space mounted read-only in a workspace at a
// name its caller gives.
message ReferenceMount {
  // Directory under /workspace: one visible path element other than inputs.
  string name = 1;
  // Owner of the Reference Space.
  string owner = 2;
}

// MountedReference is the grant of one Reference Space mount.
message MountedReference {
  // The mount's name under /workspace.
  string name = 1;
  // The Reference Space, read-only, following its current content.
  MountGrant grant = 2;
}

// MountGrant is one space's location and access mode, opaque to the caller.
message MountGrant {
  // Persistent volume claim holding the space.
  string claim_name = 1;
  // Path of the space within the claim.
  string sub_path = 2;
  // True when the space is mounted read-only.
  bool read_only = 3;
}

// AcquireMountsResponse returns the grants.
message AcquireMountsResponse {
  // The HOME, read-write.
  MountGrant home = 1;
  // The Session Workspace, read-write; absent for a Work without one.
  MountGrant workspace = 2;
  // The input source's Attachments, read-only; absent without one.
  MountGrant inputs = 3;
  // The requested Reference Spaces, in request order.
  repeated MountedReference references = 4;
}

// GetWorkspaceViewRequest names the workspace and the directory.
message GetWorkspaceViewRequest {
  // Reference naming the Work's Session Workspace.
  string workspace_reference = 1;
  // Opaque input source of the Work; empty when it has none.
  string input_source = 2;
  // Directory relative to /workspace; empty for its root.
  string path = 3;
  // Reference Spaces the Work's sandbox mounts.
  repeated ReferenceMount reference_mounts = 4;
}

// WorkspaceEntryKind is what a workspace entry is.
enum WorkspaceEntryKind {
  // WORKSPACE_ENTRY_KIND_UNSPECIFIED value.
  WORKSPACE_ENTRY_KIND_UNSPECIFIED = 0;
  // A directory.
  WORKSPACE_ENTRY_KIND_DIRECTORY = 1;
  // A file.
  WORKSPACE_ENTRY_KIND_FILE = 2;
  // A symbolic link: listed, never followed or opened.
  WORKSPACE_ENTRY_KIND_LINK = 3;
}

// WorkspaceEntry is one entry of a workspace directory.
message WorkspaceEntry {
  // Name within the directory.
  string name = 1;
  // Size in bytes of a file.
  int64 size_bytes = 2;
  // Last modification.
  google.protobuf.Timestamp modified_at = 3;
  // What the entry is.
  WorkspaceEntryKind kind = 4;
  // Under inputs/: the Attachment's name in the input source's File Space,
  // read as that Attachment.
  string attachment_name = 5;
}

// GetWorkspaceViewResponse lists the directory's first entries by name.
message GetWorkspaceViewResponse {
  // Entries by name.
  repeated WorkspaceEntry entries = 1;
  // Entries the directory has in all; more than listed when it is capped.
  uint32 total = 2;
}

// GetWorkspaceFilePreviewRequest names the workspace file.
message GetWorkspaceFilePreviewRequest {
  // Reference naming the Work's Session Workspace.
  string workspace_reference = 1;
  // File relative to /workspace, outside inputs/.
  string path = 2;
  // Reference Spaces the Work's sandbox mounts.
  repeated ReferenceMount reference_mounts = 3;
}

// GetWorkspaceFilePreviewResponse is the file's preview.
message GetWorkspaceFilePreviewResponse {
  // How the file is shown.
  FilePreview preview = 1;
}

// IssueWorkspaceFileLinkRequest names the workspace file.
message IssueWorkspaceFileLinkRequest {
  // Reference naming the Work's Session Workspace.
  string workspace_reference = 1;
  // File relative to /workspace, outside inputs/.
  string path = 2;
  // Reference Spaces the Work's sandbox mounts.
  repeated ReferenceMount reference_mounts = 3;
}

// IssueWorkspaceFileLinkResponse carries the download link.
message IssueWorkspaceFileLinkResponse {
  // URL for one download, at the public address.
  string access_url = 1;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

// RequestWorkspaceReclamationRequest names the closed Work's workspace.
message RequestWorkspaceReclamationRequest {
  // The closed Work.
  string work_id = 1;
  // Reference naming its Session Workspace.
  string workspace_reference = 2;
}

// RequestWorkspaceReclamationResponse confirms durable acceptance.
message RequestWorkspaceReclamationResponse {}

// JudgeFilePreviewRequest is what a workspace file Storage does not hold
// shows of itself.
message JudgeFilePreviewRequest {
  // File name; its extension routes the judgement.
  string name = 1;
  // Size in bytes.
  int64 size_bytes = 2;
  // Leading bytes of the content, at most 8 KiB; fewer only when the file is
  // shorter.
  bytes head = 3;
}

// JudgeFilePreviewResponse is the verdict.
message JudgeFilePreviewResponse {
  // How the file is shown; it carries no link.
  FilePreview preview = 1;
  // Most bytes a reader of the shown file is served: the shown length of a
  // truncated file, otherwise its kind's limit; 0 when nothing is shown.
  int64 read_limit_bytes = 2;
}

syntax = "proto3";

package talgent.storage.private.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/storage/private/v1;storageprivatev1";

// FileSpaceService is the File Space Contract. A caller names
// each File Space by an owner identity Storage keeps opaque, and decides who
// may read, write or share before calling; Storage checks only the Space
// Token on writes.
service FileSpaceService {
  // OpenFileSpace opens an owner's space on its first need; repeating it
  // returns the same Space Token and input source.
  rpc OpenFileSpace(OpenFileSpaceRequest) returns (OpenFileSpaceResponse);
  // ListFiles lists an owner's Attachments and Artifacts with their active
  // Share Links; an unopened space lists nothing.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // ListOwnerFiles is the Owner File Query: the files in the File Spaces of
  // the given owners. The caller names only owners whose files it has
  // authorized its reader to see.
  rpc ListOwnerFiles(ListOwnerFilesRequest) returns (ListOwnerFilesResponse);
  // ResolveInputSources names the owner of the File Space each input source
  // Storage issued opens, so a caller holding only input sources can name
  // their spaces by owner; a source that names no File Space is unknown.
  rpc ResolveInputSources(ResolveInputSourcesRequest) returns (ResolveInputSourcesResponse);
  // IssueAttachmentUpload issues the link through which one Attachment is
  // created or replaced. Create refuses a taken name; Replace refuses a free one.
  rpc IssueAttachmentUpload(IssueAttachmentUploadRequest) returns (IssueAttachmentUploadResponse);
  // RenameAttachment moves an Attachment and its Share Links to a free name.
  rpc RenameAttachment(RenameAttachmentRequest) returns (RenameAttachmentResponse);
  // DeleteFile deletes an Attachment or an Artifact and revokes its Share
  // Links; deleting an absent file succeeds.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // IssueAccessLink issues a short-lived link for one read of a file.
  rpc IssueAccessLink(IssueAccessLinkRequest) returns (IssueAccessLinkResponse);
  // CreateShareLink adds an unguessable Share Link to an existing file.
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  // RevokeShareLinks revokes a file's active Share Links, all of them or
  // those one person created.
  rpc RevokeShareLinks(RevokeShareLinksRequest) returns (RevokeShareLinksResponse);
  // GetFilePreview tells how a file is shown, judged afresh from its current
  // content, with a link for one inline read when bytes are shown.
  rpc GetFilePreview(GetFilePreviewRequest) returns (GetFilePreviewResponse);
  // RequestFilePreview asks for the Preview Copy of the file's current
  // content when its preview mode is RENDER; a content already rendering,
  // rendered or found unrenderable is not rendered again.
  rpc RequestFilePreview(RequestFilePreviewRequest) returns (RequestFilePreviewResponse);
}

// ArtifactService is the Storage Agent Command Contract: a Work Agent's
// Artifact commands on the File Space its Work was given, each completed
// within its request. The platform Connector calls it under the Work Agent's
// verified Work credential and its Space Token; the Work and its workspace
// come from that identity and the File Space from the token, never from the
// request. A retry meets each
// command's own semantics: Create refuses a taken name, Replace writes
// again and Delete finds nothing left to delete.
service ArtifactService {
  // CreateArtifact publishes one workspace file, or sent content, as a new
  // Artifact.
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);
  // ReplaceArtifact publishes one workspace file, or sent content, over an
  // existing Artifact, keeping its position and Share Links.
  rpc ReplaceArtifact(ReplaceArtifactRequest) returns (ReplaceArtifactResponse);
  // DeleteArtifact deletes an Artifact and revokes its Share Links.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
}

// ErrorReason names why Storage refused a call. A refusal carries it as the
// reason of a google.rpc.ErrorInfo detail in domain "storage", beside the
// status code, so callers tell refusals with the same code apart.
enum ErrorReason {
  // No reason given.
  ERROR_REASON_UNSPECIFIED = 0;
  // No file at the position.
  ERROR_REASON_FILE_NOT_FOUND = 1;
  // No file at the publication source in the workspace.
  ERROR_REASON_SOURCE_NOT_FOUND = 2;
  // The source is not one regular workspace file outside inputs/.
  ERROR_REASON_INVALID_SOURCE = 3;
  // The name is not one file name, or the kind is not a file kind.
  ERROR_REASON_INVALID_NAME = 4;
  // The request misses a required field.
  ERROR_REASON_INVALID_REQUEST = 5;
  // A workspace path leaves the workspace.
  ERROR_REASON_INVALID_WORKSPACE_PATH = 6;
  // A file already has the name.
  ERROR_REASON_NAME_TAKEN = 7;
  // The owner's File Space was never opened, or the Space Token names none.
  ERROR_REASON_SPACE_NOT_OPEN = 8;
  // The Work's workspace was never created.
  ERROR_REASON_WORKSPACE_NOT_CREATED = 9;
  // The Work's workspace was reclaimed.
  ERROR_REASON_WORKSPACE_RECLAIMED = 10;
}

// FileKind is the kind of a File position.
enum FileKind {
  // FILE_KIND_UNSPECIFIED value.
  FILE_KIND_UNSPECIFIED = 0;
  // An input file of the space's owner.
  FILE_KIND_ATTACHMENT = 1;
  // An output a Work Agent published.
  FILE_KIND_ARTIFACT = 2;
}

// AccessDisposition says how an Access Link presents the file.
enum AccessDisposition {
  // ACCESS_DISPOSITION_UNSPECIFIED value.
  ACCESS_DISPOSITION_UNSPECIFIED = 0;
  // Downloads the file under its name.
  ACCESS_DISPOSITION_DOWNLOAD = 1;
  // Shows the file inline for preview.
  ACCESS_DISPOSITION_PREVIEW = 2;
}

// ShareLink is one active Share Link to a file.
message ShareLink {
  // Unguessable token naming the link.
  string token = 1;
  // URL through which anyone holding it reads the file.
  string url = 2;
  // The person the owner's context named when creating it.
  string created_by_user_id = 3;
  // Creation time.
  google.protobuf.Timestamp created_at = 4;
}

// File is one Attachment or Artifact at its File position.
message File {
  // Owner of the File Space, as its caller named it.
  string owner = 1;
  // Attachment or Artifact.
  FileKind kind = 2;
  // File name, unique within its File Space and kind.
  string name = 3;
  // Size in bytes.
  int64 size_bytes = 4;
  // Media type: the uploaded type, or the one of the name's extension.
  string content_type = 5;
  // Last time the content changed.
  google.protobuf.Timestamp updated_at = 6;
  // Human who uploaded an Attachment.
  string uploader_user_id = 7;
  // Work that published an Artifact.
  string work_id = 8;
  // Active Share Links.
  repeated ShareLink share_links = 9;
}

// OpenFileSpaceRequest names the owner.
message OpenFileSpaceRequest {
  // Owner identity the caller names the space by: one path element, opaque
  // to Storage.
  string owner = 1;
}

// OpenFileSpaceResponse carries the space's credential and input source.
message OpenFileSpaceResponse {
  // Credential every file write presents.
  string space_token = 1;
  // Opaque reference to the space for a Work's input source.
  string input_source = 2;
}

// ListFilesRequest names an owner.
message ListFilesRequest {
  // Owner identity.
  string owner = 1;
}

// ListFilesResponse lists the files, Attachments first, by name.
message ListFilesResponse {
  // Files of the owner's space.
  repeated File files = 1;
}

// ListOwnerFilesRequest names the owners.
message ListOwnerFilesRequest {
  // Owner identities; an owner whose space never opened has no files.
  repeated string owners = 1;
}

// ListOwnerFilesResponse lists the owners' files, each with its owner, by
// owner as requested, then Attachments first, by name. Share Links are not
// included.
message ListOwnerFilesResponse {
  // Files of the owners' spaces.
  repeated File files = 1;
}

// ResolveInputSourcesRequest names input sources Storage issued.
message ResolveInputSourcesRequest {
  // Input sources, at most 1000.
  repeated string input_sources = 1;
}

// ResolvedInputSource is one input source's File Space owner.
message ResolvedInputSource {
  // The input source as requested.
  string input_source = 1;
  // Owner of the File Space it opens; empty when unknown.
  string owner = 2;
}

// ResolveInputSourcesResponse answers each requested input source, in order.
message ResolveInputSourcesResponse {
  // Resolutions.
  repeated ResolvedInputSource input_sources = 1;
}

// IssueAttachmentUploadRequest describes the intended write.
message IssueAttachmentUploadRequest {
  // Owner identity.
  string owner = 1;
  // The space's credential.
  string space_token = 2;
  // Attachment name.
  string name = 3;
  // True to replace the Attachment at name; false to create a new one.
  bool replace = 4;
  // Human the upload is attributed to.
  string uploader_user_id = 5;
  // Declared media type, kept with the file.
  string content_type = 6;
}

// IssueAttachmentUploadResponse carries the upload link.
message IssueAttachmentUploadResponse {
  // URL to PUT the content to.
  string upload_url = 1;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

// RenameAttachmentRequest names the Attachment and its new name.
message RenameAttachmentRequest {
  // Owner identity.
  string owner = 1;
  // The space's credential.
  string space_token = 2;
  // Current name.
  string name = 3;
  // New name; it must be free.
  string new_name = 4;
  // The person renaming it, admitted by the owner's context.
  string actor_user_id = 5;
}

// RenameAttachmentResponse returns the renamed Attachment.
message RenameAttachmentResponse {
  // The Attachment at its new position.
  File file = 1;
}

// DeleteFileRequest names the file.
message DeleteFileRequest {
  // Owner identity.
  string owner = 1;
  // The space's credential.
  string space_token = 2;
  // Attachment or Artifact.
  FileKind kind = 3;
  // File name.
  string name = 4;
  // The person deleting it, admitted by the owner's context.
  string actor_user_id = 5;
}

// DeleteFileResponse confirms the file is gone.
message DeleteFileResponse {}

// IssueAccessLinkRequest names the file to read.
message IssueAccessLinkRequest {
  // Owner identity.
  string owner = 1;
  // Attachment or Artifact.
  FileKind kind = 2;
  // File name.
  string name = 3;
  // How the link presents the file.
  AccessDisposition disposition = 4;
}

// IssueAccessLinkResponse carries the link.
message IssueAccessLinkResponse {
  // URL for one read, at the public address.
  string access_url = 1;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
  // The same link as a path, which a Work's sandbox resolves against the
  // native API.
  string access_path = 3;
}

// GetFilePreviewRequest names the file.
message GetFilePreviewRequest {
  // Owner identity.
  string owner = 1;
  // Attachment or Artifact.
  FileKind kind = 2;
  // File name.
  string name = 3;
}

// GetFilePreviewResponse is the file's preview.
message GetFilePreviewResponse {
  // How the file is shown.
  FilePreview preview = 1;
}

// RequestFilePreviewRequest names the file.
message RequestFilePreviewRequest {
  // Owner identity.
  string owner = 1;
  // Attachment or Artifact.
  FileKind kind = 2;
  // File name.
  string name = 3;
}

// RequestFilePreviewResponse is the file's preview after the request.
message RequestFilePreviewResponse {
  // How the file is shown.
  FilePreview preview = 1;
}

// PreviewMode is how a file is shown.
enum PreviewMode {
  // PREVIEW_MODE_UNSPECIFIED value.
  PREVIEW_MODE_UNSPECIFIED = 0;
  // Not shown; refusal says why. The original still downloads.
  PREVIEW_MODE_REFUSED = 1;
  // The content's Preview Copy is shown.
  PREVIEW_MODE_PREVIEW_COPY = 2;
  // A Preview Copy must be rendered first.
  PREVIEW_MODE_RENDER = 3;
  // The file is shown as it is.
  PREVIEW_MODE_DIRECT = 4;
  // The first limit_bytes of the file are shown as text.
  PREVIEW_MODE_TRUNCATED = 5;
}

// PreviewDisplay is what the shown bytes are.
enum PreviewDisplay {
  // Nothing is shown.
  PREVIEW_DISPLAY_UNSPECIFIED = 0;
  // UTF-8 text, rendered by the file's extension.
  PREVIEW_DISPLAY_TEXT = 1;
  // A PDF: a native one or a Preview Copy.
  PREVIEW_DISPLAY_PDF = 2;
  // An image.
  PREVIEW_DISPLAY_IMAGE = 3;
}

// PreviewRefusal is why a file is not shown, as a reader can recognize it.
enum PreviewRefusal {
  // Not refused.
  PREVIEW_REFUSAL_UNSPECIFIED = 0;
  // No preview exists for this kind of file.
  PREVIEW_REFUSAL_UNSUPPORTED = 1;
  // The content is not what the file extension says.
  PREVIEW_REFUSAL_STRUCTURE_MISMATCH = 2;
  // The file is encrypted.
  PREVIEW_REFUSAL_ENCRYPTED = 3;
  // The file is over limit_bytes, its kind's preview limit.
  PREVIEW_REFUSAL_TOO_LARGE = 4;
  // The converter found the content damaged.
  PREVIEW_REFUSAL_CORRUPT = 5;
  // The converter refused the content.
  PREVIEW_REFUSAL_CONVERTER_REFUSED = 6;
  // The rendering came out over its limit.
  PREVIEW_REFUSAL_RENDERING_TOO_LARGE = 7;
}

// FilePreview is how one file is shown.
message FilePreview {
  // Mode.
  PreviewMode mode = 1;
  // What the shown bytes are.
  PreviewDisplay display = 2;
  // Why a refused file is not shown.
  PreviewRefusal refusal = 3;
  // Shown length of a truncated file, or the limit a too large file exceeds.
  int64 limit_bytes = 4;
  // URL for one inline read of the shown bytes; empty when none are shown.
  string access_url = 5;
  // The same link as a path.
  string access_path = 6;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 7;
  // With mode RENDER: a rendering of the content is queued or running.
  bool rendering = 8;
}

// CreateShareLinkRequest names the file and its sharer.
message CreateShareLinkRequest {
  // Owner identity.
  string owner = 1;
  // Attachment or Artifact.
  FileKind kind = 2;
  // File name.
  string name = 3;
  // The person sharing it.
  string created_by_user_id = 4;
}

// CreateShareLinkResponse returns the new link.
message CreateShareLinkResponse {
  // The active Share Link.
  ShareLink share_link = 1;
}

// RevokeShareLinksRequest names the file and whose links end.
message RevokeShareLinksRequest {
  // Owner identity.
  string owner = 1;
  // Attachment or Artifact.
  FileKind kind = 2;
  // File name.
  string name = 3;
  // Only the links this person created end; empty ends every link.
  string created_by_user_id = 4;
}

// RevokeShareLinksResponse reports what ended and what stays active.
message RevokeShareLinksResponse {
  // Links revoked now.
  int32 revoked = 1;
  // Active links left at the file.
  int32 remaining = 2;
}

// ArtifactOutcome is the explicit result of an Artifact command.
message ArtifactOutcome {
  // The Artifact at its position.
  File artifact = 1;
}

// CreateArtifactRequest publishes one file of the Work's workspace, or the
// content a Work without one sent, as a new Artifact of its File Space.
// Exactly one of path and content is set.
message CreateArtifactRequest {
  // Artifact name; it must be free.
  string name = 1;
  // File path relative to /workspace, outside inputs/ and Reference Space
  // mounts.
  string path = 2;
  // The file's content, at most 64 MiB, from a Work without a Session
  // Workspace.
  optional bytes content = 3;
}

// CreateArtifactResponse returns the outcome.
message CreateArtifactResponse {
  // The outcome.
  ArtifactOutcome outcome = 1;
}

// ReplaceArtifactRequest replaces an existing Artifact from one file of the
// Work's workspace, or the content a Work without one sent. Exactly one of
// path and content is set.
message ReplaceArtifactRequest {
  // Name of the existing Artifact.
  string name = 1;
  // File path relative to /workspace, outside inputs/ and Reference Space
  // mounts.
  string path = 2;
  // The file's content, at most 64 MiB, from a Work without a Session
  // Workspace.
  optional bytes content = 3;
}

// ReplaceArtifactResponse returns the outcome.
message ReplaceArtifactResponse {
  // The outcome.
  ArtifactOutcome outcome = 1;
}

// DeleteArtifactRequest deletes an Artifact of the Work's File Space.
message DeleteArtifactRequest {
  // Artifact name.
  string name = 1;
}

// DeleteArtifactResponse confirms the deletion.
message DeleteArtifactResponse {}

syntax = "proto3";

package talgent.storage.task.v1;

option go_package = "github.com/talgent-work/workbench/gen/go/talgent/storage/task/v1;storagetaskv1";

// RenderPreviewTask asks Storage to render the Preview Copy of one content, as
// it was found at one File position when a reader opened it. The task is keyed
// by the content digest, so one content renders once however many readers
// open it.
message RenderPreviewTask {
  // Owner of the File Space.
  string owner = 1;
  // "attachment" or "artifact".
  string kind = 2;
  // File name at the position.
  string name = 3;
  // SHA-256 of the content to render; the file is skipped once it holds
  // other content.
  string digest = 4;
}

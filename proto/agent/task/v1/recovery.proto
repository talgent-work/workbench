syntax = "proto3";

package agent.task.v1;

option go_package = "github.com/talgent-work/workbench/gen/agent/task/v1;agenttaskv1";

// ReconcileExecutionTaskV1 asks Agent to take whichever short step one
// AgentExecution's current facts call for, and to wake its long step when one
// is due.
message ReconcileExecutionTaskV1 {
  // AgentExecution identity.
  string execution_id = 1;
  // Whether every environment carrying the execution's ownership is listed
  // even while Dispatcher reads its launched process, as after the
  // environment authority reported a change to one of them.
  bool observe_environments = 2;
}

// RunLongExecutionStepTaskV1 asks Agent to take the step of one AgentExecution
// that may wait minutes, such as its environment's preparation, apart from the
// short steps.
message RunLongExecutionStepTaskV1 {
  // AgentExecution identity.
  string execution_id = 1;
}

// RecoverWorkTaskV1 asks Agent to advance one Work's retained execution,
// input and workspace obligations.
message RecoverWorkTaskV1 {
  // AgentWork identity.
  string work_id = 1;
}

// RecoverContinuationTaskV1 asks Agent to settle one Work's pending continuation
// request after admission uncertainty.
message RecoverContinuationTaskV1 {
  // AgentWork identity owning the continuation request.
  string work_id = 1;
}

// PrepareInitialExecutionTaskV1 asks Agent to prepare and deliver one Work's
// initial execution under its Startup Deadline.
message PrepareInitialExecutionTaskV1 {
  // AgentWork identity owning the initial execution request.
  string work_id = 1;
}

// SweepRecoveryTaskV1 is the periodic fallback that wakes every unfinished
// recovery obligation. It carries no data.
message SweepRecoveryTaskV1 {}

// RequestWorkspaceReclamationTaskV1 delivers a Closed Work's one Workspace
// Reclamation Request to Storage, retried until Storage accepts it.
message RequestWorkspaceReclamationTaskV1 {
  // AgentWork identity whose Session Workspace is reclaimed.
  string work_id = 1;
  // The Work's opaque Session Workspace reference.
  string workspace_reference = 2;
}

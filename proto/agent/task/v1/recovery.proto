syntax = "proto3";

package agent.task.v1;

option go_package = "github.com/talgent-work/workbench/gen/agent/task/v1;agenttaskv1";

import "google/protobuf/timestamp.proto";

// ReconcileExecutionTaskV1 asks Agent to take whichever short step one
// AgentExecution's current facts call for, and to wake its long step when one
// is due.
message ReconcileExecutionTaskV1 {
  // AgentExecution identity.
  string execution_id = 1;
}

// RunLongExecutionStepTaskV1 asks Agent to take the step of one AgentExecution
// that may wait minutes, such as its environment's preparation, apart from the
// short steps.
message RunLongExecutionStepTaskV1 {
  // AgentExecution identity.
  string execution_id = 1;
}

// RecoverWorkTaskV1 asks Agent to advance one Work's retained execution,
// input and workspace obligations.
message RecoverWorkTaskV1 {
  // AgentWork identity.
  string work_id = 1;
}

// SweepRecoveryTaskV1 is the periodic fallback that wakes every unfinished
// recovery obligation. It carries no data.
message SweepRecoveryTaskV1 {}

// RequestWorkspaceReclamationTaskV1 delivers a Closed Work's one Work
// Reclamation Request to Storage, retried until Storage accepts it. Storage
// reclaims every Directory with that Work's lifetime.
message RequestWorkspaceReclamationTaskV1 {
  reserved 2;
  reserved "workspace_reference";
  // The closed AgentWork's identity.
  string work_id = 1;
}

// CloseRemovedApplicationWorkTaskV1 closes one unclosed Work of an
// Application Account removed, retried a bounded number of times. Agent keeps
// no obligation for it: a close that exhausts its retries is logged as an
// error naming the Work, which then stops at its idle timeout.
message CloseRemovedApplicationWorkTaskV1 {
  // The AgentWork's identity.
  string work_id = 1;
  // The removed Application, which owns the Work.
  string application_id = 2;
}

// DeliverInputChangeNoticeTaskV1 delivers one Work the notice of one change
// in its located inputs, retried a bounded number of times. Agent keeps no
// obligation for it: a delivery that exhausts its retries is logged as an
// error naming the Work.
message DeliverInputChangeNoticeTaskV1 {
  // The AgentWork's identity.
  string work_id = 1;
  // Identity of the file change, from which the notice's input identity
  // derives.
  string change_id = 2;
  // The Directory the file changed in.
  InputDirectoryV1 directory = 3;
  // The file's name after the change; for a deletion, the name it had.
  string file = 4;
  // The former name of a renamed file; empty otherwise.
  string previous_file = 5;
  // How the file changed.
  InputFileOperation operation = 6;
  // Time the change was committed.
  google.protobuf.Timestamp occurred_at = 7;
}

// InputDirectoryV1 identifies a Directory by its owner facts, in condition
// order, and its name.
message InputDirectoryV1 {
  // One condition of the owner with its value.
  message OwnerFact {
    // The condition's name.
    string condition = 1;
    // The condition's value.
    string value = 2;
  }
  // Owner facts ordered by condition name.
  repeated OwnerFact owner = 1;
  // Name within the owner.
  string name = 2;
}

// InputFileOperation is how a file in a Directory changed.
enum InputFileOperation {
  // Unspecified operation; never queued.
  INPUT_FILE_OPERATION_UNSPECIFIED = 0;
  // A file was added.
  INPUT_FILE_OPERATION_ADDED = 1;
  // A file's content was replaced.
  INPUT_FILE_OPERATION_REPLACED = 2;
  // A file was renamed.
  INPUT_FILE_OPERATION_RENAMED = 3;
  // A file was deleted.
  INPUT_FILE_OPERATION_DELETED = 4;
}

// The task payloads below are retired: their queued tasks are dropped without
// decoding. They stay because a task contract only grows within its version.

// ReconcileAllocationTaskV1 is a retired payload.
message ReconcileAllocationTaskV1 {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// PrepareAllocationTaskV1 is a retired payload.
message PrepareAllocationTaskV1 {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// ReconnectAllocationTaskV1 is a retired payload.
message ReconnectAllocationTaskV1 {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// DeliverCredentialsTaskV1 is a retired payload.
message DeliverCredentialsTaskV1 {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// SyncInputsTaskV1 is a retired payload.
message SyncInputsTaskV1 {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// ObserveSandboxTaskV1 is a retired payload.
message ObserveSandboxTaskV1 {
  // Allocation identity of the durable allocation record.
  string allocation_id = 1;
}

// RecoverContinuationTaskV1 is a retired payload.
message RecoverContinuationTaskV1 {
  // AgentWork identity owning the continuation request.
  string work_id = 1;
}

// RecoverWorkCreationTaskV1 is a retired payload.
message RecoverWorkCreationTaskV1 {
  // Original Work creation request identity.
  string request_id = 1;
}

// PrepareInitialExecutionTaskV1 is a retired payload.
message PrepareInitialExecutionTaskV1 {
  // AgentWork identity owning the initial execution request.
  string work_id = 1;
}

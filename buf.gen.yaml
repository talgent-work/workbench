version: v2
# The Workbench's own contracts: the task payloads its queues persist. The
# generator runs from the go.mod tool directive, so the generated code always
# matches the protobuf runtime this module requires.
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
# Output of a removed proto file is deleted with it.
clean: true

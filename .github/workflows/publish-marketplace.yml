name: Publish Marketplace

on:
  push:
    branches:
    - master
    paths:
    - 'plugins/**'
  workflow_dispatch:
    inputs:
      source_ref:
        required: false
        type: string
        description: Source branch, tag or commit; defaults to the selected workflow revision.
      plugin_id:
        required: false
        type: string
        default: talgent
        description: Comma-separated plugin directory name(s) under plugins/ to publish.
      dry_run:
        required: false
        type: boolean
        default: true
        description: Validate and show changes without pushing marketplace commits.

permissions:
  contents: read

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  # The core plugins publish to the public marketplace, which other
  # repositories publish their plugins into too. scripts/marketplace/
  # publish.sh touches only these plugins' entries and packages, retires the
  # plugins they supersede, and publishes again onto main when another
  # repository pushed meanwhile; the concurrency group below serializes only
  # this repository's runs.
  #
  # Pushing needs the repository secret MARKETPLACE_DEPLOY_KEY: the private
  # half of a deploy key with write access to talgent-work/marketplace. A dry
  # run needs none.
  publish:
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_REPOSITORY: talgent-work/marketplace
      TALGENT_MARKETPLACE_DIR: .marketplace-publish
      TALGENT_PLUGIN_SOURCE_ROOT: ${{ inputs.source_ref != '' && '.plugin-source/plugins' || 'plugins' }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}

    - name: Checkout selected Plugin sources
      if: github.event_name == 'workflow_dispatch' && inputs.source_ref != ''
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_ref }}
        path: .plugin-source

    - name: Resolve mode
      id: mode
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
          echo "dry_run=${INPUT_DRY_RUN:-true}" >> "$GITHUB_OUTPUT"
          echo "version_bump=patch" >> "$GITHUB_OUTPUT"
        else
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          echo "version_bump=minor" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve plugins
      id: plugin
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_PLUGIN_ID: ${{ inputs.plugin_id }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        plugin_ids="$(bash scripts/marketplace/resolve-publishable-plugins.sh)"
        plugin_count="$(printf '%s\n' "${plugin_ids}" | sed '/^$/d' | wc -l | tr -d ' ')"
        if [ "${plugin_count}" = "0" ]; then
          echo "publishable=false" >> "$GITHUB_OUTPUT"
          echo "No publishable plugin changes; skipping marketplace publish."
          exit 0
        fi

        echo "publishable=true" >> "$GITHUB_OUTPUT"
        {
          echo "plugin_ids<<EOF"
          printf '%s\n' "${plugin_ids}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Check publication credentials
      if: steps.plugin.outputs.publishable == 'true' && steps.mode.outputs.dry_run != 'true'
      env:
        DEPLOY_KEY: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}
      run: |
        test -n "${DEPLOY_KEY}" || { echo "::error::MARKETPLACE_DEPLOY_KEY is required to publish ${MARKETPLACE_REPOSITORY}"; exit 1; }

    - name: Checkout public marketplace repository
      if: steps.plugin.outputs.publishable == 'true'
      uses: actions/checkout@v6
      with:
        repository: talgent-work/marketplace
        ref: main
        path: .marketplace-publish
        ssh-key: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}

    - name: Publish selected plugins
      if: steps.plugin.outputs.publishable == 'true'
      env:
        TALGENT_VERSION_BUMP: ${{ steps.mode.outputs.version_bump }}
        TALGENT_DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        TALGENT_PLUGIN_IDS: ${{ steps.plugin.outputs.plugin_ids }}
      run: |
        set -euo pipefail
        git -C "${TALGENT_MARKETPLACE_DIR}" config user.name "github-actions[bot]"
        git -C "${TALGENT_MARKETPLACE_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        bash scripts/marketplace/publish.sh

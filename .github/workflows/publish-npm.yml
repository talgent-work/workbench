name: Publish npm packages

# Publishes the Workbench's npm packages at a release, at the release's
# version: @talgent/workbench-ui at every release, which leaves
# @talgent/contracts to the web app that hosts it, and @talgent/computer when
# its package changed. Auto Tag runs it on the vX.Y.Z tag it just pushed (a tag
# pushed with the workflow token starts no workflow by itself); running it
# again by hand on a released tag publishes what npm lacks.
on:
  workflow_dispatch:

# npm Trusted Publishing: each package trusts this workflow of
# talgent-work/workbench, and npm exchanges the run's OIDC token for the
# publish. No npm token is stored.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Resolve the release version from the tag
      id: release
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" != "tag" ] || ! [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::Run this workflow on a vX.Y.Z release tag, not ${REF_TYPE} ${REF_NAME}."
          exit 1
        fi
        echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm

    # Trusted Publishing needs npm 11.5.1 or newer.
    - name: Install an npm that publishes with OIDC
      run: npm install -g npm@^11.5.1

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check @talgent/workbench-ui
      run: pnpm --filter @talgent/workbench-ui run typecheck

    # Each package is built at the release's version, and pnpm packs it,
    # replacing workspace: dependencies with that version; npm publishes the
    # tarball through Trusted Publishing. Every release is latest:
    # @talgent/computer carries 0.30.x from before the Workbench's own
    # versions began at 0.1.0, and npm applies latest to a lower version only
    # when told.
    #
    # Every Managed Computer upgrades to each Talgent Computer release it is
    # offered, so @talgent/computer ships only when it changed: built at the
    # newest published release's version, a package that matches that
    # release's tarball file for file is that release, and a deployment of
    # this platform release runs it (scripts/deploy/lib/computer-release.sh).
    - name: Publish
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        packed="$(mktemp -d)"
        build() {
          (cd "$2" && npm version "$3" --no-git-tag-version --allow-same-version >/dev/null)
          if [ "$1" = "@talgent/computer" ]; then pnpm --filter "$1" run build; fi
          rm -rf "${packed:?}"/*
          pnpm --filter "$1" pack --pack-destination "${packed}"
        }
        computer_unchanged() {
          local latest compared
          latest="$(npm view @talgent/computer dist-tags.latest)"
          compared="$(mktemp -d)"
          mkdir "${compared}/built" "${compared}/published"
          build @talgent/computer apps/computer "${latest}"
          tar -xzf "${packed}"/*.tgz -C "${compared}/built"
          (cd "${compared}/published" && npm pack "@talgent/computer@${latest}" && tar -xzf ./*.tgz)
          if diff -r "${compared}/published/package" "${compared}/built/package"; then
            echo "@talgent/computer is unchanged since ${latest}; this release does not publish it."
            return 0
          fi
          return 1
        }
        for entry in "@talgent/computer apps/computer" "@talgent/workbench-ui packages/workbench-ui"; do
          read -r package dir <<< "${entry}"
          if [ "$(npm view "${package}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "${package}@${VERSION} is already published."
            continue
          fi
          if [ "${package}" = "@talgent/computer" ] && computer_unchanged; then
            continue
          fi
          build "${package}" "${dir}" "${VERSION}"
          npm publish "${packed}"/*.tgz --access public --tag latest
        done

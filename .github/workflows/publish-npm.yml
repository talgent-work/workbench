name: Publish npm packages

# Publishes the Workbench's npm packages at a release, each at the release's
# version: @talgent/computer and @talgent/workbench-ui, which leaves
# @talgent/contracts to the web app that hosts it. Auto Tag runs it on the vX.Y.Z tag it just
# pushed (a tag pushed with the workflow token starts no workflow by itself);
# running it again by hand on a released tag publishes what npm lacks.
on:
  workflow_dispatch:

# npm Trusted Publishing: each package trusts this workflow of
# talgent-work/workbench, and npm exchanges the run's OIDC token for the
# publish. No npm token is stored.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Resolve the release version from the tag
      id: release
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" != "tag" ] || ! [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::Run this workflow on a vX.Y.Z release tag, not ${REF_TYPE} ${REF_NAME}."
          exit 1
        fi
        echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm

    # Trusted Publishing needs npm 11.5.1 or newer.
    - name: Install an npm that publishes with OIDC
      run: npm install -g npm@^11.5.1

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Every package takes the release's version. workbench-ui type-checks
    # against the contracts the Workbench is built with.
    - name: Build at the release version
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        for dir in apps/computer packages/workbench-ui; do
          (cd "$dir" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
        done
        pnpm --filter @talgent/computer run build
        pnpm --filter @talgent/contracts run build
        pnpm --filter @talgent/workbench-ui run typecheck

    # pnpm packs each package, replacing workspace: dependencies with the
    # release's version; npm publishes the tarball through Trusted Publishing.
    # Every release is latest: @talgent/computer carries 0.30.x from before the
    # Workbench's own versions began at 0.1.0, and npm applies latest to a
    # lower version only when told.
    - name: Publish
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        packed="$(mktemp -d)"
        for package in @talgent/computer @talgent/workbench-ui; do
          if [ "$(npm view "${package}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "${package}@${VERSION} is already published."
            continue
          fi
          rm -f "${packed}"/*.tgz
          pnpm --filter "${package}" pack --pack-destination "${packed}"
          npm publish "${packed}"/*.tgz --access public --tag latest
        done

name: Go Cache

# CI does not run on master, and Actions caches are scoped by ref: a
# branch restores only its own caches and those of master. Without this
# workflow every new branch compiles from scratch. A branch saves its own only
# for a go.mod or go.sum master has no cache of (.github/actions/go-cache).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  # Cache pruning reads whether each pull request is still open.
  pull-requests: read

concurrency:
  group: go-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # name is the cache CI's job restores; targets compile what that job
        # compiles, with its flags. The test job also compiles the images'
        # binaries, which a release compiles from the same cache.
        include:
        - name: test
          targets: test-compile image-binaries
        - name: integration-test
          targets: test-integration-compile
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - uses: ./.github/actions/go-cache
      id: go-cache
      with:
        name: ${{ matrix.name }}
        go-version: ${{ steps.go.outputs.go-version }}

    - name: Compile
      # /tmp on the runner is a 4G tmpfs; a cold -race compile overflows it.
      env:
        TMPDIR: ${{ runner.temp }}
      run: make ${{ matrix.targets }}

    - name: Save the Go caches
      uses: actions/cache/save@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.go-cache.outputs.key }}

  prune:
    needs: warm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Prune superseded and closed pull request caches
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/ci/prune-actions-caches.sh

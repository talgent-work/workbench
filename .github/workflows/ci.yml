name: CI

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
    inputs:
      build_all:
        type: boolean
        default: false
        description: Build all product images after tests pass.
      services:
        type: string
        default: ''
        description: Comma-separated images to build after tests; empty detects changes.

permissions:
  contents: write
  actions: write

# Cancel in-progress runs when a new commit is pushed to the same branch.
# Releases (auto-tag.yml) keep their own concurrency group that does NOT cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go test dependencies and build outputs
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-

    - name: Run tests
      # /tmp on the runner is a 4G tmpfs; a cold -race compile overflows it.
      env:
        TMPDIR: ${{ runner.temp }}
      run: make test

    - name: Check the public tree for leaks
      env:
        TALGENT_REQUIRE_SECRET_SCAN: "1"
      run: |
        go install github.com/zricethezav/gitleaks/v8@v8.21.2
        PATH="$(go env GOPATH)/bin:${PATH}" make check-leaks

    - name: Verify Storage and Agent execution across controlplane and native UID boundaries
      run: |
        go test -race -c -o /tmp/talgent-storage.test ./internal/business/storage/infrastructure
        sudo -n /tmp/talgent-storage.test -test.v
        go test -race -c -o /tmp/talgent-agent-execution.test ./internal/business/agent/infrastructure/execution
        sudo -n /tmp/talgent-agent-execution.test -test.v

  generate:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      generated_changed: ${{ steps.generate.outputs.generated_changed }}
    steps:
    - uses: actions/checkout@v6

    - name: Install Buf CLI
      uses: bufbuild/buf-action@v1.5.0
      with:
        version: 1.67.0
        setup_only: true

    - name: Generate protobuf code
      run: make generate

    - name: Commit generated files when safe
      id: generate
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_BRANCH: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        BUILD_ALL: ${{ inputs.build_all || false }}
        SERVICES: ${{ inputs.services || '' }}
      run: |
        set -euo pipefail

        if git diff --quiet -- gen; then
          echo "Generated protobuf files are current."
          echo "generated_changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Generated protobuf files changed:"
        git diff --stat -- gen

        if [ "$REF_TYPE" != "branch" ] || [ "$HEAD_BRANCH" = "master" ] || [ -z "$HEAD_BRANCH" ]; then
          echo "Generated files are out of sync on a protected or unknown branch; refusing to commit from CI."
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add gen
        git commit -m "chore: regenerate protobuf files"
        git push origin "HEAD:$HEAD_BRANCH"
        echo "generated_changed=true" >> "$GITHUB_OUTPUT"

        echo "Dispatching CI for regenerated branch $HEAD_BRANCH."
        gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH" \
          -f "build_all=$BUILD_ALL" -f "services=$SERVICES"

  frontend:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      run: make pnpm-install

    - name: Build generated TypeScript package
      run: make gen-ts-rebuild

    - name: Verify generated TypeScript runtime imports
      run: make gen-ts-test-runtime

    # Every workspace build type-checks its sources (tsc -b / tsc --noEmit),
    # so no separate type-check pass is needed.
    - name: Build (all workspaces)
      run: make frontend-build

    - name: Test (all workspaces)
      run: make frontend-test

    - name: Lint (web, computer)
      run: make frontend-lint

  # Talgent Computer runs on the person's own machine: its suite runs on each
  # platform, and the packed package is installed, registered, brought online
  # and run as the background service against the stand-in Gateway there.
  computer:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @talgent/computer...

    - name: Test
      run: pnpm --filter @talgent/computer test

    - name: Build
      run: pnpm --filter @talgent/computer run build

    # A runner has no login session, so its user's systemd manager runs only
    # once lingering is on, as on a person's machine that keeps the service
    # running while logged out.
    - name: Start the user's systemd manager
      if: runner.os == 'Linux'
      run: |
        sudo loginctl enable-linger "$USER"
        uid="$(id -u)"
        for _ in $(seq 1 50); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.2; done
        echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

    - name: Install, register, online and the background service from the packed package
      working-directory: apps/computer
      run: |
        npm pack
        npm install -g ./talgent-computer-*.tgz
        npm run test:installed

  integration-test:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go test dependencies and build outputs
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-

    - uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Run integration tests with production storage ownership privileges
      run: |
        sudo -n env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" make test-integration

    # The native cases run the Claude Code and execd the sandbox ships, as the
    # unprivileged user the sandbox runs them as.
    - name: Install the sandbox's native binaries
      run: |
        claude_version="$(sed -n 's/.*@anthropic-ai\/claude-code@\([0-9.]*\).*/\1/p' deploy/sandbox/Dockerfile.base)"
        test -n "$claude_version"
        npm install --prefix "$RUNNER_TEMP/claude" --no-save "@anthropic-ai/claude-code@$claude_version"
        execd_image="$(sed -n 's/^FROM //p' deploy/execd/Dockerfile | head -n 1)"
        container="$(docker create "$execd_image")"
        docker cp "$container:/execd" "$RUNNER_TEMP/execd"
        docker rm "$container"

    - name: Run native Harness integration tests
      env:
        CLAUDE_BINARY: ${{ runner.temp }}/claude/node_modules/.bin/claude
        EXECD_BINARY: ${{ runner.temp }}/execd
      run: make test-native

    # A Managed Computer serves the same execd protocol: Talgent Computer is
    # checked against the real execd, then the Dispatcher's native cases run
    # through the Computer Gateway against it.
    - name: Run native cases through Talgent Computer
      env:
        CLAUDE_BINARY: ${{ runner.temp }}/claude/node_modules/.bin/claude
        EXECD_BINARY: ${{ runner.temp }}/execd
      run: |
        corepack enable
        pnpm install --frozen-lockfile --filter @talgent/computer...
        pnpm --filter @talgent/computer run build
        pnpm --filter @talgent/computer test
        TALGENT_COMPUTER_PROGRAM="$PWD/apps/computer/dist/talgent-computer.mjs" make test-native-computer

  # A contract package only grows within its version: every package except
  # the task ones is compared with the previous release.
  breaking:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Buf CLI
      uses: bufbuild/buf-action@v1.5.0
      with:
        version: 1.67.0
        setup_only: true

    - name: Compare the contracts with the previous release
      run: |
        previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
        if [ -z "$previous" ]; then
          echo "No previous release to compare with."
          exit 0
        fi
        echo "Comparing with $previous"
        make check-breaking BREAKING_AGAINST=".git#tag=${previous}"

  images:
    needs: [generate, test, frontend, integration-test, breaking, image-baseline]
    uses: ./.github/workflows/docker-build.yml
    with:
      build_all: ${{ inputs.build_all || false }}
      services: ${{ inputs.services || '' }}
      base_ref: ${{ needs.image-baseline.outputs.base_ref }}
    permissions:
      contents: read
      packages: write

  image-baseline:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base_ref: ${{ steps.previous.outputs.base_ref }}
    steps:
    - uses: actions/checkout@v6
    - name: Find the last successful branch image build
      id: previous
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_BRANCH: ${{ github.ref_name }}
      run: python3 scripts/ci/previous-image-build.py

  record-image-baseline:
    needs: images
    # A manually selected subset cannot advance the baseline for all images.
    if: inputs.services == '' || inputs.build_all == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Record the successfully built branch commit
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: printf '%s\n' "$SOURCE_SHA" > source.txt
    - uses: actions/upload-artifact@v4
      with:
        name: branch-image-source
        path: source.txt

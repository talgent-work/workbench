name: CI

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
    inputs:
      build_all:
        type: boolean
        default: false
        description: Build all product images after tests pass.
      services:
        type: string
        default: ''
        description: Comma-separated images to build after tests; empty detects changes.

permissions:
  contents: write
  actions: write

# Cancel in-progress runs when a new commit is pushed to the same branch.
# Releases (auto-tag.yml) keep their own concurrency group that does NOT cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go lane: one environment compiles the images' binaries and runs the
  # script and unit tests, from one Go cache (.github/actions/go-cache).
  test:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - uses: ./.github/actions/go-cache
      id: go-cache
      with:
        name: ${{ github.job }}
        go-version: ${{ steps.go.outputs.go-version }}

    # Image Publish packages them once every check passed.
    - name: Compile the image binaries
      run: make image-binaries

    - uses: actions/upload-artifact@v4
      with:
        name: image-binaries
        path: bin/
        retention-days: 1
        if-no-files-found: error

    - name: Run tests
      # /tmp on the runner is a 4G tmpfs; a cold -race compile overflows it.
      env:
        TMPDIR: ${{ runner.temp }}
      run: make -j2 -Otarget test

    - name: Check the public tree for leaks
      env:
        TALGENT_REQUIRE_SECRET_SCAN: "1"
      run: |
        go install github.com/zricethezav/gitleaks/v8@v8.21.2
        PATH="$(go env GOPATH)/bin:${PATH}" make check-leaks

    - name: Verify Storage and Agent execution across controlplane and native UID boundaries
      run: |
        go test -race -c -o /tmp/talgent-storage.test ./internal/business/storage/infrastructure
        sudo -n /tmp/talgent-storage.test -test.v
        go test -race -c -o /tmp/talgent-agent-execution.test ./internal/business/agent/infrastructure/execution
        sudo -n /tmp/talgent-agent-execution.test -test.v

    - name: Save the Go caches of a new go.mod or go.sum
      if: ${{ !cancelled() && steps.go-cache.outputs.save-key != '' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.go-cache.outputs.save-key }}

  generate:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      generated_changed: ${{ steps.generate.outputs.generated_changed }}
    steps:
    - uses: actions/checkout@v6

    - name: Install Buf CLI
      uses: bufbuild/buf-action@v1.5.0
      with:
        version: 1.67.0
        setup_only: true

    # The Go generator runs from go.mod's tool directive.
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false

    - name: Generate protobuf code
      run: make generate

    - name: Commit generated files when safe
      id: generate
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_BRANCH: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        BUILD_ALL: ${{ inputs.build_all || false }}
        SERVICES: ${{ inputs.services || '' }}
      run: |
        set -euo pipefail

        if [ -z "$(git status --porcelain -- gen)" ]; then
          echo "Generated protobuf files are current."
          echo "generated_changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Generated protobuf files changed:"
        git status --short -- gen

        if [ "$REF_TYPE" != "branch" ] || [ "$HEAD_BRANCH" = "master" ] || [ -z "$HEAD_BRANCH" ]; then
          echo "Generated files are out of sync on a protected or unknown branch; refusing to commit from CI."
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add gen
        git commit -m "chore: regenerate protobuf files"
        git push origin "HEAD:$HEAD_BRANCH"
        echo "generated_changed=true" >> "$GITHUB_OUTPUT"

        echo "Dispatching CI for regenerated branch $HEAD_BRANCH."
        gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH" \
          -f "build_all=$BUILD_ALL" -f "services=$SERVICES"

  # The Web lane: one environment builds the web app the image takes, then
  # tests and lints it.
  frontend:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      run: make pnpm-install

    # Every workspace build type-checks its sources (tsc -b / tsc --noEmit),
    # so no separate type-check pass is needed.
    - name: Build (all workspaces)
      run: make frontend-build

    # Image Publish packages it once every check passed.
    - uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: apps/workbench-web/dist/
        retention-days: 1
        if-no-files-found: error

    - name: Test (all workspaces)
      run: make frontend-test

    - name: Lint (web, computer)
      run: make frontend-lint

  # Talgent Computer runs on the person's own machine: its suite runs on each
  # platform, and the packed package is installed, registered, brought online
  # and run as the background service against the stand-in Gateway there.
  computer:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10.14.0
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @talgent/computer...

    - name: Test
      run: pnpm --filter @talgent/computer test

    - name: Build
      run: pnpm --filter @talgent/computer run build

    # A runner has no login session, so its user's systemd manager runs only
    # once lingering is on, as on a person's machine that keeps the service
    # running while logged out.
    - name: Start the user's systemd manager
      if: runner.os == 'Linux'
      run: |
        sudo loginctl enable-linger "$USER"
        uid="$(id -u)"
        for _ in $(seq 1 50); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.2; done
        echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

    - name: Install, register, online and the background service from the packed package
      working-directory: apps/computer
      run: |
        npm pack
        npm install -g ./talgent-computer-*.tgz
        npm run test:installed

  integration-test:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - uses: ./.github/actions/go-cache
      id: go-cache
      with:
        name: ${{ github.job }}
        go-version: ${{ steps.go.outputs.go-version }}

    - name: Run integration tests with production storage ownership privileges
      run: |
        sudo -n env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" make test-integration

    - name: Save the Go caches of a new go.mod or go.sum
      if: ${{ !cancelled() && steps.go-cache.outputs.save-key != '' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.go-cache.outputs.save-key }}

  # A task payload's contract only grows within its version: it is compared
  # with the previous release.
  breaking:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install Buf CLI
      uses: bufbuild/buf-action@v1.5.0
      with:
        version: 1.67.0
        setup_only: true

    - name: Compare the contracts with the previous release
      run: |
        previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
        if [ -z "$previous" ]; then
          echo "No previous release to compare with."
          exit 0
        fi
        # A release before the contracts moved to their own repository holds
        # the task contracts under other names, so there is nothing to
        # compare with until a release with this layout exists.
        if git cat-file -e "${previous}:proto/talgent" 2>/dev/null; then
          echo "$previous predates the task contract layout; nothing to compare."
          exit 0
        fi
        echo "Comparing with $previous"
        make check-breaking BREAKING_AGAINST=".git#tag=${previous}"

  # Selection runs beside the checks; it publishes nothing.
  images:
    needs: [generate, image-baseline]
    uses: ./.github/workflows/image-build.yml
    with:
      compile: false
      build_all: ${{ inputs.build_all || false }}
      services: ${{ inputs.services || '' }}
      base_ref: ${{ needs.image-baseline.outputs.base_ref }}
    permissions:
      contents: read
      packages: read

  # Packages the binaries and web app the checks' environments built, only
  # once every check passed.
  publish:
    needs: [images, test, frontend, integration-test, breaking]
    uses: ./.github/workflows/image-publish.yml
    with:
      tag: ${{ needs.images.outputs.tag }}
      current_ref: ${{ needs.images.outputs.current_ref }}
      matrix: ${{ needs.images.outputs.matrix }}
      sandbox_required: ${{ needs.images.outputs.sandbox_required }}
      sandbox_base_required: ${{ needs.images.outputs.sandbox_base_required }}
      reuse: ${{ needs.images.outputs.reuse }}
      previous_tag: ${{ needs.images.outputs.previous_tag }}
    permissions:
      contents: read
      packages: write

  image-baseline:
    needs: generate
    if: needs.generate.outputs.generated_changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base_ref: ${{ steps.previous.outputs.base_ref }}
    steps:
    - uses: actions/checkout@v6
    - name: Find the last successful branch image build
      id: previous
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_BRANCH: ${{ github.ref_name }}
      run: python3 scripts/ci/previous-image-build.py

  record-image-baseline:
    needs: publish
    # A manually selected subset cannot advance the baseline for all images.
    if: inputs.services == '' || inputs.build_all == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Record the successfully built branch commit
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: printf '%s\n' "$SOURCE_SHA" > source.txt
    - uses: actions/upload-artifact@v4
      with:
        name: branch-image-source
        path: source.txt

name: Feature request
description: Something Talgent Workbench should let you do.
labels: ["kind/enhancement", "status/needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The work you want to get done and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine Workbench supporting it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
